  <script>
    // 상태 변수
    let currentMode = 'auto'; // 'auto' | 'preTax' | 'postTax'
    let calculatedData = {
      preTax: 0,
      tax: 0,
      postTax: 0,
      taxIncome: 0,
      taxLocal: 0,
      isTaxExempt: true,
      judgedAs: 'preTax'
    };

    // 로컬스토리지 키
    const STORAGE_KEY = 'vives-allowance-history';

    // DOM Elements
    const amountInput = document.getElementById('amountInput');
    const btnAuto = document.getElementById('btnAuto');
    const btnPreTax = document.getElementById('btnPreTax');
    const btnPostTax = document.getElementById('btnPostTax');
    const badgeBar = document.getElementById('badgeBar');
    const badgeText = document.getElementById('badgeText');
    const badgeLabel = document.getElementById('badgeLabel');
    const valPreTax = document.getElementById('valPreTax');
    const valTax = document.getElementById('valTax');
    const valPostTax = document.getElementById('valPostTax');
    const taxDetail = document.getElementById('taxDetail');
    const valTaxIncome = document.getElementById('valTaxIncome');
    const valTaxLocal = document.getElementById('valTaxLocal');
    const infoBox = document.getElementById('infoBox');
    const historyList = document.getElementById('historyList');

    // 초기화
    window.addEventListener('DOMContentLoaded', () => {
      // 콤마 및 입력 감지 바인딩
      amountInput.addEventListener('input', handleInput);
      
      // 로컬스토리지 불러오기
      renderHistory();

      // 해시 데이터가 있는 경우 공유된 값 로드
      loadSharedHash();
    });

    // 입력 처리
    function handleInput() {
      // 숫자 외 문자 제거
      let val = amountInput.value.replace(/[^0-9]/g, '');
      if (val === '') {
        amountInput.value = '';
        resetCalculations();
        return;
      }
      
      const num = parseInt(val, 10);
      amountInput.value = formatNumber(num);
      
      calculate(num);
    }

    // 천단위 콤마 포맷
    function formatNumber(num) {
      return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    // 모드 변경
    function setMode(mode) {
      currentMode = mode;
      
      // 세그먼트 버튼 활성화 처리
      [btnAuto, btnPreTax, btnPostTax].forEach(btn => btn.classList.remove('active'));
      if (mode === 'auto') btnAuto.classList.add('active');
      else if (mode === 'preTax') btnPreTax.classList.add('active');
      else if (mode === 'postTax') btnPostTax.classList.add('active');

      // 입력된 값이 있다면 재계산
      const rawVal = amountInput.value.replace(/[^0-9]/g, '');
      if (rawVal !== '') {
        calculate(parseInt(rawVal, 10));
      }
    }

    // 계산 및 판별 핵심 로직
    function calculate(num) {
      if (!num || num <= 0) {
        resetCalculations();
        return;
      }

      let modeToUse = currentMode;
      let judgedAs = '';

      // 1. 자동 판별 적용인 경우
      if (currentMode === 'auto') {
        // 천원 단위 미만이 0이 아니면 세후로 판단, 0이면 세전으로 판단
        if (num % 1000 !== 0) {
          modeToUse = 'postTax';
          judgedAs = 'postTax';
        } else {
          modeToUse = 'preTax';
          judgedAs = 'preTax';
        }
      }

      let preTax = 0;
      let tax = 0;
      let postTax = 0;
      let taxIncome = 0;
      let taxLocal = 0;
      let isTaxExempt = false;

      // 2. 세전 기준 계산
      if (modeToUse === 'preTax') {
        preTax = num;
        if (preTax <= 125000) {
          isTaxExempt = true;
          tax = 0;
          postTax = preTax;
        } else {
          isTaxExempt = false;
          // 소득세 10원 미만 절사
          taxIncome = Math.floor((preTax * 0.08) / 10) * 10;
          // 지방소득세 10원 미만 절사
          taxLocal = Math.floor((taxIncome * 0.1) / 10) * 10;
          tax = taxIncome + taxLocal;
          // 최종 실수령액 10원 미만 절사
          postTax = Math.floor((preTax - tax) / 10) * 10;
        }
      } 
      // 3. 세후 기준 계산 (역산)
      else {
        postTax = num;
        // 세전 125,000원 이하는 비과세이므로 세전 = 세후 동일
        if (postTax <= 125000) {
          isTaxExempt = true;
          preTax = postTax;
          tax = 0;
        } else {
          isTaxExempt = false;
          // 역산 수식: X = Y / 0.912 를 구한 뒤, 원천징수 원단위 절사 규칙에 맞게 보정
          let estimatedPreTax = Math.round(postTax / 0.912);
          
          // 역산된 세전 금액으로 다시 세금을 정방향 계산하여 세후가 일치하는지 미세 검증
          let tempTaxIncome = Math.floor((estimatedPreTax * 0.08) / 10) * 10;
          let tempTaxLocal = Math.floor((tempTaxIncome * 0.1) / 10) * 10;
          let tempTax = tempTaxIncome + tempTaxLocal;
          let tempPost = Math.floor((estimatedPreTax - tempTax) / 10) * 10;

          // 오차 보정 (+1/-1원 등)
          if (tempPost !== postTax) {
            const diff = postTax - tempPost;
            estimatedPreTax += Math.round(diff / 0.912);
            
            // 보정 후 다시 계산
            tempTaxIncome = Math.floor((estimatedPreTax * 0.08) / 10) * 10;
            tempTaxLocal = Math.floor((tempTaxIncome * 0.1) / 10) * 10;
            tempTax = tempTaxIncome + tempTaxLocal;
            tempPost = Math.floor((estimatedPreTax - tempTax) / 10) * 10;
          }

          preTax = Math.floor(estimatedPreTax / 10) * 10; // 세전 금액도 10원 단위로 공제/절사 처리
          taxIncome = tempTaxIncome;
          taxLocal = tempTaxLocal;
          tax = tempTax;
          postTax = Math.floor((preTax - tax) / 10) * 10;
        }
      }

      // 상태 저장
      calculatedData = {
        preTax,
        tax,
        postTax,
        taxIncome,
        taxLocal,
        isTaxExempt,
        judgedAs: judgedAs || modeToUse
      };

      // UI 업데이트
      updateUI();
    }

    // UI 동적 갱신
    function updateUI() {
      // 1. 값 표시
      valPreTax.innerHTML = `${formatNumber(calculatedData.preTax)} <span class="unit">원</span>`;
      valTax.innerHTML = `${formatNumber(calculatedData.tax)} <span class="unit">원</span>`;
      valPostTax.innerHTML = `${formatNumber(calculatedData.postTax)} <span class="unit">원</span>`;

      // 2. 세부 세금 내역 표시
      if (calculatedData.tax > 0) {
        valTaxIncome.textContent = formatNumber(calculatedData.taxIncome);
        valTaxLocal.textContent = formatNumber(calculatedData.taxLocal);
        taxDetail.style.display = 'block';
      } else {
        taxDetail.style.display = 'none';
      }

      // 3. 상태 바 텍스트 및 배지 처리
      badgeBar.className = 'badge-bar';
      if (currentMode === 'auto') {
        badgeBar.classList.add('auto-active');
        badgeLabel.className = 'pill-badge blue';
        badgeLabel.textContent = 'AUTO';
        if (calculatedData.judgedAs === 'preTax') {
          badgeText.innerHTML = `천원 단위 미만이 0이므로 <b>세전 금액(원금)</b>으로 판별함.`;
        } else {
          badgeText.innerHTML = `천원 단위 미만이 존재하여 <b>세후 금액(수령액)</b>으로 판별함.`;
        }
      } else {
        badgeBar.classList.add('manual-active');
        badgeLabel.className = 'pill-badge purple';
        badgeLabel.textContent = 'MANUAL';
        if (currentMode === 'preTax') {
          badgeText.textContent = '사용자 지정: 세전 금액 기준 계산';
        } else {
          badgeText.textContent = '사용자 지정: 세후 금액 기준 계산';
        }
      }

      // 4. 과세최저한 안내 박스 강조
      if (calculatedData.isTaxExempt) {
        infoBox.className = 'info-box tax-exempt';
        infoBox.innerHTML = '✅ <b>세금 미공제 대상</b>: 세전 수당이 125,000원 이하이므로 세금이 0원 처리되었습니다.';
      } else {
        infoBox.className = 'info-box';
        infoBox.innerHTML = '💡 <b>기타소득 과세최저한</b>: 세전 수당이 125,000원을 초과하여 8.8%의 원천징수 세금(기타소득세 8% + 지방소득세 0.8%)이 공제되었습니다.';
      }
    }

    function resetCalculations() {
      valPreTax.innerHTML = `0 <span class="unit">원</span>`;
      valTax.innerHTML = `0 <span class="unit">원</span>`;
      valPostTax.innerHTML = `0 <span class="unit">원</span>`;
      taxDetail.style.display = 'none';
      
      badgeBar.className = 'badge-bar auto-active';
      badgeLabel.className = 'pill-badge blue';
      badgeLabel.textContent = 'AUTO';
      badgeText.textContent = '금액을 입력하면 자동으로 판별합니다.';
      
      infoBox.className = 'info-box';
      infoBox.innerHTML = '💡 <b>기타소득 과세최저한</b>: 세전 금액이 125,000원 이하인 경우 세금이 부과되지 않으므로 세전과 세후 금액이 동일합니다.';
      
      calculatedData = {
        preTax: 0,
        tax: 0,
        postTax: 0,
        taxIncome: 0,
        taxLocal: 0,
        isTaxExempt: true,
        judgedAs: 'preTax'
      };
    }

    // 💾 로컬스토리지 저장
    function saveCurrentCalculation() {
      const rawVal = amountInput.value.replace(/[^0-9]/g, '');
      if (rawVal === '' || calculatedData.preTax === 0) {
        showToast('먼저 올바른 금액을 입력해 주세요.');
        return;
      }

      const history = getHistory();
      
      // 중복 계산 내역 검출 및 최신화
      const newEntry = {
        id: Date.now(),
        amount: parseInt(rawVal, 10),
        mode: currentMode,
        preTax: calculatedData.preTax,
        tax: calculatedData.tax,
        postTax: calculatedData.postTax,
        date: new Date().toLocaleString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
      };

      // 동일한 금액 계산 내역이 있으면 기존 데이터 제거 후 맨 위로 올림
      const filtered = history.filter(item => !(item.preTax === newEntry.preTax && item.postTax === newEntry.postTax));
      filtered.unshift(newEntry);
      
      // 최대 20개 저장
      if (filtered.length > 20) {
        filtered.pop();
      }

      localStorage.setItem(STORAGE_KEY, JSON.stringify(filtered));
      renderHistory();
      showToast('계산 내역이 저장되었습니다.');
    }

    // 최근 내역 렌더링
    function renderHistory() {
      const history = getHistory();
      if (history.length === 0) {
        historyList.innerHTML = '<div class="empty-history">최근 계산한 내역이 없습니다.</div>';
        return;
      }

      historyList.innerHTML = '';
      history.forEach(item => {
        const div = document.createElement('div');
        div.className = 'history-item';
        div.setAttribute('onclick', `loadHistoryItem(${item.preTax}, '${item.mode}')`);
        
        // 자동판별 모드로 저장했어도 다시 로드할 때 판별할 수 있게 로드
        div.innerHTML = `
          <div class="history-info">
            <span class="history-main-text">세전: ${formatNumber(item.preTax)}원 ➜ 실수령: ${formatNumber(item.postTax)}원</span>
            <span class="history-sub-text">세금: ${formatNumber(item.tax)}원 (${item.date})</span>
          </div>
          <button class="delete-btn" onclick="deleteHistoryItem(event, ${item.id})">삭제</button>
        `;
        historyList.appendChild(div);
      });
    }

    // 히스토리 항목 로드
    function loadHistoryItem(preTaxAmount, mode) {
      setMode(mode);
      amountInput.value = formatNumber(preTaxAmount);
      calculate(preTaxAmount);
      showToast('이전 계산 내역을 불러왔습니다.');
    }

    // 히스토리 아이템 삭제
    function deleteHistoryItem(e, id) {
      e.stopPropagation(); // 부모 클릭(로드) 이벤트 전파 방지
      const history = getHistory();
      const filtered = history.filter(item => item.id !== id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(filtered));
      renderHistory();
      showToast('내역을 삭제했습니다.');
    }

    // 히스토리 전체 삭제
    function clearAllHistory() {
      if (confirm('모든 계산 내역을 삭제하시겠습니까?')) {
        localStorage.removeItem(STORAGE_KEY);
        renderHistory();
        showToast('모든 내역이 삭제되었습니다.');
      }
    }

    // 히스토리 가져오기 헬퍼
    function getHistory() {
      const data = localStorage.getItem(STORAGE_KEY);
      return data ? JSON.parse(data) : [];
    }

    // vives-share 공유 기능 연동
    function loadSharedHash() {
      if (!window.location.hash) return;
      try {
        const hash = window.location.hash.substring(1);
        const decoded = JSON.parse(decodeURIComponent(atob(hash)));
        if (decoded && decoded.amount) {
          setMode(decoded.mode || 'auto');
          amountInput.value = formatNumber(decoded.amount);
          calculate(decoded.amount);
          showToast('공유된 계산 내역을 로드했습니다.');
        }
      } catch (err) {
        console.error('Failed to parse shared hash:', err);
      }
    }

    // 공유를 위한 해시 생성 오버라이드
    window.buildSharePayload = function() {
      const rawVal = amountInput.value.replace(/[^0-9]/g, '');
      if (rawVal === '' || calculatedData.preTax === 0) return null;
      
      return {
        amount: parseInt(rawVal, 10),
        mode: currentMode
      };
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>페이지를 찾을 수 없습니다 — eduin VIVES</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/common/hero-theme.css">
  <link rel="stylesheet" href="/common/app-shell.css">
  <script src="/common/theme.js"></script>
  <script src="/common/init.js"></script>
  <script src="/common/app-shell.js" defer></script>
  <style>
    #nf { visibility: hidden; text-align: center; }
    #nf .nf-emoji { font-size: 56px; margin-bottom: 12px; line-height: 1; }
    #nf-suggest { margin-top: 1.25rem; display: none; }
    .nf-suggest-card {
      display: flex; align-items: center; gap: 12px; text-decoration: none;
      padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px;
      background: var(--card-bg); color: var(--fg); transition: border-color .15s, transform .1s;
      text-align: left;
    }
    .nf-suggest-card:hover { border-color: var(--primary); transform: translateY(-1px); }
    .nf-suggest-emoji { font-size: 28px; line-height: 1; flex-shrink: 0; }
    .nf-suggest-title { font-weight: 700; display: block; }
    .nf-suggest-desc { font-size: .8rem; color: var(--fg-muted); margin-top: 3px; display: block; }
    .nf-suggest-label { font-size: .85rem; color: var(--fg-muted); margin-bottom: .6rem; }
  </style>
  <script>
    /* 옛 경로 → 새 경로 자동 전환 + 유사 앱 추천 (apps.json 기반, 정적 리다이렉트 목록 없음) */
    (function () {
      var path = location.pathname;
      if (path.indexOf('/apps/') === 0 || path === '/' || path === '') return;

      // 다운로드 자산 경로
      if (path.indexOf('/chrome-extentions/') === 0) {
        location.replace(path.replace('/chrome-extentions/', '/downloads/') + location.search + location.hash);
        return;
      }

      var slug = path.replace(/^\/+/, '').split('/')[0];

      fetch('/apps.json').then(function (r) { return r.json(); }).then(function (d) {
        var apps = d.apps || [];
        var pages = apps.filter(function (a) { return a.href && a.href.indexOf('/apps/') === 0; });
        var idOf = function (a) { var m = a.href.match(/^\/apps\/([^\/]+)\//); return m ? m[1] : a.id; };

        // 1) 정확 매치 → 즉시 전환 (해시·쿼리 보존)
        for (var i = 0; i < pages.length; i++) {
          if (idOf(pages[i]) === slug) { location.replace('/apps' + path + location.search + location.hash); return; }
        }

        // 2) 경로 + 리퍼럴로 유사 앱 추천
        showNotFound(pages, slug, idOf);
      }).catch(function () { showNotFound([], slug, null); });

      // ── Levenshtein 유사도 ──
      function lev(a, b) {
        var m = a.length, n = b.length, dp = [], i, j;
        for (i = 0; i <= m; i++) dp[i] = [i];
        for (j = 0; j <= n; j++) dp[0][j] = j;
        for (i = 1; i <= m; i++) for (j = 1; j <= n; j++)
          dp[i][j] = Math.min(dp[i-1][j] + 1, dp[i][j-1] + 1, dp[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
        return dp[m][n];
      }
      function sim(a, b) {
        a = (a || '').toLowerCase(); b = (b || '').toLowerCase();
        if (!a || !b) return 0;
        if (a === b) return 1;
        if (b.indexOf(a) >= 0 || a.indexOf(b) >= 0) return 0.85;
        return 1 - lev(a, b) / Math.max(a.length, b.length);
      }

      function bestMatch(pages, slug, idOf) {
        // 리퍼럴(같은 사이트 내 출처) 앱은 추천에서 제외 — 방금 떠나온 앱을 다시 권하지 않도록
        var fromId = null;
        try {
          if (document.referrer) {
            var u = new URL(document.referrer);
            if (u.origin === location.origin) {
              var m = u.pathname.match(/^\/apps\/([^\/]+)\//);
              if (m) fromId = m[1];
            }
          }
        } catch (e) { /* ignore */ }

        // 시도한 경로 slug를 앱 id/title과 퍼지 매칭(주 신호)
        var best = null, bestScore = 0;
        pages.forEach(function (a) {
          var id = idOf(a);
          if (id === fromId) return;
          [id, (a.title || ''), (a.id || '')].forEach(function (c) {
            var s = sim(slug, c);
            if (s > bestScore) { bestScore = s; best = a; }
          });
        });
        return bestScore >= 0.5 ? best : null;
      }

      var HEADINGS = [
        '길을 잃으셨나요? 🧭',
        '여긴 텅 비어 있어요 🌙',
        '이 페이지는 어디로 갔을까요? 🔍',
        '앗, 막다른 길이에요 🚧',
        '찾으시는 게 여기엔 없네요 🍃'
      ];

      var SUBMSGS = [
        '길을 잃으셨네요. 가끔은 헤매는 것도 괜찮아요.',
        '찾으시던 걸 못 드려서 미안해요. 대신 처음으로 돌아가는 길을 알려드릴게요.',
        '페이지는 찾지 못했지만, 당신은 잘 찾아오셨어요.',
        '없는 페이지를 찾아오셨군요. 그래도 이렇게 만난 것도 인연이에요.',
        '길을 잃은 건 당신이 아니라 이 페이지예요.'
      ];

      function showNotFound(pages, slug, idOf) {
        var h = document.getElementById('nf-heading');
        if (h) h.textContent = HEADINGS[Math.floor(Math.random() * HEADINGS.length)];
        var sub = document.getElementById('nf-sub');
        if (sub) sub.textContent = SUBMSGS[Math.floor(Math.random() * SUBMSGS.length)];

        var match = idOf ? bestMatch(pages, slug, idOf) : null;
        if (match) {
          var box = document.getElementById('nf-suggest');
          box.innerHTML =
            '<div class="nf-suggest-label">혹시 이 앱을 찾으시려고 했나요?</div>' +
            '<a class="nf-suggest-card" href="' + match.href + '">' +
              '<span class="nf-suggest-emoji">' + (match.emoji || '📦') + '</span>' +
              '<span><span class="nf-suggest-title">' + match.title + '</span>' +
              '<span class="nf-suggest-desc">' + (match.desc || '') + '</span></span>' +
            '</a>';
          box.style.display = 'block';
        }
        reveal();
      }

      function reveal() { var el = document.getElementById('nf'); if (el) el.style.visibility = 'visible'; }
      setTimeout(reveal, 3000);
    })();
  </script>
</head>
<body data-shell="column" data-width="narrow">
  <main class="app-main">
    <div id="nf" class="hero-card" style="padding:2.5rem 1.5rem;margin-top:2rem;">
      <div class="nf-emoji">🧭</div>
      <h1 id="nf-heading" class="app-title" style="justify-content:center;">페이지를 찾을 수 없어요</h1>
      <p id="nf-sub" class="app-desc">주소가 바뀌었거나 사라진 페이지예요.</p>
      <div id="nf-suggest"></div>
      <a href="/" class="hero-btn" style="margin-top:1.25rem;">🏠 홈에서 찾아보기</a>
    </div>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blocks Universe — eduin</title>
  <link rel="icon" href="/logo.jpg" type="image/jpeg">
  <link rel="stylesheet" href="/common/hero-theme.css">
  <link rel="stylesheet" href="style.css">
  <script src="/common/theme.js"></script>
  <script src="/common/init.js"></script>
</head>
<body>

<div class="top-overlay-left">
  <a href="/" class="overlay-btn" title="홈">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      <polyline points="9 22 9 12 15 12 15 22"/>
    </svg>
    <span>Home</span>
  </a>
</div>

<div class="top-overlay">
  <button id="themeToggleBtn" class="overlay-btn" onclick="cycleTheme()" title="보기 모드">💻</button>
  <button id="shareBtn" class="overlay-btn" onclick="shareCurrentPage()" title="공유">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
      <polyline points="16 6 12 2 8 6"/>
      <line x1="12" x2="12" y1="2" y2="15"/>
    </svg>
    <span>공유</span>
  </button>
</div>

<div class="bu-root">
  <header class="app-header">
    <span class="app-badge">◆ 학습지원</span>
    <h1 class="app-title">🧱 Blocks Universe</h1>
    <p class="app-desc">넘버블록스 · 알파블록스 · 컬러블록스 · 원더블록스 — 전체 에피소드를 만나보세요.</p>
  </header>

  <div id="welcomeBack" hidden>
    <button class="welcome-back-btn" onclick="goToWelcome()">← 시리즈 선택</button>
  </div>
  <nav class="series-tabs" id="seriesTabs" aria-label="시리즈 선택"></nav>

  <div id="toolbarSentinel" aria-hidden="true"></div>
  <div class="toolbar" id="toolbar">
    <div class="season-chips" id="seasonChips"></div>
    <div class="filter-row">
      <div class="level-seg" id="levelSeg"></div>
      <button class="fav-toggle" id="favToggle">★ 즐겨찾기</button>
      <div class="search-box">
        <input id="searchInput" type="search" placeholder="제목·설명 검색 (한글/영문)">
        <button class="ai-btn" id="aiSearchBtn" title="AI 검색">✨ AI 검색</button>
      </div>
    </div>
  </div>

  <div class="result-info" id="resultInfo"></div>
  <div class="ep-grid" id="epGrid"></div>
  <div class="empty-state" id="emptyState" hidden>조건에 맞는 에피소드가 없습니다 🤔</div>
</div>

<!-- 에피소드 상세 모달 -->
<div class="modal-backdrop" id="epModal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true">
    <div class="modal-video">
      <div id="modalVideoWrap" style="width:100%;height:100%"></div>
      <button class="modal-close" id="modalCloseBtn" title="닫기">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-tags" id="modalTags"></div>
      <h2 class="modal-title" id="modalTitle"></h2>
      <div class="modal-title-sub" id="modalTitleSub"></div>
      <p class="modal-desc" id="modalDesc"></p>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>
</div>

<!-- 재생목록 FAB -->
<button class="pl-fab" id="plFab" title="재생목록">
  ▶ 재생목록 <span class="pl-count" id="plCount">0</span>
</button>

<!-- 재생목록 드로어 -->
<aside class="pl-drawer" id="plDrawer">
  <div class="pl-head">
    <div style="flex:1">
      <h2>📋 내 재생목록 <small class="pl-total" id="plTotal"></small></h2>
      <input class="pl-title-input" id="plTitleInput" placeholder="재생목록 제목 (공유 시 표시)">
    </div>
    <button class="modal-close" id="plCloseBtn" style="position:static;background:var(--bg-sec);color:var(--fg)" title="닫기">✕</button>
  </div>
  <div class="pl-list" id="plList"></div>
  <div class="pl-foot">
    <button class="hero-btn" id="plPlayBtn">▶ 순차재생</button>
    <button class="hero-btn-ghost" id="plShareBtn">🔗 공유</button>
    <button class="hero-btn-ghost" id="plClearBtn">🗑</button>
  </div>
</aside>

<!-- 순차재생 오버레이 -->
<div class="player-overlay" id="playerOverlay" hidden>
  <div class="player-head">
    <h2 id="playerTitle">재생목록</h2>
    <button id="playerCloseBtn">✕ 닫기</button>
  </div>
  <div class="player-stage" id="playerStage"></div>
  <div class="player-controls">
    <button class="hero-btn-ghost" id="pcPrev" style="color:#fff;border-color:rgba(255,255,255,0.3);background:rgba(255,255,255,0.08)">⏮ 이전</button>
    <span class="pc-info" id="pcInfo"></span>
    <button class="hero-btn-ghost" id="pcNext" style="color:#fff;border-color:rgba(255,255,255,0.3);background:rgba(255,255,255,0.08)">다음 ⏭</button>
  </div>
  <div class="player-queue" id="playerQueue"></div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
<script src="/common/seo-injector.js" defer></script>
</body>
</html>

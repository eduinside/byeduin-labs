<style>
  :root {
    --bg: #FFF9F0;
    --sky: #C8E6FF;
    --yellow: #FFD93D;
    --orange: #FF8C00;
    --red: #FF4757;
    --green: #2ED573;
    --blue: #1E90FF;
    --purple: #A855F7;
    --dark: #2D2D2D;
    --paper: #FFFDF8;
    --shadow: 4px 4px 0px #2D2D2D;
    --side-w: 400px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Dongle', sans-serif;
    background: var(--bg);
    color: var(--dark);
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 10% 20%, #FFE0B2 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, #C8E6FF 0%, transparent 40%);
  }
  body.exploring { overflow: hidden; }
  h1, h2, h3 { font-weight: 700; }

  /* ===== 인트로 ===== */
  .wrap { max-width: 620px; margin: 0 auto; padding: 20px 16px 60px; }
  .intro { text-align: center; padding-top: 56px; animation: fadeUp .6s ease both; }
  .intro .hero-art { font-size: 84px; line-height: 1; animation: bounce 2.4s ease-in-out infinite; }
  .intro h1 {
    font-size: 60px; margin: 10px 0 2px; color: var(--dark);
    letter-spacing: 1px; text-shadow: 4px 4px 0 var(--blue); line-height: 1;
  }
  .intro .sub { font-size: 28px; color: #666; margin-bottom: 20px; line-height: 1.3; font-weight: 700; }
  .lesson-tag {
    display: inline-block; background: var(--dark); color: var(--sky);
    font-size: 24px; padding: 4px 20px; border-radius: 99px; margin-bottom: 18px; line-height: 1.3;
  }
  .mission-card {
    background: var(--paper); border: 3px dashed var(--blue); border-radius: 22px;
    padding: 18px 22px; text-align: left; margin: 0 auto 26px; box-shadow: var(--shadow);
  }
  .mission-card h3 { color: var(--blue); font-size: 30px; margin-bottom: 6px; line-height: 1.1; }
  .mission-card li { margin: 4px 0 4px 22px; line-height: 1.25; font-size: 25px; }
  .mission-card b { color: var(--red); }

  /* ===== 버튼 ===== */
  .btn {
    font-family: 'Dongle', sans-serif; font-size: 30px; line-height: 1.1;
    border: 3px solid var(--dark); cursor: pointer;
    border-radius: 99px; padding: 10px 36px; transition: transform .12s, box-shadow .12s;
    box-shadow: var(--shadow); background: white; color: var(--dark);
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--dark); }
  .btn:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--dark); }
  .btn-primary { background: var(--green); }
  .btn-blue { background: var(--blue); color: white; }

  /* ===== 탐험 레이아웃 ===== */
  .explore {
    display: none;
    grid-template-columns: 1fr var(--side-w);
    width: 100vw; height: 100vh; height: 100dvh;
    animation: fadeUp .4s ease both;
  }
  body.exploring .explore { display: grid; }
  body.exploring .wrap { display: none; }
  .stage-zone {
    position: relative; min-width: 0; overflow: hidden;
    background:
      radial-gradient(circle at 20% 15%, rgba(30,144,255,.10) 0, transparent 35%),
      radial-gradient(circle at 80% 85%, rgba(255,217,61,.28) 0, transparent 45%),
      linear-gradient(180deg, #FFF9F0 0%, #EAF3FF 100%);
  }
  .viewer-title {
    position: absolute; top: 56px; left: 14px; z-index: 5;
    background: var(--dark); color: #fff; border-radius: 14px; padding: 4px 16px;
    font-size: 27px; line-height: 1.2; display: flex; align-items: center; gap: 9px;
    box-shadow: var(--shadow);
  }
  .viewer-title .num {
    background: var(--blue); min-width: 26px; height: 26px; border-radius: 50%; padding: 0 4px;
    display: inline-flex; align-items: center; justify-content: center; font-size: 18px;
  }
  .stage-canvas {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding: 96px 28px 60px; overflow: auto;
  }
  .stage-hint {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 5;
    background: rgba(45,45,45,.85); color: #fff; font-size: 23px; line-height: 1.2;
    border-radius: 99px; padding: 6px 20px; white-space: nowrap; max-width: calc(100% - 24px);
    overflow: hidden; text-overflow: ellipsis;
  }
  .stage-number {
    font-family: 'Dongle', sans-serif; font-size: 130px; line-height: 1;
    color: var(--orange); text-shadow: 6px 6px 0 var(--dark); animation: bounce .6s ease;
  }
  .stage-number.small { font-size: 90px; }
  .hint { font-size: 30px; color: #999; font-weight: 700; text-align: center; line-height: 1.3; }

  /* 무대: 배지 그리드 */
  .badge-grid { display: flex; flex-direction: column; gap: 10px; width: min(520px, 100%); }
  .club-badge {
    display: flex; align-items: stretch; border: 3px solid var(--dark); border-radius: 14px;
    box-shadow: 3px 3px 0 var(--dark); overflow: hidden;
    animation: popIn .4s cubic-bezier(.36,1.56,.64,1) both; min-height: 76px;
  }
  .badge-emoji {
    flex-shrink: 0; width: 76px; min-width: 76px; padding: 12px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.05); border-right: 3px solid rgba(0,0,0,.1);
  }
  .badge-header { display: flex; flex-direction: column; justify-content: center; gap: 2px; flex: 1; padding: 8px 14px; }
  .badge-name { font-size: 28px; line-height: 1.05; font-weight: 900; }
  .badge-reason { font-size: 22px; line-height: 1.2; opacity: .9; word-break: keep-all; }
  .no-club-msg { font-size: 30px; color: #999; text-align: center; padding: 10px; }

  /* 무대: 클럽 상세 */
  .club-detail {
    background: var(--paper); border: 3px solid var(--dark); border-radius: 24px;
    box-shadow: var(--shadow); padding: 24px 28px; width: min(560px, 100%);
    animation: popIn .35s cubic-bezier(.36,1.56,.64,1) both;
  }
  .club-detail-head { display: flex; align-items: center; gap: 16px; margin-bottom: 10px; }
  .club-detail-icon { width: 72px; height: 72px; flex-shrink: 0; border-radius: 18px; border: 3px solid var(--dark); display: flex; align-items: center; justify-content: center; padding: 8px; }
  .club-detail-head h3 { font-size: 40px; line-height: 1; }
  .club-detail-head p { font-size: 22px; color: #888; line-height: 1.1; }
  .club-detail .desc-ko { font-size: 27px; line-height: 1.3; margin-bottom: 6px; word-break: keep-all; }
  .club-detail .desc-en { font-size: 20px; color: #999; line-height: 1.3; margin-bottom: 12px; }
  .examples-label { font-size: 24px; font-weight: 900; color: #555; margin-bottom: 6px; }
  .examples-chips { display: flex; flex-wrap: wrap; gap: 6px; max-height: 150px; overflow-y: auto; }
  .num-chip {
    font-size: 22px; line-height: 1.1; padding: 2px 12px; border-radius: 999px;
    border: 2px solid var(--dark); background: var(--sky); box-shadow: 2px 2px 0 var(--dark); color: var(--dark);
  }

  /* ===== 사이드바 ===== */
  .side {
    background: var(--paper); border-left: 3px solid var(--dark);
    overflow-y: auto; display: flex; flex-direction: column;
    box-shadow: -8px 0 24px rgba(45,45,45,.12);
  }
  .side-head {
    background: linear-gradient(135deg, var(--blue) 0%, #1565C0 100%);
    color: #fff; padding: 18px 22px 14px; position: relative; overflow: hidden; flex-shrink: 0;
  }
  .side-head::after {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 80% -20%, rgba(255,217,61,.35) 0, transparent 55%);
  }
  .side-head .flag { font-size: 22px; line-height: 1.1; opacity: .9; position: relative; z-index: 1; }
  .side-head h2 { font-size: 38px; line-height: 1.05; margin: 2px 0 0; position: relative; z-index: 1; }
  .side-body { padding: 16px 20px 26px; flex: 1; }

  .mode-pills { display: flex; gap: 8px; margin-bottom: 14px; }
  .mode-pill {
    flex: 1; font-family: 'Dongle', sans-serif; font-size: 25px; line-height: 1.1;
    padding: 8px 4px; border: 3px solid var(--dark); border-radius: 99px; cursor: pointer;
    background: white; color: var(--dark); box-shadow: 3px 3px 0 var(--dark);
    transition: transform .1s, box-shadow .1s, background .2s;
    -webkit-tap-highlight-color: transparent;
  }
  .mode-pill:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--dark); }
  .mode-pill.active { background: var(--yellow); }

  .observe-box {
    background: #EAF3FF; border: 2px solid var(--blue); border-radius: 16px;
    padding: 12px 16px 10px; margin-bottom: 14px;
  }
  .observe-box h3 { font-size: 26px; line-height: 1.1; color: #1565C0; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
  .observe-box p { font-size: 24px; line-height: 1.25; }
  .tip-box {
    background: #FFF7E0; border: 2px solid var(--orange); border-radius: 16px;
    padding: 10px 15px; margin-bottom: 14px; font-size: 22px; line-height: 1.3; color: #8A5A00;
  }
  .tip-box b { color: #B06A00; }

  /* 클럽 목록(사이드바) */
  .club-list { display: flex; flex-direction: column; gap: 8px; }
  .club-row {
    display: flex; align-items: center; gap: 10px; padding: 6px 12px;
    border: 3px solid var(--dark); border-radius: 14px; cursor: pointer;
    box-shadow: 3px 3px 0 var(--dark); transition: transform .1s, box-shadow .1s;
    color: white;
  }
  .club-row:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--dark); }
  .club-row.sel { outline: 3px solid var(--yellow); outline-offset: -1px; }
  .club-row .ic { width: 34px; height: 34px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .club-row .names { flex: 1; min-width: 0; }
  .club-row .ko { font-size: 25px; line-height: 1; font-weight: 900; text-shadow: 1px 1px 0 rgba(0,0,0,.25); }
  .club-row .en { font-size: 17px; line-height: 1.1; opacity: .85; }

  /* 숫자 탐색: 넘패드 */
  .num-display-box {
    background: white; border: 3px solid var(--dark); border-radius: 18px;
    box-shadow: var(--shadow); padding: 4px 20px; text-align: center; margin-bottom: 12px;
  }
  .num-display-val {
    font-size: 62px; line-height: 1.15; color: var(--orange);
    text-shadow: 3px 3px 0 var(--dark); min-height: 1.15em; letter-spacing: 3px;
  }
  .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .np-btn {
    font-family: 'Dongle', sans-serif; font-size: 34px; line-height: 1; padding: 10px;
    border: 3px solid var(--dark); border-radius: 14px; cursor: pointer;
    box-shadow: 3px 3px 0 var(--dark); background: white; color: var(--dark);
    transition: transform .08s, box-shadow .08s;
  }
  .np-btn:hover { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 var(--dark); }
  .np-btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--dark); }
  .np-zero { background: var(--sky); }
  .np-del { background: var(--yellow); }
  .np-clear { background: var(--red); color: white; }
  .check-row { text-align: center; }

  /* 퀴즈 (volcano 계승) */
  .progress-zone { margin-bottom: 14px; }
  .progress-track { height: 12px; background: #E4ECF6; border: 2px solid var(--dark); border-radius: 99px; overflow: hidden; }
  .progress-fill {
    height: 100%; border-radius: 99px; min-width: 8px;
    background: linear-gradient(90deg, var(--sky), var(--blue));
    transition: width .5s cubic-bezier(.6,0,.3,1.4);
  }
  .progress-label { display: flex; justify-content: space-between; font-size: 21px; color: #888; margin-top: 4px; line-height: 1.1; }

  .quiz-q { text-align: center; font-size: 28px; line-height: 1.2; margin-bottom: 12px; }
  .quiz-choices { display: flex; flex-direction: column; gap: 10px; margin-bottom: 6px; }
  .choice-btn {
    font-family: 'Dongle', sans-serif; font-size: 26px; line-height: 1.1; padding: 8px 14px;
    border: 3px solid var(--dark); border-radius: 14px; cursor: pointer;
    box-shadow: 3px 3px 0 var(--dark); background: white; color: var(--dark);
    transition: transform .1s, box-shadow .1s;
    display: flex; align-items: center; gap: 10px; word-break: keep-all; text-align: left;
  }
  .choice-btn:hover:not(:disabled) { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 var(--dark); }
  .choice-btn:disabled { cursor: not-allowed; }
  .choice-btn.correct-ans { background: var(--green) !important; }
  .choice-btn.wrong-ans { background: var(--red) !important; color: white; }
  .choice-emoji { width: 34px; height: 34px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }

  .reveal { animation: popIn .45s cubic-bezier(.5,0,.3,1.5) both; }
  .reveal-banner {
    text-align: center; border-radius: 18px; padding: 8px; font-size: 29px; line-height: 1.15;
    margin: 10px 0; border: 3px solid;
  }
  .reveal-banner.correct { background: #E3F5EA; color: #14813F; border-color: var(--green); }
  .reveal-banner.wrong { background: #FDEAEA; color: #C0392B; border-color: var(--red); }
  .explain { font-size: 24px; line-height: 1.35; background: #F2F6FB; border-radius: 14px; padding: 11px 15px; }
  .explain b { color: #1565C0; }
  .next-zone { text-align: center; margin-top: 12px; }

  .result { text-align: center; animation: fadeUp .5s ease both; }
  .result h2 { font-size: 40px; color: var(--blue); margin: 6px 0 0; line-height: 1.1; }
  .result .score { font-size: 30px; color: #888; margin-bottom: 14px; line-height: 1.1; }
  .summary-box {
    background: var(--dark); color: #EAF3FF; border-radius: 18px;
    padding: 14px 18px; text-align: left; margin-bottom: 16px;
  }
  .summary-box h3 { color: var(--yellow); font-size: 27px; line-height: 1.1; margin-bottom: 6px; }
  .summary-box p { font-size: 23px; line-height: 1.35; }
  .summary-box b { color: #FFD98A; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes popIn { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: scale(1); } }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

  /* ===== 토스트 ===== */
  #cbToast {
    position: fixed; bottom: 1.5rem; left: 50%;
    transform: translateX(-50%) translateY(1rem);
    background: var(--dark); color: white; padding: 4px 22px;
    border-radius: 999px; font-family: 'Dongle', sans-serif; font-size: 25px; line-height: 1.3;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    z-index: 9000; white-space: nowrap;
  }
  #cbToast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== 태블릿·모바일 ===== */
  @media (max-width: 900px) {
    body.exploring { overflow: auto; }
    body.exploring .explore { display: flex; flex-direction: column; height: auto; min-height: 100vh; }
    .stage-zone { position: sticky; top: 0; z-index: 40; height: 46vh; min-height: 300px; flex-shrink: 0; }
    .stage-canvas { padding: 70px 14px 56px; justify-content: flex-start; }
    .side { border-left: none; border-top: 3px solid var(--dark); }
    .intro h1 { font-size: 44px; }
    .viewer-title { font-size: 23px; padding: 3px 13px; }
    .stage-number { font-size: 90px; }
    .badge-emoji { width: 60px; min-width: 60px; padding: 9px; }
  }

  button:focus-visible, a:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition-duration: .001s !important; }
  }
</style>

<body data-shell="immersive">

<!-- 플로팅 크롬(홈·공유)은 app-shell.js가 주입 — 음소거 버튼은 크롬으로 끌어올려짐 -->
<div class="app-actions">
  <button class="overlay-btn" id="muteBtn" onclick="toggleMute()" title="소리 켜기/끄기" aria-label="소리 켜기/끄기" aria-pressed="false"></button>
</div>

<div id="cbToast"></div>

<!-- ===== 인트로 ===== -->
<div class="wrap">
  <div class="intro">
    <div class="hero-art">🏅</div>
    <h1>Club Badge</h1>
    <p class="sub">넘버블록스 클럽 멤버십 탐색기</p>
    <div class="lesson-tag">숫자마다 어떤 클럽에 속해 있을까요?</div>
    <div class="mission-card">
      <h3>🧭 탐험 방법</h3>
      <ol>
        <li><b>클럽 소개</b>에서 짝수 클럽, 세제곱 클럽 같은 16개 클럽을 구경해요.</li>
        <li><b>숫자 탐색</b>에서 아무 숫자나 입력하면 그 수가 속한 <b>클럽 배지</b>가 무대에 나타나요!</li>
        <li>준비가 되면 <b>퀴즈 10문제</b>로 클럽 찾기 실력을 확인해요!</li>
      </ol>
    </div>
    <button class="btn btn-primary" onclick="startExplore()">탐험 시작! 🚀</button>
  </div>
</div>

<!-- ===== 탐험: 무대 + 사이드바 ===== -->
<div class="explore">
  <div class="stage-zone">
    <div class="viewer-title" id="viewerTitle"><span class="num">📖</span> 클럽 소개</div>
    <div class="stage-canvas" id="stageCanvas"></div>
    <div class="stage-hint" id="stageHint">👆 오른쪽에서 클럽을 골라 보세요!</div>
  </div>
  <aside class="side">
    <div class="side-head">
      <div class="flag">넘버블럭스 · 수의 성질</div>
      <h2>🏅 Club Badge</h2>
    </div>
    <div class="side-body">
      <div class="mode-pills">
        <button class="mode-pill active" id="pill-info" onclick="setMode('info')">📖 클럽</button>
        <button class="mode-pill" id="pill-explorer" onclick="setMode('explorer')">🔢 탐색</button>
        <button class="mode-pill" id="pill-quiz" onclick="setMode('quiz')">🎯 퀴즈</button>
      </div>
      <div id="sideContent"></div>
    </div>
  </aside>
</div>

<script>
/* ──────────────────────── 효과음 (Web Audio) + 음소거 ──────────────────────── */
var SND_KEY = 'clubs.muted';
var muted = false; try { muted = localStorage.getItem(SND_KEY) === '1'; } catch (e) {}
var actx = null;
function ac() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, dur, type, gain, delay) {
  var c = ac(); if (!c || muted) return;
  var t = c.currentTime + (delay || 0);
  var o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain || 0.14, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination);

/* ──────────────────────── 클럽 이유 ──────────────────────── */
function getClubReason(club, n) {
  if (club.id === 'made-of-ones') return '1 이상의 모든 수예요.';
  if (club.id === 'even-tops') return `${n} ÷ 2 = ${n/2} (나누어떨어짐)`;
  if (club.id === 'odd-tops') return `${n}은 홀수예요!`;
  if (club.id === 'three-club') return `${n} ÷ 3 = ${n/3} (나누어떨어짐)`;
  if (club.id === 'rainbow-sevens') return `${n} ÷ 7 = ${n/7} (나누어떨어짐)`;
  if (club.id === 'football-club') return `${n} ÷ 11 = ${n/11} (나누어떨어짐)`;
  if (club.id === 'falling-apart') return `${n} ÷ 13 = ${n/13} (나누어떨어짐)`;
  if (club.id === 'square-club') {
    const sqrt = Math.sqrt(n);
    return `√${n} = ${sqrt} (완전제곱수)`;
  }
  if (club.id === 'step-squad') {
    for (let k = 1; k * (k+1) / 2 <= n; k++) {
      if (k * (k+1) / 2 === n) return `1+2+...+${k} = ${n} (삼각수)`;
    }
  }
  if (club.id === 'cube-club') {
    const cbrt = Math.round(Math.cbrt(n));
    return `∛${n} = ${cbrt} (완전세제곱수)`;
  }
  if (club.id === 'squares-holes') {
    if (n % 2 !== 0) {
      const a = (n + 1) / 2;
      const b = (n - 1) / 2;
      return `${n} = ${a}² - ${b}² (${a * a} - ${b * b})`;
    } else if (n % 4 === 0) {
      const a = (n / 4) + 1;
      const b = (n / 4) - 1;
      return `${n} = ${a}² - ${b}² (${a * a} - ${b * b})`;
    }
    return `${n} = a² - b² 형태`;
  }
  if (club.id === 'super-rect') {
    let count = 0;
    for (let i = 1; i * i <= n; i++) {
      if (n % i === 0) count += (i === n/i) ? 1 : 2;
    }
    return `약수 ${count}개 (6개 이상으로 슈퍼 직사각형 모양 생성)`;
  }
  if (club.id === 'super-duper') {
    let count = 0;
    for (let i = 1; i * i <= n; i++) {
      if (n % i === 0) count += (i === n/i) ? 1 : 2;
    }
    return `약수 ${count}개 (8개 이상으로 초특급 직사각형 모양 생성)`;
  }
  if (club.id === 'prime-club') return '1과 자기 자신으로만 나누어떨어지는 수예요. (소수)';
  if (club.id === 'roaring-twenties') return '20 ≤ ' + n + ' ≤ 29';
  if (club.id === 'nine-enders') return `${n}의 일의 자리는 9예요.`;
  return '';
}

/* ──────────────────────── 퀴즈 ──────────────────────── */
function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function startQuiz() {
  quizIdx = 0; quizScore = 0;
  nextQuizQuestion();
}
function nextQuizQuestion() {
  qzAnswered = false;
  qzCurrentN = 1 + Math.floor(Math.random() * 100); // 1~100 (0은 짝수성 논쟁 소지로 제외)

  // 정답 클럽 선정 (1로 이루어진 클럽 제외 - 모든 수가 포함되므로)
  const correctCandidates = CLUBS.filter(c => c.check(qzCurrentN) && c.id !== 'made-of-ones');
  qzCorrectClub = correctCandidates.length > 0
    ? correctCandidates[Math.floor(Math.random() * correctCandidates.length)]
    : CLUBS.find(c => c.id === 'made-of-ones');

  // 오답 2개 — 반드시 n이 속하지 '않는' 클럽에서만 선정
  let wrongPool = shuffleArray(CLUBS.filter(c => !c.check(qzCurrentN)));
  if (wrongPool.length < 2) {
    wrongPool = wrongPool.concat(shuffleArray(CLUBS.filter(c => c.id !== qzCorrectClub.id && !wrongPool.includes(c))));
  }
  const choices = shuffleArray([qzCorrectClub, ...wrongPool.slice(0, 2)]);

  viewerTitle().innerHTML = `<span class="num">${quizIdx + 1}</span> 퀴즈 ${quizIdx + 1} / ${QUIZ_TOTAL}`;
  stageCanvas().innerHTML = `<div class="stage-number">${qzCurrentN}</div>`;
  stageHint().textContent = '🤔 이 수는 어떤 클럽의 멤버일까요?';

  sideContent().innerHTML = `
    <div class="progress-zone">
      <div class="progress-track"><div class="progress-fill" style="width:${quizIdx / QUIZ_TOTAL * 100}%"></div></div>
      <div class="progress-label"><span>퀴즈 진행 중</span><span>${quizIdx + 1} / ${QUIZ_TOTAL}</span></div>
    </div>
    <div class="quiz-q">무대의 <b style="color:var(--orange);">${qzCurrentN}</b>이(가) 멤버인 클럽을 고르세요!</div>
    <div class="quiz-choices" id="quizChoices"></div>
    <div id="quizReveal"></div>`;

  const choicesEl = document.getElementById('quizChoices');
  choices.forEach(club => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.dataset.clubId = club.id;
    btn.style.background = club.color + '22';
    btn.innerHTML = `<div class="choice-emoji">${getClubIcon(club.id, club.textColor)}</div><span>${club.nameKo}</span>`;
    btn.addEventListener('click', () => selectChoice(club, btn));
    choicesEl.appendChild(btn);
  });
  sfx('move');
}
function selectChoice(club, btnEl) {
  if (qzAnswered) return;
  qzAnswered = true;
  const isCorrect = (club.id === qzCorrectClub.id);
  if (isCorrect) { quizScore++; sfx('done'); setTimeout(() => sfx('star'), 220); } else { sfx('wrong'); }

  document.querySelectorAll('.choice-btn').forEach(b => {
    b.disabled = true;
    if (b.dataset.clubId === qzCorrectClub.id) { b.classList.add('correct-ans'); b.style.background = ''; }
  });
  if (!isCorrect) { btnEl.classList.add('wrong-ans'); btnEl.style.background = ''; }

  // 무대: 이 수가 속한 모든 클럽 배지 공개
  const matches = CLUBS.filter(c => c.check(qzCurrentN));
  stageCanvas().innerHTML = `
    <div class="stage-number small">${qzCurrentN}</div>
    ${badgeGridHtml(qzCurrentN, matches)}`;
  stageHint().textContent = `🏅 ${qzCurrentN}의 클럽 배지가 모두 공개됐어요!`;

  const reason = getClubReason(qzCorrectClub, qzCurrentN);
  document.getElementById('quizReveal').innerHTML = `
    <div class="reveal">
      <div class="reveal-banner ${isCorrect ? 'correct' : 'wrong'}">
        ${isCorrect ? '🎉 딩동댕! 정답이에요!' : '🤔 아쉬워요!'}
      </div>
      <div class="explain"><b>${qzCurrentN}</b>은(는) <b>${qzCorrectClub.nameKo}</b>의 멤버예요. ${reason}<br>무대에서 ${qzCurrentN}의 배지를 모두 확인해 보세요!</div>
      <div class="next-zone">
        <button class="btn btn-primary" onclick="afterQuestion()">
          ${quizIdx === QUIZ_TOTAL - 1 ? '결과 보기 🏁' : '다음 문제! ➡️'}
        </button>
      </div>
    </div>`;
}
function afterQuestion() {
  quizIdx++;
  if (quizIdx >= QUIZ_TOTAL) { renderResult(); return; }
  nextQuizQuestion();
}
function renderResult() {
  viewerTitle().innerHTML = '🏆 탐험 완료!';
  stageCanvas().innerHTML = `<div style="text-align:center;">
    <div style="font-size:110px;line-height:1;">🏆</div>
    <div class="stage-number small" style="font-size:64px;">${quizScore} / ${QUIZ_TOTAL}</div>
  </div>`;
  stageHint().textContent = '🏅 클럽 탐험을 완료했어요!';
  if (quizScore >= 8) sfx('stamp');
  sideContent().innerHTML = `
    <div class="result">
      <h2>🏆 퀴즈 완료!</h2>
      <div class="score">${QUIZ_TOTAL}개 중 ${quizScore}개 맞혔어요</div>
      <div class="summary-box">
        <h3>📚 오늘의 배움 정리</h3>
        <p>수마다 <b>나누어떨어짐(배수)</b>, <b>제곱수·삼각수</b>, <b>소수</b> 같은 성질이 있어요.
        같은 성질을 가진 수들이 하나의 <b>클럽</b>이 되고, 한 수가 여러 클럽에 속하기도 해요!</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <button class="btn btn-primary" onclick="startQuiz()">다시 도전하기 🔄</button>
        <button class="btn" onclick="setMode('explorer')">🔢 숫자 탐색으로</button>
      </div>
    </div>`;
  document.querySelector('.side').scrollTo({ top: 0 });
}

/* ──────────────────────── 시작 ──────────────────────── */
function startExplore() {
  document.body.classList.add('exploring');
  setMode('info');
  sfx('done');
}

/* ──────────────────────── 초기화 ──────────────────────── */
syncMuteBtn();
</script>
</body>
</html>

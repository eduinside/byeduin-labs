<style>
  /* 계단 수 만들기 — 시뮬레이션 공통 규약 v2(밝은 화면 고정, 무대 + 조작판, .sk-btn)
     글꼴: 사이트 기본 글꼴(hero-theme, 한글 포함). 예전 Fredoka One은 한글이 없어 cursive 대체 글꼴이 섞였다. */
  :root {
    --ss-accent: #7c3aed;
    --ss-accent-h: #6425d0;
    --ss-accent-soft: #f3edff;
    --ss-orange: #f08a00;
    --ss-panel: #ffffff;
    --ss-panel-border: #e4e4e7;
    --ss-stage-bg: #fdf9f2;
    --ss-text: #2c2f36;
    --ss-text-muted: #6b7280;
    --ss-btn-bg: #f4f4f5;
    --ss-side-w: 380px;
    --sk-accent: var(--ss-accent);
    --sk-ring: rgba(124, 58, 237, 0.28);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { background: var(--ss-stage-bg); color: var(--ss-text); min-height: 100vh; }
  body.exploring { overflow: hidden; }
  h1, h2, h3 { font-weight: 800; letter-spacing: -0.01em; }
  b { font-weight: 800; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes popIn { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: scale(1); } }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

  /* ===== 인트로 (.sk-screen) ===== */
  .intro-screen {
    text-align: center;
    background:
      radial-gradient(circle at 20% 25%, rgba(240,138,0,0.10) 0, transparent 40%),
      radial-gradient(circle at 80% 75%, rgba(124,58,237,0.08) 0, transparent 38%),
      var(--ss-stage-bg);
    animation: fadeUp .5s ease both;
  }
  body.exploring .intro-screen { display: none; }
  .intro-inner { width: 100%; max-width: 460px; display: flex; flex-direction: column; align-items: center; }
  .intro-tag { display: inline-block; background: var(--ss-accent); color: #fff; font-size: 14px; font-weight: 700; padding: 5px 14px; border-radius: 99px; margin-bottom: 14px; }
  .intro-screen h1 { font-size: 30px; line-height: 1.25; margin-bottom: 6px; }
  .intro-screen h1 .app-title-en { display: block; font-size: 16px; font-weight: 600; color: var(--ss-text-muted); margin-top: 2px; }
  .intro-sub { font-size: 15px; color: var(--ss-text-muted); line-height: 1.6; margin-bottom: 16px; }
  .intro-stair { display: flex; justify-content: center; align-items: flex-end; gap: 5px; margin: 0 0 18px; }
  .intro-stair .col { display: flex; flex-direction: column; gap: 3px; }
  .intro-card {
    width: 100%; background: var(--ss-panel); border: 2px dashed var(--ss-orange);
    border-radius: 18px; padding: 16px 20px; text-align: left; margin-bottom: 20px;
  }
  .intro-card h3 { color: #b46400; font-size: 16px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .intro-card ol { padding-left: 20px; }
  .intro-card li { margin: 4px 0; line-height: 1.6; font-size: 15px; }
  .intro-card b { color: var(--ss-accent-h); }
  .intro-screen .sk-btn--primary { min-width: 200px; min-height: 52px; font-size: 17px; border-radius: 99px; }

  /* ===== 탐험: 무대 + 조작판 ===== */
  .explore {
    display: none;
    grid-template-columns: 1fr var(--ss-side-w);
    width: 100vw; height: 100vh; height: 100dvh;
    animation: fadeUp .4s ease both;
  }
  body.exploring .explore { display: grid; }
  .stage-zone {
    position: relative; min-width: 0; min-height: 0; overflow: hidden;
    background-color: var(--ss-stage-bg);
    background-image:
      radial-gradient(rgba(240,138,0,0.12) 1.5px, transparent 1.5px),
      radial-gradient(rgba(124,58,237,0.10) 1.5px, transparent 1.5px);
    background-size: 32px 32px;
    background-position: 0 0, 16px 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .viewer-title {
    position: absolute; top: 56px; left: 14px; z-index: 5; max-width: calc(100% - 28px);
    background: rgba(38,50,56,0.80); color: #fff; border-radius: 14px; padding: 7px 14px;
    font-size: 15px; font-weight: 700; line-height: 1.2; display: flex; align-items: center; gap: 8px;
    border: 1px solid rgba(255,255,255,0.2);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .viewer-title .num {
    background: var(--ss-orange); min-width: 26px; height: 26px; border-radius: 50%; padding: 0 5px;
    display: inline-flex; align-items: center; justify-content: center; font-size: 14px; color: #fff;
  }
  .viewer-title .num .ic { width: 15px; height: 15px; }
  /* 그림은 이름표(위)·안내줄(아래) 자리를 비우고, 넘치면 무대 안에서 스크롤 */
  .stage-canvas {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    max-width: 100%; max-height: 100%; overflow: auto;
    padding: calc(var(--sk-stage-top) + 40px) 20px var(--sk-stage-bottom);
  }
  .stage-eq {
    font-size: 20px; font-weight: 800; color: var(--ss-text); font-variant-numeric: tabular-nums;
    background: #fff3c4; border: 2px solid #f5c542; border-radius: 14px;
    padding: 6px 18px; animation: popIn .35s ease both; text-align: center; word-break: keep-all;
  }
  .stage-stair { display: flex; align-items: flex-end; gap: 5px; }
  .stage-col { display: flex; flex-direction: column; gap: 3px; align-items: center; }
  .stage-col .col-label { font-size: 15px; font-weight: 800; color: var(--ss-text); margin-top: 4px; }
  .blk {
    border: 2px solid rgba(0,0,0,.22); position: relative; overflow: hidden;
    box-shadow: 0 3px 0 rgba(0,0,0,.2);
    animation: popIn .35s cubic-bezier(.36,1.56,.64,1) both;
  }
  .blk .shine { position: absolute; top: 3px; left: 3px; right: 3px; height: 35%; background: rgba(255,255,255,.35); border-radius: 3px; }
  .blk.leftover { background: #b8b8b8 !important; animation: popIn .35s cubic-bezier(.36,1.56,.64,1) both, wobble .5s ease .45s 2; }
  @keyframes wobble { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-7deg)} 75%{transform:rotate(7deg)} }
  .stage-hint {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 5;
    background: rgba(38,50,56,0.82); color: #fff; font-size: 14px; font-weight: 600; line-height: 1.3;
    border-radius: 99px; padding: 8px 16px; white-space: nowrap; max-width: calc(100% - 24px);
    overflow: hidden; text-overflow: ellipsis;
  }
  .stage-mystery { font-size: 80px; font-weight: 900; line-height: 1; color: var(--ss-orange); text-shadow: 4px 4px 0 rgba(38,50,56,0.85); animation: popIn .4s ease; }

  /* ===== 조작판 ===== */
  .side {
    background: var(--ss-panel); border-left: 2px solid var(--ss-panel-border);
    overflow-y: auto; display: flex; flex-direction: column;
    box-shadow: -4px 0 24px rgba(0,0,0,0.06);
  }
  .side-head {
    background: linear-gradient(135deg, #8b5cf6 0%, var(--ss-accent) 100%);
    color: #fff; padding: 16px 20px 14px; position: relative; overflow: hidden; flex-shrink: 0;
  }
  .side-head::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 80% -20%, rgba(255,255,255,0.18) 0, transparent 55%); }
  .side-head h2 { font-size: 20px; position: relative; z-index: 1; }
  .side-head .side-sub { font-size: 14px; opacity: .85; position: relative; z-index: 1; margin-top: 2px; }
  .side-body { padding: 14px 16px 20px; flex: 1; }

  .mode-pills { display: flex; gap: 6px; margin-bottom: 14px; }
  .mode-pill {
    flex: 1; min-height: 44px; padding: 8px 6px; border-radius: 12px;
    border: 2px solid var(--ss-panel-border); background: var(--ss-btn-bg);
    font: inherit; font-size: 15px; font-weight: 700; color: var(--ss-text-muted);
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: border-color .15s, background .15s, color .15s;
  }
  .mode-pill:hover { border-color: var(--ss-accent); }
  .mode-pill.active { border-color: var(--ss-accent); background: var(--ss-accent-soft); color: var(--ss-accent-h); }

  .observe-box { background: #fff7e0; border: 1px solid #f5d48a; border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; }
  .observe-box h3 { font-size: 15px; color: #9a5a00; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
  .observe-box p { font-size: 15px; line-height: 1.6; word-break: keep-all; }
  .tip-box { background: #eef4fb; border: 1px solid #c9dcf2; border-radius: 14px; padding: 10px 14px; margin-bottom: 14px; font-size: 14px; line-height: 1.6; color: #2c5685; word-break: keep-all; }
  .tip-box b { color: #1f4f8c; }
  .tip-box .ic { vertical-align: -0.15em; }

  .ctrl-group { background: var(--ss-btn-bg); border: 1px solid var(--ss-panel-border); border-radius: 14px; padding: 12px; margin-bottom: 14px; }
  .ctrl-group label { font-size: 14px; font-weight: 700; color: var(--ss-text-muted); display: block; margin-bottom: 8px; }
  .slider-row { display: flex; align-items: center; gap: 12px; }
  .slider-col { flex: 1; display: flex; flex-direction: column; min-width: 120px; }
  .num-input {
    font: inherit; font-size: 22px; font-weight: 800; line-height: 1; width: 72px; min-height: 44px;
    padding: 4px 8px; border: 2px solid var(--ss-panel-border); border-radius: 12px;
    text-align: center; background: var(--ss-panel); color: var(--ss-text);
  }
  .num-input:focus { border-color: var(--ss-accent); }
  input[type=range] { width: 100%; height: 32px; accent-color: var(--ss-accent); cursor: pointer; }
  .range-labels { display: flex; justify-content: space-between; font-size: 13px; color: var(--ss-text-muted); margin-top: 2px; }
  .best-badge { display: inline-flex; align-items: center; gap: 4px; background: #fff3c4; border: 1px solid #f5c542; border-radius: 999px; padding: 2px 12px; font-size: 14px; font-weight: 700; color: #8a4b00; }
  .best-new { display: inline-flex; align-items: center; gap: 4px; color: var(--sk-ok-fg); font-weight: 800; }

  /* 진행/퀴즈 */
  .progress-zone { margin-bottom: 14px; }
  .progress-track { height: 8px; background: var(--ss-btn-bg); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 99px; min-width: 8px; background: linear-gradient(90deg, #f5c542, var(--ss-orange)); transition: width .4s ease; }
  .progress-label { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; color: var(--ss-text-muted); margin-top: 6px; }

  .quiz-zone { margin-top: 4px; }
  .quiz-q { text-align: center; font-size: 17px; font-weight: 700; line-height: 1.5; margin-bottom: 12px; }
  .quiz-btns { display: flex; flex-direction: column; gap: 8px; }
  .quiz-btn { min-height: 52px; font-size: 16px; }
  .quiz-btn.yes { color: var(--sk-ok-fg); }
  .quiz-btn.no { color: #8a4b00; }

  .reveal { animation: popIn .35s ease both; }
  .reveal-banner { display: flex; align-items: center; justify-content: center; gap: 6px; text-align: center; border-radius: 12px; padding: 10px; font-size: 17px; font-weight: 800; margin-bottom: 8px; }
  .reveal-banner.correct { background: var(--sk-ok-bg); color: var(--sk-ok-fg); }
  .reveal-banner.wrong { background: var(--sk-no-bg); color: var(--sk-no-fg); }
  .explain { font-size: 15px; line-height: 1.6; background: #f7f2e9; border-radius: 12px; padding: 10px 14px; word-break: keep-all; }
  .explain b { color: #b46400; }
  .next-zone { margin-top: 12px; }
  .next-zone .sk-btn { width: 100%; }

  /* 결과 */
  .result { text-align: center; animation: fadeUp .4s ease both; }
  .result h2 { font-size: 22px; color: var(--ss-accent); margin: 4px 0 2px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .result .score { font-size: 16px; color: var(--ss-text-muted); margin-bottom: 10px; }
  .result .best-line { margin: 0 0 14px; font-size: 15px; }
  .summary-box { background: var(--ss-accent-soft); border: 1px solid #d9c8fb; border-radius: 14px; padding: 12px 16px; text-align: left; margin-bottom: 14px; }
  .summary-box h3 { color: var(--ss-accent-h); font-size: 15px; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .summary-box p { font-size: 15px; line-height: 1.6; word-break: keep-all; }
  .result-btns { display: flex; flex-direction: column; gap: 8px; }

  button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--ss-accent); outline-offset: 2px; }

  /* ===== 태블릿·폰 세로: 무대 위, 조작판 아래 ===== */
  @media (max-width: 900px) and (orientation: portrait), (max-width: 600px) {
    body.exploring { overflow: auto; }
    body.exploring .explore { display: flex; flex-direction: column; height: auto; min-height: 100vh; }
    .stage-zone { position: sticky; top: 0; z-index: 40; height: 46vh; min-height: 300px; flex-shrink: 0; }
    .stage-canvas { padding: calc(var(--sk-stage-top) + 36px) 14px 52px; }
    .side { border-left: none; border-top: 2px solid var(--ss-panel-border); box-shadow: none; }
    .quiz-btns { flex-direction: row; }
    .quiz-btn { flex: 1; }
    .stage-mystery { font-size: 64px; }
  }
  /* 가로 폰(844×390 등) */
  @media (max-height: 500px) and (orientation: landscape) {
    :root { --ss-side-w: 320px; }
    .stage-canvas { padding: calc(var(--sk-stage-top) + 30px) 14px 16px; gap: 8px; }
    .stage-hint { display: none; }
    .stage-mystery { font-size: 56px; }
    .stage-eq { font-size: 17px; padding: 4px 14px; }
    .side-head { padding: 10px 16px 8px; }
    .side-head .side-sub { display: none; }
    .quiz-btns { flex-direction: row; }
    .quiz-btn { flex: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition-duration: .001s !important; }
  }
</style>

  <button type="button" class="overlay-btn" id="muteBtn" title="소리 켜기/끄기" aria-label="소리 켜기/끄기" aria-pressed="false"></button>
</div>

<!-- ===== 인트로 ===== -->
<div class="intro-screen sk-screen" id="screenIntro">
  <div class="intro-inner">
    <div class="intro-tag">넘버블록스 · 삼각수</div>
    <div class="intro-stair" id="introStair" aria-hidden="true"></div>
    <h1>계단 수 만들기 <span class="app-title-en">Step Squad</span></h1>
    <p class="intro-sub">넘버블록스 계단 군대 탐험기 — 계단 모양으로 쌓을 수 있는 수는 무엇이 다를까요?</p>
    <div class="intro-card">
      <h3><span data-icon="compass"></span> 탐험 방법</h3>
      <ol>
        <li>무대에서 <b>블록 계단</b>을 직접 만들어 관찰해요. 1 + 2 + 3 + … 처럼 한 칸씩 커져요!</li>
        <li>조작판의 슬라이더로 <b>계단 높이</b>를 바꾸며 합계가 어떻게 변하는지 살펴봐요.</li>
        <li>준비가 되면 <b>퀴즈 10문제</b>로 계단 군대의 일원을 찾아내요!</li>

<!-- ===== 탐험: 무대 + 조작판 ===== -->
<div class="explore">
  <div class="stage-zone">
    <div class="viewer-title" id="viewerTitle"><span class="num" data-icon="chart-no-axes-column-increasing"></span> 계단 군대</div>
    <div class="stage-canvas" id="stageCanvas"></div>
    <div class="stage-hint" id="stageHint">조작판의 슬라이더로 계단을 키워 보세요!</div>
  </div>
  <aside class="side" aria-label="조작판">
    <div class="side-head">
      <h2>계단 수 만들기</h2>
      <div class="side-sub">넘버블록스 · 삼각수</div>
    </div>
    <div class="side-body">
      <div class="mode-pills" role="group" aria-label="모드 고르기">
        <button type="button" class="mode-pill active" id="pill-build" onclick="setMode('build')" aria-pressed="true"><span data-icon="blocks"></span> 계단 만들기</button>
        <button type="button" class="mode-pill" id="pill-quiz" onclick="setMode('quiz')" aria-pressed="false"><span data-icon="trophy"></span> 퀴즈</button>
      </div>
      <div id="sideContent"></div>
    </div>
  </aside>

<script>
/* ──────────────────────── 효과음 + 음소거 ────────────────────────
   예전과 같은 소리를 SimKit.sound로 낸다. 음소거 키 'stepsquad.muted'는 그대로. */
SimKit.sound.useKey('stepsquad.muted');
function sfx(type) { SimKit.sound.play(type); }
const icon = (name) => SimKit.icon(name);
SimKit.sound.bindButton('#muteBtn', { render: function (el, m) { el.innerHTML = m ? icon('volume-x') : icon('volume-2'); } });
var _bSnd = 0;
function buildSnd() {
  var t = (window.performance && performance.now) ? performance.now() : Date.now();
  if (t - _bSnd > 90) { _bSnd = t; sfx('move'); }
}

/* ──────────────────────── Core ──────────────────────── */
function getStepRank(n) {
  let k = 1;
  while (true) {
    const tri = k * (k + 1) / 2;
    if (tri === n) return k;
    if (tri > n)  return -1;
    k++;
  }
}
const BLOCK_COLORS = ['#FF4757','#FF8C00','#FFD93D','#2ED573','#1E90FF','#A855F7','#FF6EB4','#00CEC9','#FFA07A','#555555'];
function blockColor(i) { return BLOCK_COLORS[(i-1) % BLOCK_COLORS.length]; }

/* ──────────────────────── 토스트 ──────────────────────── */
function ssToast(msg) { SimKit.toast(msg); }

/* ──────────────────────── 최고 기록(모드별) ────────────────────────
   { best: { quiz: 0~10 }, plays: { quiz: 횟수 } } — 이 기기에만 저장 */
const scoreStore = SimKit.store('stepsquad.scores', {
  defaults: { best: {}, plays: {} },
  validate: function (raw) {
    if (!raw || typeof raw !== 'object') return null;
    const out = { best: {}, plays: {} };
    ['quiz'].forEach(function (m) {
      if (raw.best && raw.best[m] != null) out.best[m] = SimKit.clean.int(raw.best[m], 0, 10, 0);
      if (raw.plays && raw.plays[m] != null) out.plays[m] = SimKit.clean.int(raw.plays[m], 0, 100000, 0);
    });
    return out;
  }
});
function bestOf(m) { const s = scoreStore.load(); return s.best[m] != null ? s.best[m] : null; }
// 점수를 기록하고 새 최고 기록이면 true
function recordScore(m, score) {
  const s = scoreStore.load();
  const prev = s.best[m];
  const isNew = prev == null || score > prev;
  if (isNew) s.best[m] = score;
  s.plays[m] = (s.plays[m] || 0) + 1;
  scoreStore.save(s);
  return { isNew: isNew && prev != null, prev: prev, best: s.best[m], first: prev == null };
}

/* ──────────────────────── 상태 ──────────────────────── */
const QUIZ_TOTAL = 10;
let mode = 'build';        // build | quiz
let buildK = 4;
let quizIdx = 0, quizScore = 0, quizN = null, quizAnswered = false;

const sideContent = () => document.getElementById('sideContent');
const stageCanvas = () => document.getElementById('stageCanvas');
const stageHint = () => document.getElementById('stageHint');
const viewerTitle = () => document.getElementById('viewerTitle');

/* ──────────────────────── 무대 렌더 ──────────────────────── */
function blockNode(color, size) {
  const b = document.createElement('div');
  b.className = 'blk';
  b.style.cssText = `width:${size}px;height:${size}px;background:${color};border-radius:${size >= 44 ? 10 : size >= 32 ? 7 : 5}px;`;
  const shine = document.createElement('div');
  shine.className = 'shine';
  b.appendChild(shine);
  return b;
}
function blockSizeFor(k) {
  return k <= 4 ? 52 : k <= 6 ? 46 : k <= 8 ? 38 : k <= 10 ? 30 : k <= 13 ? 24 : k <= 16 ? 19 : 15;
}

/* 완전한 k단 계단 */
function renderStair(k, withLabels) {
  const stair = document.createElement('div');
  stair.className = 'stage-stair';
  const sz = blockSizeFor(k);
  for (let col = 1; col <= k; col++) {
    const colDiv = document.createElement('div');
    colDiv.className = 'stage-col';
    for (let r = 0; r < col; r++) {
      const b = blockNode(blockColor(col), sz);
      b.style.animationDelay = (r * 0.04 + (col - 1) * 0.07).toFixed(2) + 's';
      colDiv.appendChild(b);
    }
    if (withLabels) {
      const lbl = document.createElement('div');
      lbl.className = 'col-label';
      lbl.style.fontSize = (sz >= 36 ? 16 : 12) + 'px';
      lbl.textContent = col;
      colDiv.appendChild(lbl);
    }
    stair.appendChild(colDiv);
  }
  return stair;
}

/* n개 블록으로 계단 쌓기 시도 — 남는 블록은 회색으로 흔들림 */
function renderAttempt(n) {
  const rank = getStepRank(n);
  const wrap = document.createElement('div');
  wrap.className = 'stage-stair';
  let k = 0;
  while ((k + 1) * (k + 2) / 2 <= n) k++;
  if (rank > 0) k = rank;
  const leftover = n - k * (k + 1) / 2;
  const sz = blockSizeFor(Math.max(k + (leftover > 0 ? 1 : 0), 3));
  for (let col = 1; col <= k; col++) {
    const colDiv = document.createElement('div');
    colDiv.className = 'stage-col';
    for (let r = 0; r < col; r++) {
      const b = blockNode(blockColor(col), sz);
      b.style.animationDelay = (r * 0.04 + (col - 1) * 0.07).toFixed(2) + 's';
      colDiv.appendChild(b);
    }
    wrap.appendChild(colDiv);
  }
  if (leftover > 0) {
    const colDiv = document.createElement('div');
    colDiv.className = 'stage-col';
    for (let r = 0; r < leftover; r++) {
      const b = blockNode('#b8b8b8', sz);
      b.classList.add('leftover');
      b.style.animationDelay = (0.5 + r * 0.05).toFixed(2) + 's';
      colDiv.appendChild(b);
    }
    wrap.appendChild(colDiv);
  }
  return wrap;
}

function renderBuildStage() {
  const k = buildK, n = k * (k + 1) / 2;
  const cv = stageCanvas();
  cv.innerHTML = '';
  cv.appendChild(renderStair(k, true));
  const eq = document.createElement('div');
  eq.className = 'stage-eq';
  eq.textContent = Array.from({length: k}, (_, i) => i + 1).join(' + ') + ' = ' + n;
  cv.appendChild(eq);
  viewerTitle().innerHTML = `<span class="num">${k}</span> ${k}단 계단 군대 — 합계 ${n}`;
  stageHint().textContent = '조작판의 슬라이더로 계단을 키워 보세요!';
  stageHint().style.display = '';
}

function renderQuizStage(revealed) {
  const cv = stageCanvas();
  cv.innerHTML = '';
  if (quizN == null) return;
  if (!revealed) {
    const big = document.createElement('div');
    big.className = 'stage-mystery';
    big.textContent = quizN;
    cv.appendChild(big);
    const row = document.createElement('div');
    row.className = 'stage-stair';
    const sz = quizN > 20 ? 18 : 26;
    for (let i = 0; i < quizN; i++) {
      const b = blockNode('#9AA7B8', sz);
      b.style.animationDelay = (i * 0.02).toFixed(2) + 's';
      row.appendChild(b);
    }
    row.style.flexWrap = 'wrap';
    row.style.justifyContent = 'center';
    row.style.maxWidth = '460px';
    cv.appendChild(row);
    stageHint().textContent = '이 블록들을 계단 모양으로 쌓을 수 있을까요?';
  } else {
    const rank = getStepRank(quizN);
    cv.appendChild(renderAttempt(quizN));
    const eq = document.createElement('div');
    eq.className = 'stage-eq';
    eq.textContent = rank > 0
      ? Array.from({length: rank}, (_, i) => i + 1).join(' + ') + ' = ' + quizN
      : quizN + ' = 계단이 되다 만 모양!';
    cv.appendChild(eq);
    stageHint().textContent = rank > 0 ? '완벽한 계단이에요!' : '회색 블록이 남아 버렸어요!';
  }
  viewerTitle().innerHTML = `<span class="num">${quizIdx + 1}</span> 퀴즈 ${quizIdx + 1} / ${QUIZ_TOTAL}`;
}

/* ──────────────────────── 사이드바: 계단 만들기 ──────────────────────── */
function renderBuildSide() {
  sideContent().innerHTML = `
    <div class="observe-box">
      <h3>${icon('search')} 관찰 포인트</h3>
      <p>계단은 <b>1, 2, 3, …</b> 한 칸씩 커지는 줄로 만들어져요. 합계가 <b>1, 3, 6, 10, 15…</b> 로 변하는 걸 찾아보세요!</p>
    </div>
    <div class="ctrl-group">
      <label for="numInput">계단 높이 (1 ~ 20단)</label>
      <div class="slider-row">
        <input type="number" id="numInput" class="num-input" min="1" max="20" value="${buildK}"
          oninput="onNumInput(false)" onchange="onNumInput(true)">
        <div class="slider-col">
          <input type="range" id="numSlider" min="1" max="20" value="${buildK}" oninput="onSlider()" aria-label="계단 높이 슬라이더">
          <div class="range-labels" aria-hidden="true"><span>1단</span><span>10단</span><span>20단</span></div>
        </div>
      </div>
    </div>
    <div class="tip-box">${icon('lightbulb')} <b>탐험 팁</b> · 이렇게 만들어지는 수(1, 3, 6, 10, …)를 <b>삼각수</b>라고도 불러요. 공식은 <b>k × (k+1) ÷ 2</b>!</div>
    <div class="next-zone">
      <button type="button" class="sk-btn sk-btn--primary" onclick="setMode('quiz')">${icon('trophy')} 퀴즈 도전</button>
    </div>`;
}
function onSlider() {
  const v = parseInt(document.getElementById('numSlider').value);
  document.getElementById('numInput').value = v;
  buildK = v;
  renderBuildStage();
  buildSnd();
}
// commit=false(입력 중): 칸을 덮어쓰지 않는다. "4"를 지우고 "7"을 치는 사이 "1"이 채워져 "17"이 되던 문제
// commit=true(입력 끝, change): 범위를 벗어나면 1~20으로 맞추고 칸에도 반영
function onNumInput(commit) {
  const inp = document.getElementById('numInput');
  let k = parseInt(inp.value, 10);
  if (!commit) {
    if (!Number.isFinite(k) || k < 1 || k > 20) return;
  } else {
    if (!Number.isFinite(k)) k = buildK;
    k = Math.min(20, Math.max(1, k));
    if (String(k) !== inp.value) inp.value = k;
  }
  document.getElementById('numSlider').value = k;
  if (k === buildK) return;
  buildK = k;
  renderBuildStage();
  buildSnd();
}

/* ──────────────────────── 사이드바: 퀴즈 ──────────────────────── */
const triangulars = new Set();
for (let k = 1; k * (k + 1) / 2 <= 120; k++) triangulars.add(k * (k + 1) / 2);

// 한 번의 퀴즈(10문제) 안에서는 같은 수를 다시 내지 않는다
let quizUsed = new Set();
function pickQuizN() {
  const tris = [...triangulars].filter(x => x >= 3 && x <= 30 && !quizUsed.has(x));
  const nonTri = [];
  for (let i = 2; i <= 30; i++) if (!triangulars.has(i) && !quizUsed.has(i)) nonTri.push(i);
  let pool = Math.random() < 0.5 ? tris : nonTri;
  if (!pool.length) pool = tris.length ? tris : nonTri;
  if (!pool.length) { quizUsed.clear(); return pickQuizN(); }
  const n = pool[Math.floor(Math.random() * pool.length)];
  quizUsed.add(n);
  return n;
}
// 수를 읽었을 때 받침 유무로 은/는 고르기(break-make와 같은 규칙)
function batchim(n) { if (n % 10 === 0) return true; return { 1: 1, 3: 1, 6: 1, 7: 1, 8: 1 }[n % 10] ? true : false; }
function josaEunNeun(n) { return batchim(n) ? '은' : '는'; }

function startQuiz() {
  quizIdx = 0; quizScore = 0;
  quizUsed = new Set();
  nextQuestion();
}
function nextQuestion() {
  quizAnswered = false;
  quizN = pickQuizN();
  renderQuizStage(false);
  sideContent().innerHTML = `
    <div class="progress-zone">
      <div class="progress-track"><div class="progress-fill" style="width:${quizIdx / QUIZ_TOTAL * 100}%"></div></div>
      <div class="progress-label"><span>퀴즈 진행 중${bestOf('quiz') != null ? ` · 최고 기록 ${bestOf('quiz')}개` : ''}</span><span>${quizIdx + 1} / ${QUIZ_TOTAL}</span></div>
    </div>
    <div class="observe-box">
      <h3>${icon('search')} 관찰 포인트</h3>
      <p>무대의 블록 <b>${quizN}개</b>를 보세요. 1, 2, 3, … 계단 줄로 남김없이 나눌 수 있을까요?</p>
    </div>
    <div class="quiz-zone" aria-live="polite">
      <div class="quiz-q">충분히 상상했나요?<br><b>${quizN}</b>${josaEunNeun(quizN)} 계단 군대의 일원일까요?</div>
      <div class="quiz-btns">
        <button type="button" class="sk-btn quiz-btn yes" onclick="answerQuiz(true)">${icon('circle-check')} 계단 군대예요!</button>
        <button type="button" class="sk-btn quiz-btn no" onclick="answerQuiz(false)">${icon('circle-x')} 아니에요!</button>
      </div>
    </div>`;
  sfx('move');
  document.querySelector('.side').scrollTo({ top: 0 });
}
function answerQuiz(userSaysYes) {
  if (quizAnswered) return;
  quizAnswered = true;
  const rank = getStepRank(quizN);
  const isStep = rank > 0;
  const correct = userSaysYes === isStep;
  if (correct) { quizScore++; sfx('done'); if (isStep) setTimeout(() => sfx('star'), 220); }
  else sfx('wrong');

  renderQuizStage(true);

  const explainHtml = isStep
    ? `${quizN}${josaEunNeun(quizN)} <b>${rank}단 계단</b>이에요! ${rank <= 5 ? Array.from({length: rank}, (_, i) => i + 1).join(" + ") : "1 + 2 + … + " + rank} = ${quizN}. 블록이 딱 맞게 계단이 되었죠?`
    : `${quizN}${josaEunNeun(quizN)} 계단 모양으로 쌓을 수 없어요. 계단을 만들고 나면 <b>회색 블록이 남아요</b>. 계단 군대 수는 1, 3, 6, 10, 15, 21…이에요.`;

  const zone = sideContent().querySelector('.quiz-zone');
  zone.innerHTML = `
    <div class="reveal">
      <div class="reveal-banner ${correct ? 'correct' : 'wrong'}" id="revealBanner" tabindex="-1">
        ${correct ? icon('circle-check') + ' 딩동댕! 정답이에요!' : icon('circle-x') + ' 아쉬워요! 무대를 다시 봐요'}
      </div>
      <div class="explain">${explainHtml}</div>
      <div class="next-zone">
        <button type="button" class="sk-btn sk-btn--primary" onclick="afterQuestion()">
          ${quizIdx === QUIZ_TOTAL - 1 ? icon('award') + ' 결과 보기' : '다음 문제 ' + icon('arrow-right')}
        </button>
      </div>
    </div>`;
  // 누른 버튼이 사라졌으니 결과 문구로 초점을 옮긴다(키보드·화면 읽기)
  const rb = document.getElementById('revealBanner');
  if (rb) rb.focus({ preventScroll: true });
  SimKit.reveal(rb);   // 폰 세로 배치에서 결과 문구가 화면 밖이면 보이게
}
function afterQuestion() {
  quizIdx++;
  if (quizIdx >= QUIZ_TOTAL) { renderResult(); return; }
  nextQuestion();
}
function renderResult() {
  quizN = null;
  const cv = stageCanvas();
  cv.innerHTML = '';
  cv.appendChild(renderStair(6, false));
  const eq = document.createElement('div');
  eq.className = 'stage-eq';
  eq.textContent = '퀴즈 완료!';
  cv.appendChild(eq);
  viewerTitle().innerHTML = '<span class="num">' + icon('award') + '</span> 퀴즈 결과';
  stageHint().style.display = 'none';
  if (quizScore >= 8) sfx('stamp');
  const rec = recordScore('quiz', quizScore);
  sideContent().innerHTML = `
    <div class="result">
      <h2 id="resultTitle" tabindex="-1">${icon('award')} 퀴즈 완료!</h2>
      <div class="score">${QUIZ_TOTAL}개 중 ${quizScore}개 맞혔어요</div>
      <p class="best-line">
        ${rec.isNew ? `<span class="best-new">${icon('sparkles')} 새 최고 기록!</span> (전에는 ${rec.prev}개)` : `<span class="best-badge">${icon('star')} 최고 기록 ${rec.best}개</span>`}
      </p>
      <div class="summary-box">
        <h3>${icon('notebook-pen')} 오늘의 배움 정리</h3>
        <p>계단 군대 수는 <b>1 + 2 + 3 + … + k</b>로 만들 수 있는 수예요.
        <b>1, 3, 6, 10, 15, 21…</b> 처럼 계속 이어지고, <b>삼각수</b>라고도 불러요.
        블록을 계단으로 쌓아 보면 바로 알 수 있답니다!</p>
      </div>
      <div class="result-btns">
        <button type="button" class="sk-btn sk-btn--primary" onclick="startQuiz()">${icon('rotate-ccw')} 다시 하기</button>
        <button type="button" class="sk-btn" onclick="setMode('build')">${icon('blocks')} 계단 만들기로</button>
      </div>
    </div>`;
  document.querySelector('.side').scrollTo({ top: 0 });
  const rt = document.getElementById('resultTitle');
  if (rt) rt.focus({ preventScroll: true });
}

/* ──────────────────────── 모드/시작 ──────────────────────── */
function setMode(m) {
  mode = m;
  document.getElementById('pill-build').classList.toggle('active', m === 'build');
  document.getElementById('pill-quiz').classList.toggle('active', m === 'quiz');
  document.getElementById('pill-build').setAttribute('aria-pressed', String(m === 'build'));
  document.getElementById('pill-quiz').setAttribute('aria-pressed', String(m === 'quiz'));
  if (m === 'build') { stageHint().style.display = ''; renderBuildSide(); renderBuildStage(); }
  else startQuiz();
}
function startExplore() {
  document.body.classList.add('exploring');
  window.scrollTo(0, 0);
  setMode('build');
  sfx('done');
}

/* ──────────────────────── 인트로 미니 계단 ──────────────────────── */
(function () {
  const host = document.getElementById('introStair');
  for (let col = 1; col <= 5; col++) {
    const c = document.createElement('div');
    c.className = 'col';
    for (let r = 0; r < col; r++) {
      const b = document.createElement('div');
      b.className = 'blk';
      b.style.cssText = `width:26px;height:26px;border-radius:6px;background:${blockColor(col)};animation-delay:${(r * 0.06 + col * 0.1).toFixed(2)}s;`;
      c.appendChild(b);
    }
    host.appendChild(c);
  }
})();
</script>

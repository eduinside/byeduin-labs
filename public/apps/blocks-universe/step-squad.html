<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Step Squad — eduin VIVES</title>
<script src="/common/init.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Dongle:wght@300;400;700&family=Fredoka+One&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #FFF9F0;
    --sky: #C8E6FF;
    --yellow: #FFD93D;
    --orange: #FF8C00;
    --red: #FF4757;
    --green: #2ED573;
    --blue: #1E90FF;
    --purple: #A855F7;
    --pink: #FF6EB4;
    --teal: #00CEC9;
    --dark: #2D2D2D;
    --paper: #FFFDF8;
    --shadow: 4px 4px 0px #2D2D2D;
    --side-w: 400px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Dongle', sans-serif;
    background: var(--bg);
    color: var(--dark);
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 10% 20%, #FFE0B2 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, #C8E6FF 0%, transparent 40%);
  }
  body.exploring { overflow: hidden; }
  h1, h2, h3 { font-weight: 700; }

  /* ===== 인트로 ===== */
  .wrap { max-width: 620px; margin: 0 auto; padding: 20px 16px 60px; }
  .intro { text-align: center; padding-top: 56px; animation: fadeUp .6s ease both; }
  .intro .hero-art { font-size: 84px; line-height: 1; animation: bounce 2.4s ease-in-out infinite; }
  .intro h1 {
    font-size: 64px; margin: 10px 0 2px; color: var(--dark);
    letter-spacing: 2px; text-shadow: 4px 4px 0 var(--orange); line-height: 1;
  }
  .intro .sub { font-size: 28px; color: #666; margin-bottom: 20px; line-height: 1.3; font-weight: 700; }
  .lesson-tag {
    display: inline-block; background: var(--dark); color: var(--yellow);
    font-size: 24px; padding: 4px 20px; border-radius: 99px; margin-bottom: 18px; line-height: 1.3;
  }
  .mission-card {
    background: var(--paper); border: 3px dashed var(--orange); border-radius: 22px;
    padding: 18px 22px; text-align: left; margin: 0 auto 26px; box-shadow: var(--shadow);
  }
  .mission-card h3 { color: var(--orange); font-size: 30px; margin-bottom: 6px; line-height: 1.1; }
  .mission-card li { margin: 4px 0 4px 22px; line-height: 1.25; font-size: 25px; }
  .mission-card b { color: var(--red); }
  .intro-stair { display: flex; justify-content: center; align-items: flex-end; gap: 5px; margin: 0 0 20px; }
  .intro-stair .col { display: flex; flex-direction: column; gap: 3px; }
  .intro-stair .blk {
    width: 26px; height: 26px; border-radius: 6px;
    border: 2px solid rgba(0,0,0,.22); box-shadow: 0 3px 0 rgba(0,0,0,.2);
    animation: popIn .4s cubic-bezier(.36,1.56,.64,1) both;
  }

  /* ===== 버튼 ===== */
  .btn {
    font-family: 'Dongle', sans-serif; font-size: 30px; line-height: 1.1;
    border: 3px solid var(--dark); cursor: pointer;
    border-radius: 99px; padding: 10px 36px; transition: transform .12s, box-shadow .12s;
    box-shadow: var(--shadow); background: white; color: var(--dark);
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--dark); }
  .btn:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--dark); }
  .btn-primary { background: var(--green); }
  .btn-blue { background: var(--blue); color: white; }

  /* ===== 탐험 레이아웃: 무대(좌) + 사이드바(우) ===== */
  .explore {
    display: none;
    grid-template-columns: 1fr var(--side-w);
    width: 100vw; height: 100vh; height: 100dvh;
    animation: fadeUp .4s ease both;
  }
  body.exploring .explore { display: grid; }
  body.exploring .wrap { display: none; }
  .stage-zone {
    position: relative; min-width: 0; overflow: hidden;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,217,61,.25) 0, transparent 35%),
      radial-gradient(circle at 80% 85%, rgba(200,230,255,.7) 0, transparent 45%),
      linear-gradient(180deg, #FFF9F0 0%, #FFEFD8 100%);
    display: flex; align-items: center; justify-content: center;
  }
  .viewer-title {
    position: absolute; top: 56px; left: 14px; z-index: 5;
    background: var(--dark); color: #fff; border-radius: 14px; padding: 4px 16px;
    font-size: 27px; line-height: 1.2; display: flex; align-items: center; gap: 9px;
    box-shadow: var(--shadow);
  }
  .viewer-title .num {
    background: var(--orange); width: 26px; height: 26px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center; font-size: 18px;
  }
  .stage-canvas {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    max-width: 100%; max-height: 100%; padding: 90px 24px 90px; overflow: auto;
  }
  .stage-eq {
    font-family: 'Fredoka One', cursive; font-size: 22px; color: var(--dark);
    background: var(--yellow); border: 3px solid var(--dark); border-radius: 16px;
    padding: 6px 20px; box-shadow: var(--shadow); animation: popIn .4s cubic-bezier(.36,1.56,.64,1) both;
    text-align: center;
  }
  .stage-stair { display: flex; align-items: flex-end; gap: 5px; }
  .stage-col { display: flex; flex-direction: column; gap: 3px; align-items: center; }
  .stage-col .col-label { font-family: 'Fredoka One', cursive; font-size: 15px; color: var(--dark); margin-top: 4px; }
  .blk {
    border: 2px solid rgba(0,0,0,.22); position: relative; overflow: hidden;
    box-shadow: 0 3px 0 rgba(0,0,0,.2);
    animation: popIn .35s cubic-bezier(.36,1.56,.64,1) both;
  }
  .blk .shine { position: absolute; top: 3px; left: 3px; right: 3px; height: 35%; background: rgba(255,255,255,.35); border-radius: 3px; }
  .blk.leftover { background: #b8b8b8 !important; animation: popIn .35s cubic-bezier(.36,1.56,.64,1) both, wobble .5s ease .45s 2; }
  @keyframes wobble { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-7deg)} 75%{transform:rotate(7deg)} }
  .stage-hint {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 5;
    background: rgba(45,45,45,.85); color: #fff; font-size: 23px; line-height: 1.2;
    border-radius: 99px; padding: 6px 20px; white-space: nowrap; max-width: calc(100% - 24px);
    overflow: hidden; text-overflow: ellipsis;
  }
  .stage-mystery { font-family: 'Fredoka One', cursive; font-size: 96px; color: var(--orange); text-shadow: 5px 5px 0 var(--dark); animation: bounce .8s ease; }

  /* ===== 사이드바 ===== */
  .side {
    background: var(--paper); border-left: 3px solid var(--dark);
    overflow-y: auto; display: flex; flex-direction: column;
    box-shadow: -8px 0 24px rgba(45,45,45,.12);
  }
  .side-head {
    background: linear-gradient(135deg, var(--purple) 0%, #7C3AED 100%);
    color: #fff; padding: 18px 22px 14px; position: relative; overflow: hidden; flex-shrink: 0;
  }
  .side-head::after {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 80% -20%, rgba(255,217,61,.35) 0, transparent 55%);
  }
  .side-head .flag { font-size: 22px; line-height: 1.1; opacity: .9; position: relative; z-index: 1; }
  .side-head h2 { font-size: 40px; line-height: 1.05; margin: 2px 0 0; position: relative; z-index: 1; }
  .side-body { padding: 16px 20px 26px; flex: 1; }

  .mode-pills { display: flex; gap: 8px; margin-bottom: 16px; }
  .mode-pill {
    flex: 1; font-family: 'Dongle', sans-serif; font-size: 25px; line-height: 1.1;
    padding: 8px 6px; border: 3px solid var(--dark); border-radius: 99px; cursor: pointer;
    background: white; color: var(--dark); box-shadow: 3px 3px 0 var(--dark);
    transition: transform .1s, box-shadow .1s, background .2s;
    -webkit-tap-highlight-color: transparent;
  }
  .mode-pill:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--dark); }
  .mode-pill.active { background: var(--yellow); }

  .observe-box {
    background: #FFF7E0; border: 2px solid var(--orange); border-radius: 16px;
    padding: 12px 16px 10px; margin-bottom: 14px;
  }
  .observe-box h3 { font-size: 26px; line-height: 1.1; color: #B06A00; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
  .observe-box p { font-size: 24px; line-height: 1.25; }
  .tip-box {
    background: #EEF4FB; border: 2px solid #9CC0E8; border-radius: 16px;
    padding: 10px 15px; margin-bottom: 14px; font-size: 22px; line-height: 1.3; color: #2C5685;
  }
  .tip-box b { color: #1F4F8C; }

  .slider-card { background: #fff; border: 3px solid var(--dark); border-radius: 18px; padding: 14px 16px; box-shadow: var(--shadow); margin-bottom: 14px; }
  .slider-card label { font-size: 25px; line-height: 1.15; display: block; margin-bottom: 8px; }
  .slider-row { display: flex; align-items: center; gap: 12px; }
  .num-input {
    font-family: 'Dongle', sans-serif; font-size: 34px; line-height: 1; width: 72px;
    padding: 4px 8px; border: 3px solid var(--dark); border-radius: 12px;
    box-shadow: 3px 3px 0 var(--dark); text-align: center; background: var(--sky);
    color: var(--dark); outline: none;
  }
  input[type=range] {
    -webkit-appearance: none; flex: 1; min-width: 120px; height: 10px; border-radius: 999px;
    background: linear-gradient(to right, var(--orange) 0%, var(--yellow) 100%);
    border: 2px solid var(--dark); outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%;
    background: white; border: 3px solid var(--dark); box-shadow: 2px 2px 0 var(--dark);
    cursor: pointer; transition: transform .1s;
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.15); }
  .range-labels { display: flex; justify-content: space-between; font-size: 19px; color: #999; margin-top: 4px; }

  /* 진행/퀴즈 (volcano 계승) */
  .progress-zone { margin-bottom: 14px; }
  .progress-track { height: 12px; background: #F0E4CE; border: 2px solid var(--dark); border-radius: 99px; overflow: hidden; }
  .progress-fill {
    height: 100%; border-radius: 99px; min-width: 8px;
    background: linear-gradient(90deg, var(--yellow), var(--orange));
    transition: width .5s cubic-bezier(.6,0,.3,1.4);
  }
  .progress-label { display: flex; justify-content: space-between; font-size: 21px; color: #888; margin-top: 4px; line-height: 1.1; }

  .quiz-zone { margin-top: 4px; }
  .quiz-q { text-align: center; font-size: 29px; line-height: 1.2; margin-bottom: 12px; }
  .quiz-btns { display: flex; flex-direction: column; gap: 10px; }
  .quiz-btn {
    font-family: 'Dongle', sans-serif; font-size: 28px; line-height: 1.1; padding: 12px 8px;
    border-radius: 18px; border: 3px solid var(--dark); cursor: pointer; background: #fff;
    box-shadow: var(--shadow); transition: transform .1s, box-shadow .1s;
    -webkit-tap-highlight-color: transparent;
  }
  .quiz-btn:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--dark); }
  .quiz-btn:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--dark); }
  .quiz-btn.yes { background: #E6F9EE; color: #14813F; }
  .quiz-btn.no { background: #FDECEC; color: #C0392B; }

  .reveal { animation: popIn .45s cubic-bezier(.5,0,.3,1.5) both; }
  .reveal-banner {
    text-align: center; border-radius: 18px; padding: 8px; font-size: 29px; line-height: 1.15; margin-bottom: 10px;
    border: 3px solid;
  }
  .reveal-banner.correct { background: #E3F5EA; color: #14813F; border-color: var(--green); }
  .reveal-banner.wrong { background: #FDEAEA; color: #C0392B; border-color: var(--red); }
  .explain { font-size: 24px; line-height: 1.35; background: #F7F2E9; border-radius: 14px; padding: 11px 15px; }
  .explain b { color: var(--orange); }
  .next-zone { text-align: center; margin-top: 14px; }

  /* 결과 (사이드바 안) */
  .result { text-align: center; animation: fadeUp .5s ease both; }
  .result h2 { font-size: 40px; color: var(--orange); margin: 6px 0 0; line-height: 1.1; }
  .result .score { font-size: 30px; color: #888; margin-bottom: 14px; line-height: 1.1; }
  .summary-box {
    background: var(--dark); color: #F5EAD8; border-radius: 18px;
    padding: 14px 18px; text-align: left; margin-bottom: 16px;
  }
  .summary-box h3 { color: var(--yellow); font-size: 27px; line-height: 1.1; margin-bottom: 6px; }
  .summary-box p { font-size: 23px; line-height: 1.35; }
  .summary-box b { color: #FFD98A; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes popIn { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: scale(1); } }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

  /* ===== 토스트 ===== */
  #ssToast {
    position: fixed; bottom: 1.5rem; left: 50%;
    transform: translateX(-50%) translateY(1rem);
    background: var(--dark); color: white; padding: 4px 22px;
    border-radius: 999px; font-family: 'Dongle', sans-serif; font-size: 25px; line-height: 1.3;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    z-index: 9000; white-space: nowrap;
  }
  #ssToast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== 태블릿·모바일: 무대 위 / 패널 아래 ===== */
  @media (max-width: 900px) {
    body.exploring { overflow: auto; }
    body.exploring .explore { display: flex; flex-direction: column; height: auto; min-height: 100vh; }
    .stage-zone { position: sticky; top: 0; z-index: 40; height: 46vh; min-height: 280px; flex-shrink: 0; }
    .stage-canvas { padding: 70px 16px 56px; }
    .side { border-left: none; border-top: 3px solid var(--dark); }
    .quiz-btns { flex-direction: row; }
    .quiz-btn { flex: 1; font-size: 25px; }
    .intro h1 { font-size: 48px; }
    .viewer-title { font-size: 23px; padding: 3px 13px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition-duration: .001s !important; }
  }
</style>

<body data-shell="immersive">

<!-- 플로팅 크롬(홈·공유)은 app-shell.js가 주입 — 음소거 버튼은 크롬으로 끌어올려짐 -->
<div class="app-actions">
  <button class="overlay-btn" id="muteBtn" onclick="toggleMute()" title="소리 켜기/끄기" aria-label="소리 켜기/끄기" aria-pressed="false"></button>
</div>

<div id="ssToast"></div>

<!-- ===== 인트로 ===== -->
<div class="wrap">
  <div class="intro">
    <div class="hero-art">🪜</div>
    <h1>Step Squad</h1>
    <p class="sub">넘버블럭스 계단 군대 탐험기</p>
    <div class="lesson-tag">계단 모양으로 쌓을 수 있는 수는 무엇이 다를까요?</div>
    <div class="intro-stair" id="introStair" aria-hidden="true"></div>
    <div class="mission-card">
      <h3>🧭 탐험 방법</h3>
      <ol>
        <li>왼쪽 무대에서 <b>블록 계단</b>을 직접 만들어 관찰해요. 1 + 2 + 3 + … 처럼 한 칸씩 커져요!</li>
        <li>슬라이더로 <b>계단 높이</b>를 바꾸며 합계가 어떻게 변하는지 살펴봐요.</li>
        <li>준비가 되면 <b>퀴즈 10문제</b>로 계단 군대의 일원을 찾아내요!</li>
      </ol>
    </div>
    <button class="btn btn-primary" onclick="startExplore()">탐험 시작! 🚀</button>
  </div>
</div>

<!-- ===== 탐험: 무대 + 사이드바 ===== -->
<div class="explore">
  <div class="stage-zone">
    <div class="viewer-title" id="viewerTitle"><span class="num">🪜</span> 계단 군대</div>
    <div class="stage-canvas" id="stageCanvas"></div>
    <div class="stage-hint" id="stageHint">🖐️ 오른쪽 슬라이더로 계단을 키워 보세요!</div>
  </div>
  <aside class="side">
    <div class="side-head">
      <div class="flag">넘버블럭스 · 삼각수</div>
      <h2>🪜 Step Squad</h2>
    </div>
    <div class="side-body">
      <div class="mode-pills">
        <button class="mode-pill active" id="pill-build" onclick="setMode('build')">🔢 계단 만들기</button>
        <button class="mode-pill" id="pill-quiz" onclick="setMode('quiz')">🎯 퀴즈</button>
      </div>
      <div id="sideContent"></div>
    </div>
  </aside>
</div>

<script>
/* ──────────────────────── 효과음 (Web Audio) + 음소거 ──────────────────────── */
var SND_KEY = 'stepsquad.muted';
var muted = false; try { muted = localStorage.getItem(SND_KEY) === '1'; } catch (e) {}
var actx = null;
function ac() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, dur, type, gain, delay) {
  var c = ac(); if (!c || muted) return;
  var t = c.currentTime + (delay || 0);
  var o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain || 0.14, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + dur + 0.03);
}
function sfx(type) {
  if (muted) return;
  switch (type) {
    case 'move':  tone(540, 0.08, 'triangle', 0.10); break;
    case 'done':  tone(523, 0.12, 'sine', 0.14, 0); tone(659, 0.12, 'sine', 0.14, 0.09); tone(784, 0.18, 'sine', 0.14, 0.18); break;
    case 'star':  tone(988, 0.08, 'triangle', 0.13, 0); tone(1319, 0.13, 'triangle', 0.13, 0.07); break;
    case 'stamp': [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.15, 'square', 0.10, i * 0.11); }); break;
    case 'wrong': tone(233, 0.18, 'sine', 0.13, 0); tone(185, 0.22, 'sine', 0.13, 0.13); break;
  }
}
var MUTE_ICON_ON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>';
var MUTE_ICON_OFF = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/></svg>';
function syncMuteBtn() {
  var b = document.getElementById('muteBtn');
  if (b) { b.innerHTML = muted ? MUTE_ICON_OFF : MUTE_ICON_ON; b.setAttribute('aria-pressed', String(muted)); }
}
function toggleMute() {
  muted = !muted;
  try { localStorage.setItem(SND_KEY, muted ? '1' : '0'); } catch (e) {}
  syncMuteBtn();
  if (!muted) sfx('move');
}
var _bSnd = 0;
function buildSnd() {
  var t = (window.performance && performance.now) ? performance.now() : Date.now();
  if (t - _bSnd > 90) { _bSnd = t; sfx('move'); }
}

/* ──────────────────────── Core ──────────────────────── */
function getStepRank(n) {
  let k = 1;
  while (true) {
    const tri = k * (k + 1) / 2;
    if (tri === n) return k;
    if (tri > n)  return -1;
    k++;
  }
}
const BLOCK_COLORS = ['#FF4757','#FF8C00','#FFD93D','#2ED573','#1E90FF','#A855F7','#FF6EB4','#00CEC9','#FFA07A','#555555'];
function blockColor(i) { return BLOCK_COLORS[(i-1) % BLOCK_COLORS.length]; }

/* ──────────────────────── 토스트 ──────────────────────── */
let toastTimer;
function ssToast(msg) {
  const el = document.getElementById('ssToast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

/* ──────────────────────── 상태 ──────────────────────── */
const QUIZ_TOTAL = 10;
let mode = 'build';        // build | quiz
let buildK = 4;
let quizIdx = 0, quizScore = 0, quizN = null, quizAnswered = false;

const sideContent = () => document.getElementById('sideContent');
const stageCanvas = () => document.getElementById('stageCanvas');
const stageHint = () => document.getElementById('stageHint');
const viewerTitle = () => document.getElementById('viewerTitle');

/* ──────────────────────── 무대 렌더 ──────────────────────── */
function blockNode(color, size) {
  const b = document.createElement('div');
  b.className = 'blk';
  b.style.cssText = `width:${size}px;height:${size}px;background:${color};border-radius:${size >= 44 ? 10 : size >= 32 ? 7 : 5}px;`;
  const shine = document.createElement('div');
  shine.className = 'shine';
  b.appendChild(shine);
  return b;
}
function blockSizeFor(k) {
  return k <= 4 ? 52 : k <= 6 ? 46 : k <= 8 ? 38 : k <= 10 ? 30 : k <= 13 ? 24 : k <= 16 ? 19 : 15;
}

/* 완전한 k단 계단 */
function renderStair(k, withLabels) {
  const stair = document.createElement('div');
  stair.className = 'stage-stair';
  const sz = blockSizeFor(k);
  for (let col = 1; col <= k; col++) {
    const colDiv = document.createElement('div');
    colDiv.className = 'stage-col';
    for (let r = 0; r < col; r++) {
      const b = blockNode(blockColor(col), sz);
      b.style.animationDelay = (r * 0.04 + (col - 1) * 0.07).toFixed(2) + 's';
      colDiv.appendChild(b);
    }
    if (withLabels) {
      const lbl = document.createElement('div');
      lbl.className = 'col-label';
      lbl.style.fontSize = (sz >= 36 ? 16 : 13) + 'px';
      lbl.textContent = col;
      colDiv.appendChild(lbl);
    }
    stair.appendChild(colDiv);
  }
  return stair;
}

/* n개 블록으로 계단 쌓기 시도 — 남는 블록은 회색으로 흔들림 */
function renderAttempt(n) {
  const rank = getStepRank(n);
  const wrap = document.createElement('div');
  wrap.className = 'stage-stair';
  let k = 0;
  while ((k + 1) * (k + 2) / 2 <= n) k++;
  if (rank > 0) k = rank;
  const leftover = n - k * (k + 1) / 2;
  const sz = blockSizeFor(Math.max(k + (leftover > 0 ? 1 : 0), 3));
  for (let col = 1; col <= k; col++) {
    const colDiv = document.createElement('div');
    colDiv.className = 'stage-col';
    for (let r = 0; r < col; r++) {
      const b = blockNode(blockColor(col), sz);
      b.style.animationDelay = (r * 0.04 + (col - 1) * 0.07).toFixed(2) + 's';
      colDiv.appendChild(b);
    }
    wrap.appendChild(colDiv);
  }
  if (leftover > 0) {
    const colDiv = document.createElement('div');
    colDiv.className = 'stage-col';
    for (let r = 0; r < leftover; r++) {
      const b = blockNode('#b8b8b8', sz);
      b.classList.add('leftover');
      b.style.animationDelay = (0.5 + r * 0.05).toFixed(2) + 's';
      colDiv.appendChild(b);
    }
    wrap.appendChild(colDiv);
  }
  return wrap;
}

function renderBuildStage() {
  const k = buildK, n = k * (k + 1) / 2;
  const cv = stageCanvas();
  cv.innerHTML = '';
  cv.appendChild(renderStair(k, true));
  const eq = document.createElement('div');
  eq.className = 'stage-eq';
  eq.textContent = Array.from({length: k}, (_, i) => i + 1).join(' + ') + ' = ' + n;
  cv.appendChild(eq);
  viewerTitle().innerHTML = `<span class="num">${k}</span> ${k}단 계단 군대 — 합계 ${n}`;
  stageHint().textContent = '🖐️ 오른쪽 슬라이더로 계단을 키워 보세요!';
  stageHint().style.display = '';
}

function renderQuizStage(revealed) {
  const cv = stageCanvas();
  cv.innerHTML = '';
  if (quizN == null) return;
  if (!revealed) {
    const big = document.createElement('div');
    big.className = 'stage-mystery';
    big.textContent = quizN;
    cv.appendChild(big);
    const row = document.createElement('div');
    row.className = 'stage-stair';
    const sz = quizN > 20 ? 18 : 26;
    for (let i = 0; i < quizN; i++) {
      const b = blockNode('#9AA7B8', sz);
      b.style.animationDelay = (i * 0.02).toFixed(2) + 's';
      row.appendChild(b);
    }
    row.style.flexWrap = 'wrap';
    row.style.justifyContent = 'center';
    row.style.maxWidth = '460px';
    cv.appendChild(row);
    stageHint().textContent = '🤔 이 블록들을 계단 모양으로 쌓을 수 있을까요?';
  } else {
    const rank = getStepRank(quizN);
    cv.appendChild(renderAttempt(quizN));
    const eq = document.createElement('div');
    eq.className = 'stage-eq';
    eq.textContent = rank > 0
      ? Array.from({length: rank}, (_, i) => i + 1).join(' + ') + ' = ' + quizN
      : quizN + ' = 계단이 되다 만 모양!';
    cv.appendChild(eq);
    stageHint().textContent = rank > 0 ? '🎉 완벽한 계단이에요!' : '😅 회색 블록이 남아 버렸어요!';
  }
  viewerTitle().innerHTML = `<span class="num">${quizIdx + 1}</span> 퀴즈 ${quizIdx + 1} / ${QUIZ_TOTAL}`;
}

/* ──────────────────────── 사이드바: 계단 만들기 ──────────────────────── */
function renderBuildSide() {
  sideContent().innerHTML = `
    <div class="observe-box">
      <h3>🔍 관찰 포인트</h3>
      <p>계단은 <b>1, 2, 3, …</b> 한 칸씩 커지는 줄로 만들어져요. 합계가 <b>1, 3, 6, 10, 15…</b> 로 변하는 걸 찾아보세요!</p>
    </div>
    <div class="slider-card">
      <label>계단 높이 (1 ~ 20단)</label>
      <div class="slider-row">
        <input type="number" id="numInput" class="num-input" min="1" max="20" value="${buildK}"
          oninput="onNumInput()" onchange="onNumInput()">
        <div style="flex:1;display:flex;flex-direction:column;min-width:120px;">
          <input type="range" id="numSlider" min="1" max="20" value="${buildK}" oninput="onSlider()" style="width:100%;">
          <div class="range-labels"><span>1단</span><span>10단</span><span>20단</span></div>
        </div>
      </div>
    </div>
    <div class="tip-box">💡 <b>탐험 팁</b> · 이렇게 만들어지는 수(1, 3, 6, 10, …)를 <b>삼각수</b>라고도 불러요. 공식은 <b>k × (k+1) ÷ 2</b>!</div>
    <div class="next-zone">
      <button class="btn btn-blue" onclick="setMode('quiz')">🎯 퀴즈로 도전! ➡️</button>
    </div>`;
}
function onSlider() {
  const v = parseInt(document.getElementById('numSlider').value);
  document.getElementById('numInput').value = v;
  buildK = v;
  renderBuildStage();
  buildSnd();
}
function onNumInput() {
  let k = parseInt(document.getElementById('numInput').value);
  if (!k || k < 1) k = 1;
  if (k > 20) k = 20;
  document.getElementById('numInput').value = k;
  document.getElementById('numSlider').value = k;
  buildK = k;
  renderBuildStage();
  buildSnd();
}

/* ──────────────────────── 사이드바: 퀴즈 ──────────────────────── */
const triangulars = new Set();
for (let k = 1; k * (k + 1) / 2 <= 120; k++) triangulars.add(k * (k + 1) / 2);

function pickQuizN() {
  if (Math.random() < 0.5) {
    const tris = [...triangulars].filter(x => x >= 3 && x <= 30);
    return tris[Math.floor(Math.random() * tris.length)];
  }
  const nonTri = [];
  for (let i = 2; i <= 30; i++) if (!triangulars.has(i)) nonTri.push(i);
  return nonTri[Math.floor(Math.random() * nonTri.length)];
}

function startQuiz() {
  quizIdx = 0; quizScore = 0;
  nextQuestion();
}
function nextQuestion() {
  quizAnswered = false;
  quizN = pickQuizN();
  renderQuizStage(false);
  sideContent().innerHTML = `
    <div class="progress-zone">
      <div class="progress-track"><div class="progress-fill" style="width:${quizIdx / QUIZ_TOTAL * 100}%"></div></div>
      <div class="progress-label"><span>퀴즈 진행 중</span><span>${quizIdx + 1} / ${QUIZ_TOTAL}</span></div>
    </div>
    <div class="observe-box">
      <h3>🔍 관찰 포인트</h3>
      <p>무대의 블록 <b>${quizN}개</b>를 보세요. 1, 2, 3, … 계단 줄로 남김없이 나눌 수 있을까요?</p>
    </div>
    <div class="quiz-zone" aria-live="polite">
      <div class="quiz-q">충분히 상상했나요?<br><b>${quizN}</b>은(는) 계단 군대의 일원일까요?</div>
      <div class="quiz-btns">
        <button class="quiz-btn yes" onclick="answerQuiz(true)">🪜 계단 군대예요!</button>
        <button class="quiz-btn no" onclick="answerQuiz(false)">🧱 아니에요!</button>
      </div>
    </div>`;
  sfx('move');
  document.querySelector('.side').scrollTo({ top: 0 });
}
function answerQuiz(userSaysYes) {
  if (quizAnswered) return;
  quizAnswered = true;
  const rank = getStepRank(quizN);
  const isStep = rank > 0;
  const correct = userSaysYes === isStep;
  if (correct) { quizScore++; sfx('done'); if (isStep) setTimeout(() => sfx('star'), 220); }
  else sfx('wrong');

  renderQuizStage(true);

  const explainHtml = isStep
    ? `${quizN}은(는) <b>${rank}단 계단</b>이에요! 1 + 2 + … + ${rank} = ${quizN}. 블록이 딱 맞게 계단이 되었죠?`
    : `${quizN}은(는) 계단 모양으로 쌓을 수 없어요. 계단을 만들고 나면 <b>회색 블록이 남아요</b>. 계단 군대 수는 1, 3, 6, 10, 15, 21…이에요.`;

  const zone = sideContent().querySelector('.quiz-zone');
  zone.innerHTML = `
    <div class="reveal">
      <div class="reveal-banner ${correct ? 'correct' : 'wrong'}">
        ${correct ? '🎉 딩동댕! 정답이에요!' : '🤔 아쉬워요! 무대를 다시 봐요'}
      </div>
      <div class="explain">${explainHtml}</div>
      <div class="next-zone">
        <button class="btn btn-primary" onclick="afterQuestion()">
          ${quizIdx === QUIZ_TOTAL - 1 ? '결과 보기 🏁' : '다음 문제! ➡️'}
        </button>
      </div>
    </div>`;
}
function afterQuestion() {
  quizIdx++;
  if (quizIdx >= QUIZ_TOTAL) { renderResult(); return; }
  nextQuestion();
}
function renderResult() {
  quizN = null;
  const cv = stageCanvas();
  cv.innerHTML = '';
  cv.appendChild(renderStair(6, false));
  const eq = document.createElement('div');
  eq.className = 'stage-eq';
  eq.textContent = '🏆 퀴즈 완료!';
  cv.appendChild(eq);
  viewerTitle().innerHTML = '🏆 탐험 완료!';
  stageHint().style.display = 'none';
  if (quizScore >= 8) sfx('stamp');
  sideContent().innerHTML = `
    <div class="result">
      <h2>🏆 퀴즈 완료!</h2>
      <div class="score">${QUIZ_TOTAL}개 중 ${quizScore}개 맞혔어요</div>
      <div class="summary-box">
        <h3>📚 오늘의 배움 정리</h3>
        <p>계단 군대 수는 <b>1 + 2 + 3 + … + k</b>로 만들 수 있는 수예요.
        <b>1, 3, 6, 10, 15, 21…</b> 처럼 계속 이어지고, <b>삼각수</b>라고도 불러요.
        블록을 계단으로 쌓아 보면 바로 알 수 있답니다!</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <button class="btn btn-primary" onclick="startQuiz()">다시 도전하기 🔄</button>
        <button class="btn" onclick="setMode('build')">🔢 계단 만들기로</button>
      </div>
    </div>`;
  document.querySelector('.side').scrollTo({ top: 0 });
}

/* ──────────────────────── 모드/시작 ──────────────────────── */
function setMode(m) {
  mode = m;
  document.getElementById('pill-build').classList.toggle('active', m === 'build');
  document.getElementById('pill-quiz').classList.toggle('active', m === 'quiz');
  if (m === 'build') { renderBuildSide(); renderBuildStage(); }
  else startQuiz();
}
function startExplore() {
  document.body.classList.add('exploring');
  setMode('build');
  sfx('done');
}

/* ──────────────────────── 인트로 미니 계단 ──────────────────────── */
(function () {
  const host = document.getElementById('introStair');
  for (let col = 1; col <= 5; col++) {
    const c = document.createElement('div');
    c.className = 'col';
    for (let r = 0; r < col; r++) {
      const b = document.createElement('div');
      b.className = 'blk';
      b.style.cssText = `width:26px;height:26px;border-radius:6px;background:${blockColor(col)};animation-delay:${(r * 0.06 + col * 0.1).toFixed(2)}s;`;
      c.appendChild(b);
    }
    host.appendChild(c);
  }
})();
syncMuteBtn();
</script>
</body>
</html>

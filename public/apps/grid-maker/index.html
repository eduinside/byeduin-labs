<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Grid Maker — eduin VIVES</title>
  <link rel="stylesheet" href="/common/hero-theme.css">
  <script src="/common/theme.js"></script>
  <script src="/common/init.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    body {
      padding: 56px 1rem 5rem;
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(0,111,238,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,111,238,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none; z-index: 0;
    }

    .page-wrap {
      max-width: 900px;
      margin: 0 auto;
      position: relative; z-index: 1;
    }

    /* ── 레이아웃 ── */
    .grid-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 1.25rem;
      align-items: start;
    }
    @media (max-width: 680px) {
      .grid-layout { grid-template-columns: 1fr; }
    }

    /* ── 사이드바 ── */
    .sidebar { display: flex; flex-direction: column; gap: 1rem; }

    .step-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      overflow: hidden;
    }
    .step-section { padding: 1.125rem 1.25rem; }
    .step-section + .step-section { border-top: 1px solid var(--border); }

    .step-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }

    /* ── 업로드 존 ── */
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: 0.875rem;
      padding: 1.25rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, transform 0.2s;
    }
    .upload-zone:hover {
      border-color: var(--primary);
      background: rgba(0,111,238,0.04);
    }
    .upload-zone.drag-over {
      border-color: var(--primary);
      background: rgba(0,111,238,0.08);
      transform: scale(1.01);
    }
    .upload-icon {
      width: 40px; height: 40px;
      background: rgba(0,111,238,0.1);
      color: var(--primary);
      border-radius: 0.75rem;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 0.625rem;
      font-size: 1.1rem;
      transition: transform 0.2s;
    }
    .upload-zone:hover .upload-icon { transform: scale(1.12) translateY(-2px); }
    .upload-zone p { font-size: 13px; font-weight: 600; color: var(--fg); margin: 0 0 2px; }
    .upload-zone small { font-size: 11px; color: var(--fg-muted); }

    /* ── 프리셋 버튼 그리드 ── */
    .preset-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.4rem;
    }
    .preset-btn {
      padding: 0.5rem 0.375rem;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 0.625rem;
      font-size: 12px; font-weight: 600;
      color: var(--fg-muted);
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }
    .preset-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: rgba(0,111,238,0.05);
    }
    .preset-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    /* ── 커스텀 추가 ── */
    .custom-add-row { display: flex; align-items: center; gap: 0.3rem; }
    .custom-input {
      display: none;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 7px;
      font-size: 11px; color: var(--fg);
      outline: none; width: 72px;
    }
    .custom-input.show { display: block; }
    .custom-input:focus { border-color: var(--primary); }
    .icon-btn {
      width: 26px; height: 26px;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--bg-sec); border: 1px solid var(--border);
      border-radius: 6px; cursor: pointer; color: var(--fg-muted);
      font-size: 15px; line-height: 1; flex-shrink: 0;
      transition: all 0.15s;
    }
    .icon-btn:hover { background: rgba(0,111,238,0.08); color: var(--primary); border-color: var(--primary); }

    /* ── 저장 버튼 ── */
    #save-btn {
      width: 100%;
      padding: 0.875rem;
      background: var(--bg-sec);
      border: 1.5px solid var(--border);
      border-radius: 1rem;
      font-size: 15px; font-weight: 700;
      color: var(--fg-muted);
      cursor: not-allowed;
      transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    }
    #save-btn.ready {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,111,238,0.28);
    }
    #save-btn.ready:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(0,111,238,0.35); }

    /* ── 미리보기 영역 ── */
    .preview-stage {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 1.25rem;
      min-height: 380px;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .empty-view { text-align: center; }
    .empty-icon {
      width: 72px; height: 72px;
      background: var(--bg-sec); color: var(--border);
      border-radius: 1.25rem;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1rem; font-size: 2rem;
    }
    .empty-view h3 { font-size: 16px; font-weight: 700; color: var(--fg); margin: 0 0 4px; }
    .empty-view p  { font-size: 13px; color: var(--fg-muted); margin: 0; }

    .crop-target {
      position: relative; width: 100%;
      background: var(--bg-sec);
      border-radius: 4px; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      cursor: move; user-select: none; touch-action: none;
      transition: aspect-ratio 0.4s ease;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    }
    #preview-img {
      position: absolute; width: 100%; height: 100%;
      object-fit: contain; z-index: 1;
      pointer-events: none; will-change: transform;
      transform-origin: center center;
    }
    .grid-overlay { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
    .grid-line-v {
      position: absolute; top: 0; bottom: 0; width: 1px;
      background: rgba(255,255,255,0.6); backdrop-filter: invert(0.1);
    }
    .grid-line-h {
      position: absolute; left: 0; right: 0; height: 1px;
      background: rgba(255,255,255,0.6); backdrop-filter: invert(0.1);
    }
    .glass-info {
      position: absolute; bottom: 0.875rem; left: 0.875rem;
      background: rgba(15,23,42,0.8); backdrop-filter: blur(8px);
      color: #fff; padding: 0.5rem 0.75rem; border-radius: 0.625rem;
      font-size: 11px; z-index: 50;
      border: 1px solid rgba(255,255,255,0.1); line-height: 1.6;
    }

    /* ── 조정 패널 ── */
    .adj-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 1.125rem 1.25rem;
      margin-top: 0.875rem;
      display: flex; flex-direction: column; gap: 1rem;
      transition: opacity 0.2s;
    }
    .adj-panel.disabled { opacity: 0.4; pointer-events: none; }

    .action-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; }

    .adj-sliders { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 480px) { .adj-sliders { grid-template-columns: 1fr; } }

    .adj-field { display: flex; flex-direction: column; gap: 0.4rem; }
    .adj-label-row { display: flex; justify-content: space-between; align-items: center; }

    input[type="range"] {
      -webkit-appearance: none; width: 100%;
      height: 4px; background: var(--border); border-radius: 99px; outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px;
      background: var(--primary); border-radius: 50%; cursor: pointer;
      border: 2px solid var(--bg); box-shadow: 0 2px 6px rgba(0,111,238,0.3);
    }
    .value-input {
      width: 44px; text-align: center;
      font-weight: 700; font-size: 12px; color: var(--primary);
      background: var(--input-bg); border: 1px solid var(--border);
      border-radius: 5px; padding: 2px 0; outline: none;
    }
    .unit { font-size: 11px; color: var(--fg-muted); }

    .help-row {
      display: flex; flex-wrap: wrap; gap: 0.875rem; justify-content: center;
      padding-top: 0.75rem; border-top: 1px solid var(--border);
    }
    .help-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--fg-muted); }

    /* ── 로더 ── */
    #loader {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
      z-index: 200; display: none;
      align-items: center; justify-content: center;
    }
    #loader.show { display: flex; }
    .loader-box {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 1.25rem; padding: 2rem 2.5rem; text-align: center;
    }
    .spinner {
      width: 44px; height: 44px;
      border: 3px solid var(--border); border-top-color: var(--primary);
      border-radius: 50%; animation: spin 0.7s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-box p { margin: 0; font-weight: 700; font-size: 15px; }
    .loader-box small { color: var(--fg-muted); font-size: 12px; }

    /* ── fd-btn (design system) ── */
    .fd-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      padding: 8px 14px; border-radius: 8px; border: none;
      font-size: 12px; font-weight: 600; cursor: pointer;
      transition: all 0.15s; min-height: 36px;
    }
    .fd-btn-primary { background: var(--primary); color: #fff; }
    .fd-btn-primary:hover { background: var(--primary-h); }
    .fd-btn-ghost {
      background: none; border: 1px solid var(--border);
      color: var(--fg-muted);
    }
    .fd-btn-ghost:hover {
      border-color: var(--primary); color: var(--primary);
      background: rgba(0,111,238,0.06);
    }
  </style>

<body>

  <!-- 좌상단: 홈 -->
  <div class="top-overlay-left">
    <a href="/" class="overlay-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span>Home</span>
    </a>
  </div>
  <!-- 우상단: 테마 + 공유 -->
  <div class="top-overlay">
    <button id="themeToggleBtn" class="overlay-btn" onclick="cycleTheme()">💻</button>
    <button class="overlay-btn" onclick="shareCurrentPage()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" x2="12" y1="2" y2="15"/>
      </svg>
      <span>공유</span>
    </button>
  </div>

  <div class="page-wrap">
    <header class="app-header">
      <span class="app-badge">◆ 크리에이티브</span>
      <h1 class="app-title">Grid <span style="color:var(--primary)">Maker</span></h1>
      <p class="app-desc">이미지를 그리드로 분할하고 ZIP으로 저장하세요.</p>
    </header>

    <div class="grid-layout">
      <!-- ── 사이드바 ── -->
      <aside class="sidebar">
        <div class="step-card">

          <!-- 01. 업로드 -->
          <div class="step-section">
            <div class="fd-section-title">01. 이미지 업로드</div>
            <div class="upload-zone" id="upload-zone">
              <input type="file" id="file-input" accept="image/*" style="display:none">
              <div class="upload-icon">📤</div>
              <p>클릭 또는 드래그하여 업로드</p>
              <small>PNG, JPG, WEBP 지원</small>
            </div>
          </div>

          <!-- 02. 비율 -->
          <div class="step-section">
            <div class="step-header">
              <span class="fd-section-title" style="margin:0">02. 개별 비율</span>
              <div class="custom-add-row">
                <input type="text" id="custom-ratio-input" class="custom-input" placeholder="16:9">
                <button class="icon-btn" onclick="toggleInput('custom-ratio-input')" title="커스텀 비율 추가">+</button>
              </div>
            </div>
            <div class="preset-grid" id="ratio-container"></div>
          </div>

          <!-- 03. 레이아웃 -->
          <div class="step-section">
            <div class="step-header">
              <span class="fd-section-title" style="margin:0">03. 전체 레이아웃</span>
              <div class="custom-add-row">
                <input type="text" id="custom-grid-input" class="custom-input" placeholder="4×1">
                <button class="icon-btn" onclick="toggleInput('custom-grid-input')" title="커스텀 그리드 추가">+</button>
              </div>
            </div>
            <div class="preset-grid" id="preset-container"></div>
          </div>

        </div>

        <!-- 저장 버튼 -->
        <button id="save-btn" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          압축파일 생성
        </button>
      </aside>

      <!-- ── 메인 캔버스 ── -->
      <div>
        <div class="preview-stage">
          <!-- 빈 상태 -->
          <div id="empty-view" class="empty-view">
            <div class="empty-icon">🖼️</div>
            <h3>이미지가 비어있습니다</h3>
            <p>편집할 이미지를 먼저 로드해 주세요.</p>
          </div>

          <!-- 미리보기 -->
          <div id="preview-box" class="crop-target" style="display:none">
            <img id="preview-img" src="" alt="">
            <div id="grid-overlay" class="grid-overlay"></div>
            <div id="info-badge" class="glass-info" style="display:none"></div>
          </div>
        </div>

        <!-- 조정 패널 -->
        <div id="adjustment-panel" class="adj-panel disabled">
          <div class="action-row">
            <button class="fd-btn fd-btn-primary" onclick="smartAutoFit()">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4V2m0 20v-2M8 8l-1.5-1.5M18.5 18.5 17 17m0-9 1.5-1.5M5.5 18.5 7 17M4 15H2m20 0h-2"/><circle cx="12" cy="12" r="4"/></svg>
              스마트 핏
            </button>
            <button class="fd-btn fd-btn-ghost" onclick="rotate90()">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
              90° 회전
            </button>
            <button class="fd-btn fd-btn-ghost" onclick="resetAdjustments()">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
              초기화
            </button>
          </div>

          <div class="adj-sliders">
            <div class="adj-field">
              <div class="adj-label-row">
                <span class="fd-section-title" style="margin:0;font-size:10px">확대/축소</span>
                <div style="display:flex;align-items:center;gap:3px">
                  <input type="number" id="zoom-val-input" class="value-input" value="100" min="10" max="500">
                  <span class="unit">%</span>
                </div>
              </div>
              <input type="range" id="zoom-slider" min="0.1" max="5" step="0.01" value="1">
            </div>
            <div class="adj-field">
              <div class="adj-label-row">
                <span class="fd-section-title" style="margin:0;font-size:10px">회전</span>
                <div style="display:flex;align-items:center;gap:3px">
                  <input type="number" id="rotate-val-input" class="value-input" value="0" min="-360" max="360">
                  <span class="unit">°</span>
                </div>
              </div>
              <input type="range" id="rotate-slider" min="-180" max="180" step="1" value="0">
            </div>
          </div>

          <div class="help-row">
            <span class="help-item">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l4-4 4 4"/><path d="M9 5v14"/><path d="M19 15l-4 4-4-4"/><path d="M15 19V5"/></svg>
              드래그 및 핀치 줌으로 구도 조정
            </span>
            <span class="help-item">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
              설정 자동 저장 및 스마트 핏 지원
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 로더 -->
  <div id="loader">
    <div class="loader-box">
      <div class="spinner"></div>
      <p>이미지 분할 중</p>
      <small>잠시만 기다려 주세요...</small>
    </div>
  </div>

  <!-- 토스트 -->
  <div id="fd-toast"></div>

  <script>
    const STORAGE_KEY = 'grid_maker_pro_settings_v5';

    let state = {
      image: null, ratio: '1:1',
      cols: 2, rows: 1,
      offsetX: 0, offsetY: 0,
      scale: 1, rotation: 0,
      customRatios: [], customGrids: []
    };

    const defaultGridPresets = [
      { label: '2 × 1', c: 2, r: 1 },
      { label: '3 × 1', c: 3, r: 1 },
      { label: '1 × 1', c: 1, r: 1 },
      { label: '3 × 2', c: 3, r: 2 },
      { label: '3 × 3', c: 3, r: 3 },
    ];

    const el = {
      fileInput:        document.getElementById('file-input'),
      uploadZone:       document.getElementById('upload-zone'),
      previewImg:       document.getElementById('preview-img'),
      previewBox:       document.getElementById('preview-box'),
      emptyView:        document.getElementById('empty-view'),
      overlay:          document.getElementById('grid-overlay'),
      saveBtn:          document.getElementById('save-btn'),
      loader:           document.getElementById('loader'),
      presetContainer:  document.getElementById('preset-container'),
      ratioContainer:   document.getElementById('ratio-container'),
      adjPanel:         document.getElementById('adjustment-panel'),
      zoomSlider:       document.getElementById('zoom-slider'),
      rotateSlider:     document.getElementById('rotate-slider'),
      zoomValInput:     document.getElementById('zoom-val-input'),
      rotateValInput:   document.getElementById('rotate-val-input'),
      infoBadge:        document.getElementById('info-badge'),
      customRatioInput: document.getElementById('custom-ratio-input'),
      customGridInput:  document.getElementById('custom-grid-input'),
    };

    let isDragging = false, lastX, lastY;
    let initialDist = 0, initialAngle = 0, startScale = 1, startRotation = 0;

    // ── 초기화 ──
    function init() {
      loadSettings();
      renderPresets();
      setupInputListeners();
      updateUI();
    }

    // ── 설정 저장/복원 ──
    function saveSettings() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        ratio: state.ratio, cols: state.cols, rows: state.rows,
        customRatios: state.customRatios, customGrids: state.customGrids,
      }));
    }
    function loadSettings() {
      try {
        const p = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        state.ratio = p.ratio || '1:1';
        state.cols  = p.cols  || 2;
        state.rows  = p.rows  || 1;
        state.customRatios = p.customRatios || [];
        state.customGrids  = p.customGrids  || [];
      } catch {}
    }

    // ── 프리셋 렌더링 ──
    function renderPresets() {
      // 비율
      el.ratioContainer.innerHTML = '';
      ['1:1', '4:5', ...state.customRatios].forEach(r => {
        const btn = document.createElement('button');
        btn.className = 'preset-btn';
        btn.textContent = r;
        btn.dataset.id = `ratio-${r}`;
        btn.onclick = () => changeRatio(r);
        el.ratioContainer.appendChild(btn);
      });
      // 그리드
      el.presetContainer.innerHTML = '';
      [...defaultGridPresets, ...state.customGrids].forEach(p => {
        const btn = document.createElement('button');
        btn.className = 'preset-btn';
        btn.textContent = p.label;
        btn.dataset.id = `grid-${p.c}-${p.r}`;
        btn.onclick = () => updateGrid(p.c, p.r);
        el.presetContainer.appendChild(btn);
      });
      updateUI();
    }

    // ── 커스텀 입력 토글 ──
    function toggleInput(id) {
      const input = document.getElementById(id);
      input.classList.toggle('show');
      if (input.classList.contains('show')) {
        input.focus();
        input.onkeydown = (e) => {
          if (e.key === 'Enter') {
            if (id === 'custom-ratio-input') addCustomRatio();
            else addCustomGrid();
            input.classList.remove('show');
          }
          if (e.key === 'Escape') input.classList.remove('show');
        };
      }
    }

    function addCustomRatio() {
      const val = el.customRatioInput.value.trim();
      if (/^\d+:\d+$/.test(val) && !state.customRatios.includes(val)) {
        state.customRatios.push(val);
        el.customRatioInput.value = '';
        saveSettings(); renderPresets();
      }
    }
    function addCustomGrid() {
      const match = el.customGridInput.value.trim().toLowerCase().match(/^(\d+)[x*×](\d+)$/);
      if (match) {
        const c = +match[1], r = +match[2];
        if (c > 0 && r > 0 && !state.customGrids.find(g => g.c === c && g.r === r)) {
          state.customGrids.push({ label: `${c} × ${r}`, c, r });
          el.customGridInput.value = '';
          saveSettings(); renderPresets();
        }
      }
    }

    function changeRatio(r) { state.ratio = r; saveSettings(); updateUI(); }
    function updateGrid(c, r) { state.cols = c; state.rows = r; saveSettings(); updateUI(); }

    // ── 슬라이더 입력 연동 ──
    function setupInputListeners() {
      el.zoomValInput.onchange = (e) => {
        let v = Math.max(10, Math.min(500, parseFloat(e.target.value) || 100));
        state.scale = v / 100; updateSliderUI(); applyTransform();
      };
      el.rotateValInput.onchange = (e) => {
        state.rotation = parseFloat(e.target.value) || 0; updateSliderUI(); applyTransform();
      };
      el.zoomSlider.oninput = (e) => {
        state.scale = parseFloat(e.target.value); updateSliderUI(); applyTransform();
      };
      el.rotateSlider.oninput = (e) => {
        state.rotation = parseInt(e.target.value); updateSliderUI(); applyTransform();
      };
    }

    function updateSliderUI() {
      el.zoomSlider.value    = state.scale;
      el.rotateSlider.value  = state.rotation;
      el.zoomValInput.value  = Math.round(state.scale * 100);
      el.rotateValInput.value = Math.round(state.rotation);
      updateInfoBadge();
    }

    // ── 편집 조작 ──
    function resetAdjustments() {
      state.offsetX = 0; state.offsetY = 0; state.rotation = 0; state.scale = 1;
      updateSliderUI(); applyTransform();
    }
    function rotate90() {
      state.rotation = (Math.round(state.rotation / 90) * 90 + 90);
      updateSliderUI(); applyTransform();
    }
    function smartAutoFit() {
      if (!state.image) return;
      state.offsetX = 0; state.offsetY = 0; state.rotation = 0;
      const [uw, uh] = state.ratio.split(':').map(Number);
      const targetRatio = (uw * state.cols) / (uh * state.rows);
      const imgRatio = state.image.width / state.image.height;
      state.scale = imgRatio > targetRatio ? imgRatio / targetRatio : targetRatio / imgRatio;
      updateSliderUI(); updateUI();
      showToast('최적의 구도를 찾았습니다.');
    }

    function applyTransform() {
      el.previewImg.style.transform =
        `translate(${state.offsetX}px, ${state.offsetY}px) rotate(${state.rotation}deg) scale(${state.scale})`;
    }

    // ── 파일 처리 ──
    function handleFile(file) {
      if (!file || !file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => { state.image = img; el.previewImg.src = e.target.result; updateUI(); };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    el.fileInput.onchange = (e) => handleFile(e.target.files[0]);
    el.uploadZone.onclick = () => el.fileInput.click();
    el.uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); el.uploadZone.classList.add('drag-over'); });
    el.uploadZone.addEventListener('dragleave', (e) => { if (!el.uploadZone.contains(e.relatedTarget)) el.uploadZone.classList.remove('drag-over'); });
    el.uploadZone.addEventListener('drop', (e) => {
      e.preventDefault(); el.uploadZone.classList.remove('drag-over');
      handleFile(e.dataTransfer.files[0]);
    });

    // ── 마우스/터치 드래그 ──
    el.previewBox.addEventListener('mousedown', e => { if (!state.image) return; isDragging = true; lastX = e.clientX; lastY = e.clientY; });
    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      state.offsetX += e.clientX - lastX; state.offsetY += e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY; applyTransform();
    });
    window.addEventListener('mouseup', () => isDragging = false);

    const getDist  = (t1, t2) => Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
    const getAngle = (t1, t2) => Math.atan2(t2.clientY - t1.clientY, t2.clientX - t1.clientX) * 180 / Math.PI;

    el.previewBox.addEventListener('touchstart', e => {
      if (!state.image) return;
      if (e.touches.length === 1) { isDragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; }
      else if (e.touches.length === 2) {
        isDragging = false;
        initialDist = getDist(e.touches[0], e.touches[1]);
        initialAngle = getAngle(e.touches[0], e.touches[1]);
        startScale = state.scale; startRotation = state.rotation;
      }
    }, { passive: false });

    window.addEventListener('touchmove', e => {
      if (e.touches.length === 1 && isDragging) {
        state.offsetX += e.touches[0].clientX - lastX; state.offsetY += e.touches[0].clientY - lastY;
        lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; applyTransform();
      } else if (e.touches.length === 2 && initialDist > 0) {
        const cd = getDist(e.touches[0], e.touches[1]);
        const ca = getAngle(e.touches[0], e.touches[1]);
        state.scale = Math.min(Math.max(0.1, startScale * (cd / initialDist)), 5);
        state.rotation = startRotation + (ca - initialAngle);
        updateSliderUI(); applyTransform();
      }
    }, { passive: false });
    window.addEventListener('touchend', () => { isDragging = false; initialDist = 0; });

    // ── 정보 배지 ──
    function updateInfoBadge() {
      const [uw, uh] = state.ratio.split(':').map(Number);
      const pw = 1080, ph = Math.round((1080 / uw) * uh);
      const total = state.cols * state.rows;
      const kbEach = Math.round((pw * ph * 3 * 0.1) / 1024);
      el.infoBadge.innerHTML =
        `<span style="font-size:9px;opacity:.6;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid rgba(255,255,255,.2);display:block;padding-bottom:3px;margin-bottom:3px">Image Details</span>` +
        `조각: ${pw}×${ph}px (${total}개)<br>예상: 약 ${kbEach}KB/조각`;
    }

    // ── UI 업데이트 ──
    function updateUI() {
      document.querySelectorAll('.preset-btn[data-id^="ratio-"]').forEach(b =>
        b.classList.toggle('active', b.dataset.id === `ratio-${state.ratio}`)
      );
      document.querySelectorAll('.preset-btn[data-id^="grid-"]').forEach(b =>
        b.classList.toggle('active', b.dataset.id === `grid-${state.cols}-${state.rows}`)
      );

      if (!state.image) return;

      el.emptyView.style.display = 'none';
      el.previewBox.style.display = 'flex';
      el.infoBadge.style.display = 'block';
      el.saveBtn.disabled = false;
      el.saveBtn.classList.add('ready');
      el.adjPanel.classList.remove('disabled');

      const [uw, uh] = state.ratio.split(':').map(Number);
      el.previewBox.style.aspectRatio = `${uw * state.cols} / ${uh * state.rows}`;

      const boxRatio = (uw * state.cols) / (uh * state.rows);
      const imgRatio = state.image.width / state.image.height;
      el.previewImg.style.width  = imgRatio > boxRatio ? 'auto' : '100%';
      el.previewImg.style.height = imgRatio > boxRatio ? '100%' : 'auto';

      updateInfoBadge();

      el.overlay.innerHTML = '';
      for (let i = 1; i < state.cols; i++) {
        const l = document.createElement('div'); l.className = 'grid-line-v';
        l.style.left = `${(i / state.cols) * 100}%`; el.overlay.appendChild(l);
      }
      for (let i = 1; i < state.rows; i++) {
        const l = document.createElement('div'); l.className = 'grid-line-h';
        l.style.top = `${(i / state.rows) * 100}%`; el.overlay.appendChild(l);
      }
      applyTransform();
    }

    // ── 압축 파일 저장 ──
    el.saveBtn.onclick = async () => {
      if (!state.image) return;
      el.loader.classList.add('show');
      const zip = new JSZip();
      const [uw, uh] = state.ratio.split(':').map(Number);
      const qw = 1080, qh = Math.round((qw / uw) * uh);

      const masterCanvas = document.createElement('canvas');
      const mCtx = masterCanvas.getContext('2d');
      const fullW = qw * state.cols, fullH = qh * state.rows;
      masterCanvas.width = fullW; masterCanvas.height = fullH;

      mCtx.save();
      mCtx.translate(fullW / 2, fullH / 2);
      const rect = el.previewBox.getBoundingClientRect();
      const sf = fullW / rect.width;
      mCtx.translate(state.offsetX * sf, state.offsetY * sf);
      mCtx.rotate(state.rotation * Math.PI / 180);
      mCtx.scale(state.scale, state.scale);

      const ir = state.image.width / state.image.height;
      const br = (uw * state.cols) / (uh * state.rows);
      const dH = ir > br ? fullH : fullW / ir;
      const dW = ir > br ? fullH * ir : fullW;
      mCtx.drawImage(state.image, -dW / 2, -dH / 2, dW, dH);
      mCtx.restore();

      try {
        const tileCanvas = document.createElement('canvas');
        const tCtx = tileCanvas.getContext('2d');
        tileCanvas.width = qw; tileCanvas.height = qh;
        const jobs = [];
        for (let r = 0; r < state.rows; r++) {
          for (let c = 0; c < state.cols; c++) {
            tCtx.clearRect(0, 0, qw, qh);
            tCtx.drawImage(masterCanvas, c * qw, r * qh, qw, qh, 0, 0, qw, qh);
            jobs.push(new Promise(res => {
              tileCanvas.toBlob(blob => { zip.file(`part_${r + 1}_${c + 1}.jpg`, blob); res(); }, 'image/jpeg', 0.92);
            }));
          }
        }
        await Promise.all(jobs);
        const content = await zip.generateAsync({ type: 'blob' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(content);
        link.download = `grid_pack_${Date.now()}.zip`;
        link.click();
        showToast('압축 파일이 저장되었습니다.');
      } catch { showToast('오류가 발생했습니다.'); }
      finally { el.loader.classList.remove('show'); }
    };

    // ── 토스트 (design system 패턴) ──
    let _toastTimer;
    function showToast(msg) {
      const el = document.getElementById('fd-toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
    }

    init();
  </script>
</body>
</html>

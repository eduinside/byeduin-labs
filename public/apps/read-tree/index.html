  <style>
    /* ===== Read Tree — 앱 전용 스타일 (색은 공용 토큰 + 레벨 액센트) ===== */
    .app-main { padding-bottom: 4rem; }
    [hidden] { display: none !important; }
    .muted { color: var(--fg-muted); font-size: 12px; }

    /* ===== 로그인 ===== */
    #loginView { max-width: 360px; margin: 0 auto; }
    #loginView .app-header { text-align: center; margin-top: 16px; }
    #loginView .app-badge { margin-left: auto; margin-right: auto; }
    .login-card { padding: 18px; margin-bottom: 12px; }
    .login-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; }
    .login-card .hero-input { margin-bottom: 10px; text-align: center; letter-spacing: 0.18em; font-weight: 700; }
    .login-card .hero-btn, .login-card .hero-btn-ghost { width: 100%; }
    .or { text-align: center; color: var(--fg-muted); font-size: 12px; margin: 6px 0 12px; }
    .err { color: var(--danger); font-size: 12px; min-height: 16px; margin-top: 8px; text-align: center; }
    .new-code { margin-top: 14px; text-align: center; }
    .new-code-val { font-size: 30px; font-weight: 800; letter-spacing: 0.24em; color: var(--primary);
                    margin-bottom: 12px; font-family: 'JetBrains Mono', ui-monospace, monospace; }
    .hint { font-size: 12px; color: var(--fg-muted); margin-top: 10px; line-height: 1.5; }

    /* ===== 요약 카드 (코드 · 진행 · 뱃지) ===== */
    .summary { padding: 16px 18px; margin-bottom: 18px; display: flex; flex-direction: column; gap: 14px; }
    .summary-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .code-chip { background: rgba(0,111,238,0.08); border: 1px solid rgba(0,111,238,0.2);
                 color: var(--primary); border-radius: 99px; padding: 5px 13px; font-size: 13px; cursor: pointer; font-family: inherit; }
    .code-chip b { font-family: 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.1em; }
    .link-btn { background: none; border: none; color: var(--fg-muted); font-size: 13px; cursor: pointer;
                padding: 6px 2px; font-family: inherit; text-decoration: underline; }
    .prog-label { font-size: 13px; color: var(--fg-muted); margin-bottom: 7px; }
    .prog-label b { color: var(--fg); }
    .prog-label .count { font-weight: 800; color: var(--fg); }
    .bar { height: 9px; background: var(--bg-sec); border: 1px solid var(--border); border-radius: 99px; overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; border-radius: 99px; background: var(--lv, var(--primary)); transition: width .4s ease; }
    .badge-row { display: flex; flex-wrap: wrap; gap: 7px; }
    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 6px 10px; border-radius: 10px;
             font-size: 12px; font-weight: 700; border: 1px solid var(--border); background: var(--card-bg); }
    .badge.on { border-color: transparent; color: #fff; }
    .badge.off { color: var(--fg-muted); opacity: .6; }

    /* ===== 책장 툴바 (레벨 칩 + 검색) — blocks-universe toolbar 패턴 ===== */
    .toolbar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
    .level-chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
    .level-chips::-webkit-scrollbar { display: none; }
    .lv-chip { flex: 0 0 auto; min-width: 46px; padding: 8px 12px; border-radius: 10px; border: 2px solid var(--border);
               background: var(--card-bg); color: var(--fg-muted); font-weight: 800; font-size: 14px; cursor: pointer;
               font-family: inherit; transition: transform .1s; }
    .lv-chip:active { transform: scale(.95); }
    .lv-chip.active { color: #fff; border-color: transparent; background: var(--lv); }
    .search-box input { width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: 11px;
                        background: var(--input-bg); color: var(--fg); font: inherit; font-size: 16px; }
    .search-box input:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
    .result-info { font-size: 12px; color: var(--fg-muted); margin: 2px 0 12px; }
    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--fg-muted); font-size: 14px; }

    /* ===== 책장 (Magic Chart) ===== */
    .series-card { border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 12px; background: var(--card-bg); }
    .series-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
    .series-name { font-size: 14px; font-weight: 700; }
    .series-count { font-size: 12px; font-weight: 700; color: var(--fg-muted); }
    .series-bar { height: 6px; background: var(--bg-sec); border-radius: 99px; overflow: hidden; margin-bottom: 12px; }
    .series-bar i { display: block; height: 100%; width: 0; background: var(--lv); border-radius: 99px; transition: width .3s; }
    .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
    .book-cell { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 6px 4px 4px;
                 border: none; background: none; cursor: pointer; font-family: inherit; border-radius: 10px; transition: background .15s; }
    .book-cell:hover { background: var(--bg-sec); }
    .cell-sq { position: relative; width: 100%; aspect-ratio: 1 / 1; max-width: 66px; border-radius: 12px;
               border: 2px solid var(--border); display: flex; align-items: center; justify-content: center;
               font-weight: 800; font-size: 16px; color: var(--fg-muted); background: var(--bg); transition: all .15s; }
    .book-cell.read .cell-sq { background: var(--lv); border-color: var(--lv); color: #fff; }
    .book-cell.read .cell-n { display: none; }
    .book-cell.read .cell-sq::after { content: '✓'; font-size: 22px; }
    .cell-t { font-size: 11px; line-height: 1.3; color: var(--fg-muted); text-align: center;
              display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-height: 2.6em; word-break: break-word; }
    .book-cell.read .cell-t { color: var(--fg); }

    /* ===== 검색 결과 (행) — 책장 안에서 표시 ===== */
    .result-list { display: flex; flex-direction: column; gap: 8px; }
    .result { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; text-align: left;
              padding: 12px 14px; border: 1px solid var(--border); background: var(--card-bg); border-radius: 12px; cursor: pointer;
              font-family: inherit; transition: border-color .15s; }
    .result:hover { border-color: var(--primary); }
    .r-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .r-title { font-size: 14px; font-weight: 600; color: var(--fg); }
    .r-sub { font-size: 12px; color: var(--fg-muted); }
    .r-lvdot { display: inline-block; width: 8px; height: 8px; border-radius: 99px; margin-right: 5px; vertical-align: middle; background: var(--lv); }
    .r-check { flex: none; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--border);
               color: var(--fg-muted); white-space: nowrap; }
    .result.read .r-check { background: var(--success); border-color: var(--success); color: #fff; }
    .result.read .r-title { color: var(--fg-muted); }

    .loading { text-align: center; color: var(--fg-muted); padding: 40px 0; font-size: 14px; }

<body data-shell="column" data-width="medium">

  <script>
  (function () {
    'use strict';

    /* ───────── 상수 ───────── */
    const LEVELS = ['1+', '2', '3', '4', '5', '6', '7', '8', '9'];
    const LEVEL_COLORS = {
      '1+': '#ec6aa6', '2': '#e3424d', '3': '#dca100', '4': '#3a8fd0', '5': '#34a85a',
      '6': '#ec7c2a', '7': '#1fab9b', '8': '#8257c4', '9': '#b8860b'
    };
    const SERIES_ORDER = [
      'First Sentences', 'More First Sentences A', 'More First Sentences B', 'More First Sentences C',
      'Stories', 'More Stories A', 'More Stories B', 'More Stories C',
      'Patterned Stories', 'More Patterned Stories',
      'Decode and Develop', 'More A Decode and Develop',
      "Floppy's Fiction", "Floppy's Fiction A"
    ];
    const MILESTONES = [10, 25, 50, 100];
    const CODE_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    const CODE_LEN = 6;

    /* ───────── 저장소 (Phase 1: localStorage) ───────── */
    const LocalStore = {
      _code: null,
      _reads: {},
      _load() {
        try { this._reads = JSON.parse(localStorage.getItem('readtree:reads:' + this._code) || '{}') || {}; }
        catch { this._reads = {}; }
      },
      _save() {
        try { localStorage.setItem('readtree:reads:' + this._code, JSON.stringify(this._reads)); } catch {}
      },
      getCode() { return this._code || localStorage.getItem('readtree:code') || null; },
      setCode(code) { this._code = code; try { localStorage.setItem('readtree:code', code); } catch {} this._load(); },
      clearCode() { try { localStorage.removeItem('readtree:code'); } catch {} this._code = null; this._reads = {}; },
      getReads() { return this._reads; },
      isRead(id) { return !!this._reads[id]; },
      toggle(id) {
        if (this._reads[id]) { delete this._reads[id]; } else { this._reads[id] = today(); }
        this._save();
        return !!this._reads[id];
      }
    };
    const Store = LocalStore;

    /* ───────── 서버 동기화 (Phase 2: byeduin 전용 D1 /api/readtree) ─────────
       로컬(localStorage)이 항상 우선. 로그인 시 pull(서버→로컬 머지·로컬→서버 보충),
       토글 시 push(단건 PUT/DELETE). 오프라인/엔드포인트 없으면 자동 무시(로컬만 동작). */
    const API_URL = '/api/readtree';
    const Sync = {
      on: true,
      async pull(code) {
        if (!this.on || !code) return false;
        let server;
        try {
          const r = await fetch(API_URL + '?code=' + encodeURIComponent(code), { cache: 'no-store' });
          if (!r.ok) return false;
          server = (await r.json()).reads || {};
        } catch { return false; }
        const local = Store.getReads();
        let changed = false;
        for (const id in server) {
          if (!local[id] || server[id] > local[id]) { local[id] = server[id]; changed = true; }
        }
        if (changed) Store._save();
        for (const id in local) {
          if (!(id in server) || local[id] > server[id]) this.push(code, id, true, local[id]);
        }
        return changed;
      },
      push(code, bookId, isRead, readAt) {
        if (!this.on || !code) return;
        fetch(API_URL, {
          method: isRead ? 'PUT' : 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, bookId, readAt }),
        }).catch(() => { /* 오프라인: 로컬 유지, 다음 로그인 동기화 때 재시도 */ });
      }
    };

    function today() {
      const d = new Date();
      const p = (n) => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
    }
    function genCode() {
      let out = '';
      const rnd = (window.crypto && crypto.getRandomValues)
        ? crypto.getRandomValues(new Uint32Array(CODE_LEN))
        : Array.from({ length: CODE_LEN }, () => Math.floor(Math.random() * 4294967296));
      for (let i = 0; i < CODE_LEN; i++) out += CODE_ALPHABET[rnd[i] % CODE_ALPHABET.length];
      return out;
    }

    /* ───────── 데이터 ───────── */
    let BOOKS = [];
    let GROUPED = {};
    let SERIES_KEYS = {};
    let fuse = null;
    let activeLevel = '1+';

    function groupData() {
      GROUPED = {}; SERIES_KEYS = {};
      LEVELS.forEach(l => { GROUPED[l] = {}; });
      BOOKS.forEach(b => {
        if (!GROUPED[b.level]) GROUPED[b.level] = {};
        (GROUPED[b.level][b.series] = GROUPED[b.level][b.series] || []).push(b);
      });
      LEVELS.forEach(l => {
        Object.values(GROUPED[l]).forEach(arr => arr.sort((a, c) => a.id.localeCompare(c.id)));
        SERIES_KEYS[l] = Object.keys(GROUPED[l]).sort((a, c) => {
          const ia = SERIES_ORDER.indexOf(a), ic = SERIES_ORDER.indexOf(c);
          return (ia < 0 ? 99 : ia) - (ic < 0 ? 99 : ic) || a.localeCompare(c);
        });
      });
    }
    function buildFuse() {
      if (window.Fuse) fuse = new Fuse(BOOKS, { keys: [{ name: 'title', weight: 0.8 }, { name: 'series', weight: 0.2 }], threshold: 0.3, ignoreLocation: true, minMatchCharLength: 2 });
    }
    function searchBooks(q) {
      q = q.trim();
      if (!q) return [];
      if (fuse) return fuse.search(q).slice(0, 60).map(r => r.item);
      const lq = q.toLowerCase();
      return BOOKS.filter(b => b.title.toLowerCase().includes(lq) || b.series.toLowerCase().includes(lq)).slice(0, 60);
    }

    function readCount() { return Object.keys(Store.getReads()).length; }
    function levelTotal(l) { return BOOKS.filter(b => b.level === l).length; }
    function levelRead(l) { return BOOKS.filter(b => b.level === l && Store.isRead(b.id)).length; }

    /* ───────── DOM 헬퍼 ───────── */
    const $ = (s, r) => (r || document).querySelector(s);
    const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
    function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function cssEsc(s) { return (window.CSS && CSS.escape) ? CSS.escape(s) : String(s).replace(/["\\]/g, '\\$&'); }
    function curQuery() { return ($('#searchInput').value || '').trim(); }

    /* ───────── 요약 (코드 · 진행 · 뱃지) ───────── */
    function renderSummary() {
      $('#homeCode').textContent = Store.getCode() || '------';
      $('#readCount').textContent = readCount();
      $('#totalCount').textContent = BOOKS.length;
      const focus = LEVELS.find(l => levelRead(l) < levelTotal(l)) || LEVELS[LEVELS.length - 1];
      const fr = levelRead(focus), ft = levelTotal(focus) || 1;
      $('#focusLevel').textContent = focus;
      $('#focusProg').textContent = fr + '/' + ft;
      const bar = $('#focusBar');
      bar.style.setProperty('--lv', LEVEL_COLORS[focus]);
      bar.style.width = Math.round((fr / ft) * 100) + '%';
      renderBadges();
    }
    function renderBadges() {
      const row = $('#badgeRow'); row.innerHTML = '';
      const total = readCount();
      LEVELS.forEach(l => {
        const done = levelTotal(l) > 0 && levelRead(l) === levelTotal(l);
        const b = el('span', 'badge ' + (done ? 'on' : 'off'), (done ? '🏅' : '🔒') + ' Lv ' + l);
        if (done) b.style.background = LEVEL_COLORS[l];
        row.appendChild(b);
      });
      MILESTONES.forEach(m => {
        const done = total >= m;
        const b = el('span', 'badge ' + (done ? 'on' : 'off'), (done ? '⭐' : '☆') + ' ' + m + '권');
        if (done) b.style.background = 'var(--primary)';
        row.appendChild(b);
      });
    }

    /* ───────── 레벨 칩 ───────── */
    function renderLevelChips() {
      const q = curQuery();
      const wrap = $('#levelChips'); wrap.innerHTML = '';
      LEVELS.forEach(l => {
        const active = !q && l === activeLevel;
        const t = el('button', 'lv-chip' + (active ? ' active' : ''), 'Lv ' + l);
        t.style.setProperty('--lv', LEVEL_COLORS[l]);
        t.addEventListener('click', () => { $('#searchInput').value = ''; activeLevel = l; render(); });
        wrap.appendChild(t);
      });
    }

    /* ───────── 메인 렌더 (검색 모드 / 레벨 모드) ───────── */
    function render() {
      renderLevelChips();
      if (curQuery()) renderResults(); else renderLevel();
    }

    function renderLevel() {
      const level = activeLevel;
      const body = $('#shelfBody'); body.innerHTML = ''; $('#emptyState').hidden = true;
      $('#resultInfo').textContent = 'Lv ' + level + ' · 읽음 ' + levelRead(level) + '/' + levelTotal(level) + '권';
      (SERIES_KEYS[level] || []).forEach(series => {
        const books = GROUPED[level][series];
        const card = el('div', 'series-card');
        card.dataset.key = level + '|' + series;
        card.style.setProperty('--lv', LEVEL_COLORS[level]);
        const readN = books.filter(b => Store.isRead(b.id)).length;
        card.innerHTML =
          '<div class="series-head"><span class="series-name">' + esc(series) + '</span>' +
          '<span class="series-count">' + readN + '/' + books.length + '</span></div>' +
          '<div class="series-bar"><i style="width:' + Math.round(readN / books.length * 100) + '%"></i></div>';
        const grid = el('div', 'book-grid');
        books.forEach((b, i) => {
          const read = Store.isRead(b.id);
          const cell = el('button', 'book-cell' + (read ? ' read' : ''));
          cell.dataset.id = b.id;
          cell.style.setProperty('--lv', LEVEL_COLORS[b.level]);
          cell.setAttribute('aria-pressed', String(read));
          cell.title = b.title;
          cell.innerHTML = '<span class="cell-sq"><span class="cell-n">' + (i + 1) + '</span></span>' +
                           '<span class="cell-t">' + esc(b.title) + '</span>';
          cell.addEventListener('click', () => toggleRead(b.id));
          grid.appendChild(cell);
        });
        card.appendChild(grid);
        body.appendChild(card);
      });
    }

    function renderResults() {
      const q = curQuery();
      const res = searchBooks(q);
      const body = $('#shelfBody'); body.innerHTML = '';
      $('#resultInfo').textContent = res.length + '개 결과';
      if (!res.length) { $('#emptyState').hidden = false; return; }
      $('#emptyState').hidden = true;
      const list = el('div', 'result-list');
      res.forEach(b => {
        const read = Store.isRead(b.id);
        const r = el('button', 'result' + (read ? ' read' : ''));
        r.dataset.id = b.id;
        r.style.setProperty('--lv', LEVEL_COLORS[b.level]);
        r.setAttribute('aria-pressed', String(read));
        r.innerHTML =
          '<span class="r-main"><span class="r-title">' + esc(b.title) + '</span>' +
          '<span class="r-sub"><span class="r-lvdot"></span>Lv ' + esc(b.level) + ' · ' + esc(b.series) + '</span></span>' +
          '<span class="r-check">' + (read ? '읽음 ✓' : '읽었어요') + '</span>';
        r.addEventListener('click', () => toggleRead(b.id));
        list.appendChild(r);
      });
      body.appendChild(list);
    }

    /* ───────── 읽음 토글 (모든 표시 위치 동기화) ───────── */
    function toggleRead(id) {
      const now = Store.toggle(id);
      const book = BOOKS.find(b => b.id === id);
      document.querySelectorAll('[data-id="' + cssEsc(id) + '"]').forEach(node => {
        node.classList.toggle('read', now);
        if (node.hasAttribute('aria-pressed')) node.setAttribute('aria-pressed', String(now));
        const chk = node.querySelector('.r-check');
        if (chk) chk.textContent = now ? '읽음 ✓' : '읽었어요';
      });
      if (book) {
        const card = document.querySelector('.series-card[data-key="' + cssEsc(book.level + '|' + book.series) + '"]');
        if (card) {
          const books = GROUPED[book.level][book.series];
          const rn = books.filter(b => Store.isRead(b.id)).length;
          card.querySelector('.series-count').textContent = rn + '/' + books.length;
          card.querySelector('.series-bar i').style.width = Math.round(rn / books.length * 100) + '%';
        }
        if (!curQuery() && book.level === activeLevel)
          $('#resultInfo').textContent = 'Lv ' + activeLevel + ' · 읽음 ' + levelRead(activeLevel) + '/' + levelTotal(activeLevel) + '권';
      }
      renderSummary();
      Sync.push(Store.getCode(), id, now, Store.getReads()[id]);
    }

    /* ───────── 로그인 / 진입 ───────── */
    function enterApp() {
      $('#loginView').hidden = true;
      $('#appView').hidden = false;
      renderSummary();
      render();
      Sync.pull(Store.getCode()).then((changed) => { if (changed) { renderSummary(); render(); } });
    }
    function login(code) {
      code = (code || '').toUpperCase().replace(/\s/g, '');
      const err = $('#loginErr');
      if (!/^[A-Z0-9]{6}$/.test(code)) { err.textContent = '6자리 코드를 입력해 주세요 (영문·숫자).'; return; }
      err.textContent = '';
      Store.setCode(code);
      enterApp();
    }

    /* ───────── 이벤트 ───────── */
    function wire() {
      $('#loginBtn').addEventListener('click', () => login($('#codeInput').value));
      $('#codeInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') login($('#codeInput').value); });
      $('#genBtn').addEventListener('click', () => {
        const c = genCode();
        $('#newCodeVal').textContent = c;
        $('#newCodeBox').hidden = false;
        $('#useCodeBtn').onclick = () => login(c);
      });
      $('#logoutBtn').addEventListener('click', () => {
        Store.clearCode();
        $('#appView').hidden = true;
        $('#loginView').hidden = false;
        $('#codeInput').value = '';
        $('#newCodeBox').hidden = true;
        $('#searchInput').value = '';
      });
      $('#searchInput').addEventListener('input', render);
      $('#codeChip').addEventListener('click', () => {
        const c = Store.getCode(); if (!c) return;
        if (navigator.clipboard) navigator.clipboard.writeText(c).catch(() => {});
        const chip = $('#codeChip'); const old = chip.innerHTML;
        chip.textContent = '복사됨 ✓';
        setTimeout(() => { chip.innerHTML = old; }, 1200);
      });
    }

    /* ───────── 부트 ───────── */
    async function boot() {
      wire();
      try {
        const res = await fetch('./booklist.json', { cache: 'no-cache' });
        const data = await res.json();
        BOOKS = (data.books || []).filter(b => b && b.id && b.title && b.level);
      } catch (e) {
        BOOKS = [];
      }
      groupData();
      buildFuse();
      if (Store.getCode()) { Store.setCode(Store.getCode()); enterApp(); }
      else { $('#loginView').hidden = false; $('#appView').hidden = true; }
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  })();
  </script>
</body>
</html>

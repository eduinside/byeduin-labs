<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>도서 정보 수집 — eduin</title>
  <link rel="stylesheet" href="/common/hero-theme.css">
  <link rel="stylesheet" href="/common/app-shell.css">
  <script src="/common/theme.js"></script>
  <script src="/common/init.js"></script>
  <script src="/common/app-shell.js" defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Inter', sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 64px 16px 80px;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(0,111,238,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,111,238,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none; z-index: 0;
    }

    .page-wrap {
      max-width: 440px;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    /* 표 영역은 별도로 확대 */
    #tableSection {
      margin: 0 auto;
      max-width: 800px;
      width: 100%;
      padding: 0 16px;
    }

    /* 링크 입력 영역 */
    .section-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--fg-muted);
      letter-spacing: 0.03em;
      margin-bottom: 0.4rem;
    }

    textarea.hero-input {
      resize: vertical;
      min-height: 150px;
      font-size: 0.875rem;
      line-height: 1.7;
    }

    /* 진행 상태 바 */
    .progress-wrap {
      margin-top: 0.75rem;
      display: none;
    }
    .progress-wrap.visible { display: block; }

    .progress-bar-bg {
      height: 4px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 0.35rem;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 99px;
      transition: width 0.3s ease;
      width: 0%;
    }

    .progress-text {
      font-size: 0.75rem;
      color: var(--fg-muted);
    }

    /* 화살표 */
    .fetch-arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.4rem 0;
      color: var(--border);
    }
    .fetch-arrow svg {
      opacity: 0.5;
    }

    /* textarea 스크롤바 */
    textarea.hero-input {
      scrollbar-color: var(--border) transparent;
      scrollbar-width: thin;
    }
    textarea.hero-input::-webkit-scrollbar {
      width: 8px;
    }
    textarea.hero-input::-webkit-scrollbar-track {
      background: transparent;
    }
    textarea.hero-input::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }
    textarea.hero-input::-webkit-scrollbar-thumb:hover {
      background: var(--fg-muted);
    }

    /* 테이블 */
    .table-wrap {
      overflow: auto;
      margin-top: 1.5rem;
      border-radius: 1rem;
      border: 1px solid var(--border);
      scrollbar-color: var(--border) transparent;
      scrollbar-width: thin;
    }
    .table-wrap::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    .table-wrap::-webkit-scrollbar-track {
      background: transparent;
    }
    .table-wrap::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }
    .table-wrap::-webkit-scrollbar-thumb:hover {
      background: var(--fg-muted);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
      min-width: 560px;
    }

    thead th {
      background: var(--card-bg);
      color: var(--fg-muted);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 0.7rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
    }
    tbody tr:last-child { border-bottom: none; }

    tbody tr:hover { background: var(--bg-sec); }

    tbody tr.error-row td { color: var(--danger); }

    td {
      padding: 0.7rem 1rem;
      vertical-align: middle;
      color: var(--fg);
    }

    td.num { color: var(--fg-muted); font-size: 0.75rem; width: 36px; text-align: center; }
    td.title { font-weight: 500; }
    td.title .isbn { display: block; margin-top: 2px; font-size: 0.72rem; font-weight: 400; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
    tbody tr.error-row td.title .isbn { color: var(--danger); }
    td.price { white-space: nowrap; }
    td.qty { width: 90px; }
    td.del { width: 52px; text-align: center; }

    .qty-input {
      width: 64px;
      padding: 0.3rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      background: var(--input-bg);
      color: var(--fg);
      font-size: 0.875rem;
      font-family: inherit;
      text-align: center;
    }
    .qty-input:focus { outline: none; border-color: var(--primary); }

    .del-btn {
      background: none;
      border: none;
      color: var(--fg-muted);
      cursor: pointer;
      min-width: 44px;
      min-height: 44px;
      padding: 4px;
      border-radius: 6px;
      line-height: 1;
      font-size: 1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .del-btn:hover { color: var(--danger); background: rgba(243,18,96,0.07); }

    /* 하단 액션 버튼 */
    .action-row {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }

    .action-row .hero-btn,
    .action-row .hero-btn-ghost { flex: 1; min-width: 0; }

    /* 통계 */
    .stats-row {
      display: flex;
      gap: 1rem;
      margin-top: 0.75rem;
      font-size: 0.78rem;
      color: var(--fg-muted);
      flex-wrap: wrap;
    }

    .stats-row span { white-space: nowrap; }
    .stats-row strong { color: var(--fg); }
    .stats-row .fail-stat, .stats-row .fail-stat strong { color: var(--danger); }

    .action-row .hero-btn-danger { flex: 0 1 auto; }

    /* 빈 상태 */
    .empty-state {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--fg-muted);
      font-size: 0.875rem;
      line-height: 1.7;
    }

    /* 실패한 링크 목록 */
    .fail-box {
      margin-top: 1rem;
      padding: 0.75rem 0.9rem;
      border: 1px solid color-mix(in srgb, var(--danger) 45%, transparent);
      border-radius: 0.75rem;
      background: color-mix(in srgb, var(--danger) 6%, transparent);
      font-size: 0.8rem;
      line-height: 1.6;
    }
    .fail-box[hidden] { display: none; }
    .fail-box-title { margin: 0 0 0.35rem; font-weight: 700; color: var(--danger); display: flex; align-items: center; gap: 0.35rem; }
    .fail-box ul { margin: 0; padding-left: 1.1rem; }
    .fail-box li { margin: 0.2rem 0; color: var(--fg); }
    .fail-box .fail-link { word-break: break-all; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 0.75rem; }
    .fail-box .fail-why { color: var(--fg-muted); }

    @media (pointer: coarse) {
      .qty-input { min-height: 44px; }
    }

    @media (max-width: 540px) {
      .page-wrap { padding-top: 56px; }
      .overlay-btn span { display: none; }
      /* iOS 확대 방지: 입력칸 16px */
      textarea.hero-input, .qty-input { font-size: 16px; }
      #tableSection { padding: 0; }

      /* 휴대폰: 표를 줄마다 카드처럼(수량·삭제가 화면 안에 보이도록) */
      .table-wrap table { min-width: 0; }
      .table-wrap thead { display: none; }
      .table-wrap tbody tr {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        align-items: center;
        column-gap: 0.5rem;
        padding: 0.6rem 0.25rem 0.6rem 0.85rem;
      }
      .table-wrap td { padding: 0; }
      .table-wrap td.num { display: none; }
      .table-wrap td.title { grid-column: 1; grid-row: 1; }
      .table-wrap td.author, .table-wrap td.publisher, .table-wrap td.price { grid-column: 1; font-size: 0.78rem; color: var(--fg-muted); }
      .table-wrap td.author { grid-row: 2; }
      .table-wrap td.publisher { grid-row: 3; }
      .table-wrap td.price { grid-row: 4; }
      .table-wrap td.author:empty, .table-wrap td.publisher:empty { display: none; }
      .table-wrap td.qty { grid-column: 2; grid-row: 1 / span 4; width: auto; }
      .table-wrap td.del { grid-column: 3; grid-row: 1 / span 4; width: auto; }
      .table-wrap .qty-input { width: 56px; }
      tbody tr.error-row td.author, tbody tr.error-row td.publisher, tbody tr.error-row td.price { display: none; }
    }
  </style>
</head>
<body data-shell="column" data-width="narrow">

  <!-- 상단 좌측: 돌아가기 -->
  <div class="top-overlay-left">
    <a href="./" class="overlay-btn" title="도서 정보 나눔으로 돌아가기" aria-label="도서 정보 나눔으로 돌아가기">
      <i data-icon="arrow-left"></i>
      <span>돌아가기</span>
    </a>
  </div>

  <!-- 상단 우측: 테마·입력 -->
  <div class="top-overlay">
    <button type="button" id="themeToggleBtn" class="overlay-btn" onclick="cycleTheme()" title="화면 모드" aria-label="화면 모드"><i data-icon="monitor"></i></button>
    <a href="./" class="overlay-btn" title="ISBN을 넣어 책 정보 조회하기" aria-label="ISBN 입력 화면으로">
      <i data-icon="pencil"></i>
      <span>ISBN 입력</span>
    </a>
  </div>

  <div class="page-wrap">

    <!-- 앱 헤더 -->
    <div class="app-header">
      <div class="app-badge">◆ 소셜</div>
      <h1 class="app-title">도서 정보 수집 <span class="app-title-en">Book Gather</span></h1>
      <p class="app-desc">여러 사람이 '링크로 공유'한 주소(단축 주소 포함)를 붙여넣으면 책 정보를 모두 모아 한 표로 정리합니다. 같은 책은 수량을 합치고, 엑셀 파일로 내려받거나 다시 공유할 수 있습니다.</p>
    </div>

    <!-- 링크 입력 -->
    <div style="margin-bottom:1rem">
      <label class="section-label" for="linkInput">링크 목록</label>
      <textarea class="hero-input" id="linkInput"
        placeholder="단축 주소나 공유 링크를 붙여넣으세요. 줄바꿈·공백·쉼표 모두 OK.&#10;&#10;예)&#10;https://go.eduin.info/b5Ycho"></textarea>
    </div>

    <!-- 수집 버튼 + 진행 상태 -->
    <button type="button" class="hero-btn" id="gatherBtn" onclick="startGather()" style="width:100%">
      <span data-icon="combine"></span> 수집 시작
    </button>

    <div class="progress-wrap" id="gatherProgressWrap">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="gatherProgressFill"></div>
      </div>
      <div class="progress-text" id="gatherProgressText" role="status" aria-live="polite"></div>
    </div>

    <!-- 화살표 (수집 후 표시) -->
    <!-- 실패한 링크 (수집 후, 실패가 있을 때만) -->
    <div class="fail-box" id="failBox" role="alert" hidden></div>

    <!-- 화살표 (수집 후 표시) -->
    <div class="fetch-arrow" id="gatherArrow" style="display:none">
      <span data-icon="arrow-down" style="font-size:18px"></span>
    </div>

    <div id="emptyState" class="empty-state" style="display:none">
      아직 모은 책이 없어요.<br>
      도서 정보 나눔에서 <strong>링크로 공유</strong>로 받은 주소들을 위 칸에 붙여넣고 <strong>수집 시작</strong>을 눌러 보세요.
    </div>

  </div>

  <!-- 결과 테이블 -->
  <div id="tableSection" style="display:none">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="num">#</th>
            <th>도서명 · ISBN</th>
            <th>저자</th>
            <th>출판사</th>
            <th>정가</th>
            <th>주문수량</th>
            <th aria-label="삭제"></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <div class="stats-row" id="statsRow"></div>

    <div class="action-row">
      <button type="button" class="hero-btn" id="excelBtn" onclick="exportExcel()">
        <span data-icon="download"></span>
        엑셀 내려받기
      </button>
      <button type="button" class="hero-btn hero-btn-ghost share-btn" id="shareBtn" onclick="shareList()">
        <span data-icon="share-2"></span>
        링크로 공유
      </button>
      <button type="button" class="hero-btn hero-btn-danger" onclick="confirmReset()">
        <span data-icon="trash-2"></span>
        전체 초기화
      </button>
    </div>
  </div>

  <!-- 토스트·공유 창은 공용 VUI (/common/ui.js) -->
  <!-- SheetJS는 엑셀 내려받기를 누를 때만 불러온다(gather.js loadXLSX) -->

  <!-- 공용 이스케이프·숫자 검증 헬퍼 (VSafe) -->
  <script src="/common/safe.js"></script>

  <!-- 공용 UI (VUI: 토스트·공유 인코딩/링크 창·apiFetch) -->
  <script src="/common/ui.js"></script>

  <!-- gather.js -->
  <script src="./gather.js"></script>

</body>
</html>

  <style>
    body {
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(124,106,247,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124,106,247,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .site-header, main { position: relative; z-index: 1; }

    .site-header {
      padding: 2rem 1.5rem 1rem;
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-group img {
      width: 32px;
      height: 32px;
    }

    .logo-title {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .logo-title span {
      color: var(--primary);
    }

    .logo-sub {
      font-size: 0.8rem;
      color: var(--fg-muted);
      margin-top: 1px;
    }

    main {
      padding: 0 1.5rem 5rem;
      max-width: 1280px;

    }

    /* ── 트리 네비 레이아웃 ── */
    .page-layout {
      display: flex;
      gap: 2rem;
      align-items: flex-start;
    }

    /* 사이드바 */
    .tree-sidebar {
      width: 220px;
      flex-shrink: 0;
      position: sticky;
      top: 1.5rem;
    }

    .sidebar-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--fg-muted);
      margin-bottom: 0.5rem;
      padding: 0 0.5rem;
    }

    .tree-nav {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .tree-node > .tree-item {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      width: 100%;
      padding: 0.45rem 0.5rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      background: none;
      border: none;
      color: var(--fg);
      text-align: left;
      transition: background 0.15s, color 0.15s;
      text-decoration: none;
    }
    .tree-node > .tree-item:hover {
      background: rgba(124,106,247,0.08);
    }
    .tree-node > .tree-item.is-active {
      background: rgba(0,111,238,0.1);
      color: var(--primary);
    }

    .tree-chevron {
      font-size: 0.6rem;
      margin-left: auto;
      transition: transform 0.2s;
      color: var(--fg-muted);
      flex-shrink: 0;
    }
    .tree-node.is-open > .tree-item .tree-chevron { transform: rotate(90deg); }

    /* 서브트리 */
    .subtree {
      list-style: none;
      padding: 0 0 0 1rem;
      margin: 0;
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.25s ease;
    }
    .tree-node.is-open > .subtree {
      max-height: 20rem;
    }

    .subtree-item {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      width: 100%;
      padding: 0.35rem 0.5rem;
      border-radius: 0.4rem;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      background: none;
      border: none;
      color: var(--fg-muted);
      text-align: left;
      transition: background 0.15s, color 0.15s;
      text-decoration: none;
    }
    .subtree-item:hover { background: rgba(124,106,247,0.06); color: var(--fg); }
    .subtree-item.is-active { color: var(--primary); font-weight: 600; }

    /* 모바일: 사이드바 접기 토글 */
    .sidebar-toggle {
      display: none;
      align-items: center;
      gap: 0.4rem;
      width: 100%;
      padding: 0.5rem 0.75rem;
      margin-bottom: 0.5rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 0.6rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--fg);
      cursor: pointer;
    }

    /* 콘텐츠 영역 */
    .content-area {
      flex: 1;
      min-width: 0;
    }

    /* 넓은 화면: 4열 그리드 */
    @media (min-width: 1024px) {
      .content-area .card-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    /* 태블릿: 사이드바 접힘 */
    @media (max-width: 860px) {
      .page-layout { flex-direction: column; gap: 0.5rem; }
      .tree-sidebar { width: 100%; position: static; }
      .sidebar-toggle { display: flex; }
      .tree-nav { display: none; }
      .tree-sidebar.is-open .tree-nav { display: block; }
    }

    /* 카테고리 섹션 */
    .category-section {
      margin-bottom: 2.5rem;
    }

    .category-header {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .category-label {
      font-size: 1rem;
      font-weight: 700;
    }

    .category-desc {
      font-size: 0.8rem;
      color: var(--fg-muted);
    }

    /* 카드 그리드 */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.875rem;
    }

    @media (max-width: 640px) {
      .card-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 400px) {
      .card-grid {
        grid-template-columns: 1fr;
      }
    }

    /* 앱 카드 */
    .app-card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.25rem;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
      position: relative;
    }

    .app-card:hover {
      border-color: rgba(0, 111, 238, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0, 111, 238, 0.1);
    }

    .card-emoji {
      font-size: 1.5rem;
      margin-bottom: 0.625rem;
    }

    .card-title {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 0.25rem;
    }

    .card-desc {
      font-size: 0.8rem;
      color: var(--fg-muted);
      line-height: 1.4;

      position: absolute;
      top: 0.625rem;
      right: 0.75rem;
      font-size: 0.7rem;
      color: var(--fg-muted);
      opacity: 0.6;

    footer {

      border-top: 1px solid var(--border);
    }

    /* 모달 */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      padding: 1rem;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s;

    .modal-backdrop.open { opacity: 1; pointer-events: auto; }
    .modal-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 1.75rem;
      max-width: 420px;
      width: 100%;
      transform: translateY(12px);
      transition: transform 0.2s;
    }
    .modal-backdrop.open .modal-box { transform: translateY(0); }
    .modal-badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(0,111,238,0.1); border: 1px solid rgba(0,111,238,0.25);
      color: var(--primary); font-size: 10px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      padding: 3px 9px; border-radius: 99px; margin-bottom: 12px;
    }
    .modal-badge::before { content: '◆'; font-size: 7px; }
    .modal-title {
      font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px;
    }
    .modal-desc {
      font-size: 0.85rem; color: var(--fg-muted); line-height: 1.65; margin-bottom: 16px;
    }
    .modal-features {
      list-style: none; padding: 0; margin: 0 0 20px;
      display: flex; flex-direction: column; gap: 7px;

    .modal-features li {
      font-size: 0.82rem; color: var(--fg-muted);
      display: flex; align-items: flex-start; gap: 7px;
    }
    .modal-features li::before {
      content: '✓'; color: var(--primary); font-weight: 700; flex-shrink: 0; margin-top: 1px;

    .modal-actions {
      display: flex; gap: 8px; flex-direction: column;
    }
    .modal-btn-primary {
      display: block; text-align: center; text-decoration: none;
      background: var(--primary); color: #fff;
      border: none; border-radius: 0.75rem;
      padding: 12px 16px; font-size: 0.9rem; font-weight: 700;
      cursor: pointer; transition: background 0.15s;
    }
    .modal-btn-primary:hover { background: var(--primary-h); }
    .modal-btn-ghost {
      display: block; text-align: center;
      background: none; color: var(--fg-muted);
      border: 1px solid var(--border); border-radius: 0.75rem;
      padding: 10px 16px; font-size: 0.85rem; font-weight: 500;
      cursor: pointer; transition: border-color 0.15s;
    }
    .modal-btn-ghost:hover { border-color: var(--fg-muted); }

    /* 모달 타입 카드 — 클릭 커서만 다름 */
    .app-card.modal-card { cursor: pointer; }

    /* 최근 방문: 넓은 화면에서 4열 */
    .recent-section .card-grid {
      grid-template-columns: repeat(4, 1fr);
    }

    /* 최근 방문: 좁은 화면에서 2열 한 행 (3번째 이후 숨김) */
    @media (max-width: 640px) {
      .recent-section .card-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .recent-section .card-grid .app-card:nth-child(n+3) {
        display: none;
      }
    }

    /* 아래 앱 섹션에서 최근 방문 앱 강조 (채도 낮춤) */
    .app-card.is-recent-visited {
      border-color: rgba(124, 106, 247, 0.6);
      border-width: 2px;
    }
    .app-card.is-recent-visited:hover {
      border-color: rgba(124, 106, 247, 0.8);
    }

    /* 공지사항 섹션 — 아코디언 */
    .notices-list {
      border: 1px solid var(--border);
      border-radius: 1rem;
      background: var(--card-bg);
      overflow: hidden;
    }
    .notice-item { border-bottom: 1px solid var(--border); }
    .notice-item:last-child { border-bottom: none; }
    .notice-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
      padding: 0.8rem 1rem;
      background: none;
      border: none;
      cursor: pointer;
      color: inherit;
      font: inherit;
      text-align: left;
      transition: background 0.15s;
    }
    .notice-header:hover { background: rgba(124, 106, 247, 0.06); }
    .notice-item.is-pinned .notice-header { background: rgba(124, 106, 247, 0.05); }
    .notice-item.is-pinned .notice-title { font-weight: 700; }
    /* 펼쳐진 항목 — 흰 배경(텍스트 읽기 영역) */
    .notice-item.is-open { background: var(--bg); }
    .notice-item.is-open .notice-header:hover { background: transparent; }
    .notice-title {
      flex: 1 1 auto;
      min-width: 0;
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .notice-date {
      flex: 0 0 auto;
      font-size: 0.75rem;
      color: var(--fg-muted);
      font-variant-numeric: tabular-nums;
    }
    .notice-chevron {
      flex: 0 0 auto;
      font-size: 0.7rem;
      color: var(--fg-muted);
      transition: transform 0.2s;
    }
    .notice-item.is-open .notice-chevron { transform: rotate(180deg); }
    .notice-body {
      max-height: 0;
      overflow: hidden;
      padding: 0 1rem;
      transition: max-height 0.25s ease, padding 0.25s ease;
    }
    .notice-item.is-open .notice-body {
      max-height: 30rem;
      padding: 0 1rem 0.9rem;
    }
    .notice-summary {
      margin: 0 0 0.7rem;
      font-size: 0.82rem;
      line-height: 1.6;
      color: var(--fg-muted);
    }
    .notice-go {
      display: inline-block;
      text-decoration: none;
      background: transparent;
      color: var(--fg-muted);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 0.6rem;
      font-size: 0.78rem;
      font-weight: 600;
      transition: border-color 0.15s, color 0.15s;
    }
    .notice-go:hover { border-color: var(--primary); color: var(--primary); }
    /* 로딩 스켈레톤 — 실제 notice-header와 동일한 높이로 고정(레이아웃 점프 방지) */
    .notice-skeleton {
      display: flex;
      align-items: center;
      padding: 0.8rem 1rem;
      border-bottom: 1px solid var(--border);
      box-sizing: border-box;
    }
    .notice-skeleton:last-child { border-bottom: none; }
    .notice-skeleton::before {
      content: '';
      height: 0.9rem;
      width: 58%;
      border-radius: 5px;
      background: var(--border);
      animation: noticeShimmer 1.3s ease-in-out infinite;
    }
    .notice-skeleton::after {
      content: '';
      height: 0.75rem;
      width: 4rem;
      border-radius: 5px;
      background: var(--border);
      animation: noticeShimmer 1.3s ease-in-out infinite 0.2s;
      margin-left: auto;
    }
    @keyframes noticeShimmer { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.85; } }
    .notices-more {
      margin-left: auto;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--primary);
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .notices-more:hover { text-decoration: underline; }
    @media (max-width: 480px) {
      .notice-date { display: none; }
    }
  </style>

    </div>
  </header>

  <main id="main"></main>

  <footer>eduin · built with vibe coding</footer>

  <!-- 모달 -->
  <div class="modal-backdrop" id="appModal" onclick="closeModal(event)">
    <div class="modal-box">
      <div class="modal-badge" id="modalBadge"></div>
      <div class="modal-title" id="modalTitle"></div>
      <p class="modal-desc" id="modalDesc"></p>
      <ul class="modal-features" id="modalFeatures"></ul>

        <a id="modalLink" href="#" class="modal-btn-primary" target="_blank" rel="noopener noreferrer"></a>

      </div>
    </div>

  <!-- 우상단 테마 토글 + 공유 -->
  <div class="top-overlay">
    <button id="themeToggleBtn" class="overlay-btn" onclick="cycleTheme()" title="보기 모드">💻</button>
    <button id="shareBtn" class="overlay-btn" onclick="shareCurrentPage()" title="공유">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
        <polyline points="16 6 12 2 8 6"/>
        <line x1="12" x2="12" y1="2" y2="15"/>
      </svg>
      <span>공유</span>
    </button>
  </div>

  <script>
    /* =============================================
       앱 데이터: apps.json에서 로드
       ============================================= */
    let APPS = [];
    let CATEGORIES = [];

    async function loadApps() {
      try {
        const res = await fetch('/apps.json');
        const data = await res.json();
        APPS = data.apps || [];
        CATEGORIES = data.categories || [];
      } catch (e) {
        console.error('[apps.json] 로드 실패:', e);
      }
    }

    /* =============================================
       렌더링
       ============================================= */
    function saveRecentApp(app) {
      const KEY = 'byeduin_recent_apps';
      let list = JSON.parse(localStorage.getItem(KEY) || '[]');
      list = list.filter(a => a.href !== app.href);
      list.unshift({ href: app.href, emoji: app.emoji, title: app.title, desc: app.desc, category: app.category });
      if (list.length > 10) list = list.slice(0, 10);
      localStorage.setItem(KEY, JSON.stringify(list));
    }

    const DEFAULT_NOTICES_CFG = { mode: 'recent', recentLimit: 5, pinned: [] };

    function formatNoticeDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return '';
      return d.toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });
    }

    async function loadNoticesConfig() {
      try {
        const res = await fetch('/notices.json', { cache: 'no-cache' });
        if (!res.ok) return DEFAULT_NOTICES_CFG;
        const c = await res.json();
        return {
          mode: ['recent', 'pinned', 'both'].includes(c.mode) ? c.mode : 'recent',
          recentLimit: Math.min(20, Math.max(1, parseInt(c.recentLimit, 10) || 5)),
          pinned: Array.isArray(c.pinned) ? c.pinned.filter(p => p && p.link) : [],
        };
      } catch { return DEFAULT_NOTICES_CFG; }
    }

    async function renderNoticesSection(main) {
      // ── 스켈레톤을 await 이전에 동기로 그려서 페이지 로드 즉시 공간 확보 ──
      const SKELETON_COUNT = 4;
      const section = document.createElement('section');
      section.className = 'category-section notices-section';
      section.innerHTML = `
        <div class="category-header">
          <span class="category-label">📢 공지사항</span>
          <span class="category-desc">에듀인 블로그 소식</span>
        </div>
        <div class="notices-list"></div>
      `;
      const list = section.querySelector('.notices-list');
      for (let i = 0; i < SKELETON_COUNT; i++) {
        const sk = document.createElement('div');
        sk.className = 'notice-skeleton';
        list.appendChild(sk);
      }
      const more = document.createElement('a');
      more.className = 'notices-more';
      more.href = 'https://blog.eduin.info/';
      more.target = '_blank'; more.rel = 'noopener noreferrer';
      more.textContent = '전체 공지 보기 →';
      section.querySelector('.category-header').appendChild(more);
      main.prepend(section); // 항상 <main> 최상단

      // ── 이후 비동기로 설정·데이터 로드 ──
      const cfg = await loadNoticesConfig();
      const wantRecent = cfg.mode === 'recent' || cfg.mode === 'both';
      const wantPinned = (cfg.mode === 'pinned' || cfg.mode === 'both') && cfg.pinned.length > 0;
      if (!wantRecent && !wantPinned) { section.remove(); return; }

      // 최신글 (recent/both 모드에서 RSS 로드) — 1시간 localStorage 캐시
      let recent = [];
      if (wantRecent) {
        const CACHE_KEY = 'byeduin_notices_cache';
        const CACHE_TTL = 60 * 60 * 1000; // 1시간
        try {
          const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
          if (cached && Date.now() - cached.ts < CACHE_TTL) {
            recent = cached.posts;
            if (cached.source) more.href = cached.source;
          } else {
            const res = await fetch('/api/notices?limit=' + cfg.recentLimit);
            if (res.ok) {
              const data = await res.json();
              recent = Array.isArray(data.posts) ? data.posts : [];
              if (data.source) more.href = data.source;
              localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), posts: recent, source: data.source || '' }));
            }
          }
        } catch (e) { console.error('[notices] 로드 실패:', e); }
      }

      // 지정글: 제목·요약 없으면 최신글에서 link 매칭으로 보완
      const byLink = new Map(recent.map(p => [p.link, p]));
      const pinned = wantPinned ? cfg.pinned.map(p => {
        const hit = byLink.get(p.link);
        return {
          title: p.title || (hit && hit.title) || p.link,
          link: p.link,
          date: p.date || (hit && hit.date) || '',
          summary: p.summary || (hit && hit.summary) || '',
          pinned: true,
        };
      }) : [];

      // both: 최신글에서 지정글과 중복 제거
      const pinnedLinks = new Set(pinned.map(p => p.link));
      const recentShown = wantRecent ? recent.filter(p => !pinnedLinks.has(p.link)) : [];

      const items = [...pinned, ...recentShown];

      // 스켈레톤 제거 후 실제 항목 렌더 (표시할 게 없으면 섹션 숨김)
      list.innerHTML = '';
      if (items.length === 0) { section.remove(); return; }

      items.forEach(post => {
        if (!post || !post.title || !post.link) return;

        const item = document.createElement('div');
        item.className = 'notice-item' + (post.pinned ? ' is-pinned' : '');

        // ── 헤더(클릭 시 아코디언 토글) ──
        const header = document.createElement('button');
        header.type = 'button';
        header.className = 'notice-header';
        header.setAttribute('aria-expanded', 'false');

        const titleEl = document.createElement('span');
        titleEl.className = 'notice-title';
        titleEl.textContent = (post.pinned ? '📌 ' : '') + post.title; // XSS 안전
        titleEl.title = post.title;

        const dateEl = document.createElement('span');
        dateEl.className = 'notice-date';
        dateEl.textContent = formatNoticeDate(post.date);

        const chev = document.createElement('span');
        chev.className = 'notice-chevron';
        chev.textContent = '▾';

        header.appendChild(titleEl);
        header.appendChild(dateEl);
        header.appendChild(chev);

        // ── 본문(펼침 영역): 요약 + 이동 버튼 ──
        const body = document.createElement('div');
        body.className = 'notice-body';
        if (post.summary) {
          const p = document.createElement('p');
          p.className = 'notice-summary';
          p.textContent = post.summary; // XSS 안전
          body.appendChild(p);
        }
        const go = document.createElement('a');
        go.className = 'notice-go';
        go.href = post.link;
        go.target = '_blank';
        go.rel = 'noopener noreferrer';
        go.textContent = '글 보러가기 →';
        body.appendChild(go);

        // ── 아코디언 토글(한 번에 하나만 열림) ──
        header.addEventListener('click', () => {
          const isOpen = item.classList.contains('is-open');
          list.querySelectorAll('.notice-item.is-open').forEach(el => {
            el.classList.remove('is-open');
            const h = el.querySelector('.notice-header');
            if (h) h.setAttribute('aria-expanded', 'false');
          });
          if (!isOpen) {
            item.classList.add('is-open');
            header.setAttribute('aria-expanded', 'true');
          }
        });

        item.appendChild(header);
        item.appendChild(body);
        list.appendChild(item);
      });
    }

    function renderRecentSection(main) {
      const KEY = 'byeduin_recent_apps';
      const list = JSON.parse(localStorage.getItem(KEY) || '[]').slice(0, 4);
      if (list.length === 0) return;

      const section = document.createElement('section');
      section.className = 'category-section recent-section';
      section.innerHTML = `
        <div class="category-header">
          <span class="category-label">⏱ 최근 방문</span>
          <span class="category-desc">최근에 사용한 앱</span>
        </div>
        <div class="card-grid" id="grid-recent"></div>
      `;
      main.appendChild(section);

      const grid = section.querySelector('#grid-recent');
      list.forEach(app => {
        const a = document.createElement('a');
        a.className = 'app-card';
        a.href = app.href;
        a.innerHTML = `
          <div class="card-emoji">${app.emoji}</div>
          <div class="card-title">${app.title}</div>
          <div class="card-desc">${app.desc}</div>
        `;
        a.addEventListener('click', () => saveRecentApp(app));
        grid.appendChild(a);
      });
    }

    /* ── 서브카테고리 정의 (apps.json 없이 JS 하드코딩) ── */
    const SUBCATS = {
      edu: [
        { id: 'edu-sim',   label: '🌐 시뮬레이션', appIds: ['moon-phase', 'volcano', 'step-squad', 'clubs'] },
        { id: 'edu-learn', label: '📖 학습지원',   appIds: ['flash-deck', 'chalkboard'] },
        { id: 'edu-work',  label: '💼 업무경감',   appIds: ['scoring-table', 'file-tools', 'timer', 'allowance-calculator', 'login-helper', 'search'] },
      ],
      utility: [
        { id: 'util-life',     label: '🔧 생활편의',     appIds: ['md-editor', 'qr'] },
        { id: 'util-chrome',   label: '🧩 크롬확장',     appIds: ['content-id-viewer', 'mp4-finder'] },
        { id: 'util-social',   label: '💬 소셜',         appIds: ['book-share', 'bubble-chat', 'edulink'] },
        { id: 'util-creative', label: '🎨 크리에이티브', appIds: ['yt-thumb', 'grid-maker', 'signage-maker'] },
        { id: 'util-notion',   label: '📐 노션도구',     appIds: ['embed', 'notion-image-downloader', 'notion-styler'] },
      ],
    };

    function buildSidebar(categories) {
      const sidebar = document.createElement('nav');
      sidebar.className = 'tree-sidebar';

      // 모바일 토글 버튼
      const toggle = document.createElement('button');
      toggle.className = 'sidebar-toggle';
      toggle.innerHTML = '☰ 카테고리 &nbsp;<span style="margin-left:auto;font-size:0.7rem;color:var(--fg-muted)">▾</span>';
      toggle.addEventListener('click', () => sidebar.classList.toggle('is-open'));
      sidebar.appendChild(toggle);

      const p = document.createElement('div');
      p.className = 'sidebar-label';
      p.textContent = '카테고리';
      sidebar.appendChild(p);

      const ul = document.createElement('ul');
      ul.className = 'tree-nav';
      sidebar.appendChild(ul);

      categories.forEach(cat => {
        const hasChildren = !!(SUBCATS[cat.id] && SUBCATS[cat.id].length > 0);
        const li = document.createElement('li');
        li.className = 'tree-node' + (hasChildren ? ' is-open' : '');
        li.dataset.catId = cat.id;

        const btn = document.createElement('button');
        btn.className = 'tree-item';
        btn.type = 'button';
        btn.innerHTML = cat.label + (hasChildren ? '<span class="tree-chevron">▶</span>' : '');
        btn.addEventListener('click', () => {
          if (hasChildren) {
            li.classList.toggle('is-open');
          } else {
            scrollToSection(cat.id);
          }
        });
        li.appendChild(btn);

        if (hasChildren) {
          const sub = document.createElement('ul');
          sub.className = 'subtree';
          SUBCATS[cat.id].forEach(sc => {
            const sli = document.createElement('li');
            const sbtn = document.createElement('button');
            sbtn.className = 'subtree-item';
            sbtn.type = 'button';
            sbtn.dataset.subcatId = sc.id;
            sbtn.textContent = sc.label;
            sbtn.addEventListener('click', () => scrollToSection(sc.id));
            sli.appendChild(sbtn);
            sub.appendChild(sli);
          });
          li.appendChild(sub);
        }
        ul.appendChild(li);
      });

      return sidebar;
    }

    function scrollToSection(id) {
      const el = document.getElementById('section-' + id);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function setActiveNav(id) {
      document.querySelectorAll('.tree-item, .subtree-item').forEach(el => el.classList.remove('is-active'));
      const active = document.querySelector(`[data-cat-id="${id}"] > .tree-item, .subtree-item[data-subcat-id="${id}"]`);
      if (active) active.classList.add('is-active');
    }

    function setupScrollSpy(sectionIds) {
      const targets = sectionIds.map(id => document.getElementById('section-' + id)).filter(Boolean);
      if (!targets.length) return;
      const obs = new IntersectionObserver((entries) => {
        entries.forEach(e => { if (e.isIntersecting) setActiveNav(e.target.dataset.navId); });
      }, { rootMargin: '-20% 0px -60% 0px' });
      targets.forEach(el => obs.observe(el));
    }

    function renderCardGrid(container, items, mostRecentHref) {
      items.forEach(app => {
        const isModal = app.type === 'modal';
        const isExternal = !isModal && (app.type === 'link' || app.external);
        const a = document.createElement('a');
        const isRecentVisited = !isModal && app.href === mostRecentHref;
        a.className = 'app-card' + (isModal ? ' modal-card' : '') + (isRecentVisited ? ' is-recent-visited' : '');
        if (isModal) {
          a.href = '#';
          a.addEventListener('click', (e) => { e.preventDefault(); openModal(app); });
        } else {
          a.href = app.href;
          if (isExternal) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
          a.addEventListener('click', () => saveRecentApp(app));
        }
        a.innerHTML = `
          ${isExternal ? '<span class="external-badge">↗</span>' : ''}
          ${isModal ? '<span class="external-badge">ℹ</span>' : ''}
          <div class="card-emoji">${app.emoji}</div>
          <div class="card-title">${app.title}</div>
          <div class="card-desc">${app.desc}</div>
        `;
        container.appendChild(a);
      });
    }

    function render() {
      const main = document.getElementById('main');
      main.innerHTML = '';

      // 공지사항: 비동기 하이드레이션 (prepend로 항상 최상단, page-layout 위)
      renderNoticesSection(main);

      // 페이지 레이아웃 컨테이너 (사이드바 + 콘텐츠)
      const layout = document.createElement('div');
      layout.className = 'page-layout';
      main.appendChild(layout);

      // 사이드바 빌드
      const sidebar = buildSidebar(CATEGORIES);
      layout.appendChild(sidebar);

      // 콘텐츠 영역
      const content = document.createElement('div');
      content.className = 'content-area';
      layout.appendChild(content);

      // 가장 최근 방문 앱(1개)만 하이라이트
      const KEY = 'byeduin_recent_apps';
      const recentList = JSON.parse(localStorage.getItem(KEY) || '[]');
      const mostRecentHref = recentList.length > 0 ? recentList[0].href : null;

      renderRecentSection(content);

      const spyIds = [];

      CATEGORIES.forEach(cat => {
        const allItems = APPS.filter(a => a.category === cat.id);
        if (allItems.length === 0) return;

        const subcats = SUBCATS[cat.id];

        const section = document.createElement('section');
        section.className = 'category-section';
        section.id = 'section-' + cat.id;
        section.dataset.navId = cat.id;
        spyIds.push(cat.id);

        if (subcats) {
          // 카테고리 헤더만 (그리드 없음 — 서브카트별 렌더)
          section.innerHTML = `
            <div class="category-header">
              <span class="category-label">${cat.label}</span>
              <span class="category-desc">${cat.desc}</span>
            </div>
          `;
          content.appendChild(section);

          // 서브카테고리별 섹션
          const assignedIds = new Set(subcats.flatMap(sc => sc.appIds));
          const unassigned = allItems.filter(a => !assignedIds.has(a.id));

          subcats.forEach(sc => {
            const scItems = sc.appIds.map(id => APPS.find(a => a.id === id)).filter(Boolean);
            if (!scItems.length) return;

            const scSec = document.createElement('section');
            scSec.className = 'category-section';
            scSec.id = 'section-' + sc.id;
            scSec.dataset.navId = sc.id;
            scSec.style.marginTop = '0';
            spyIds.push(sc.id);

            scSec.innerHTML = `
              <div class="category-header" style="border-bottom-style:dashed; opacity:0.75;">
                <span class="category-label" style="font-size:0.85rem;">${sc.label}</span>
              </div>
              <div class="card-grid"></div>
            `;
            renderCardGrid(scSec.querySelector('.card-grid'), scItems, mostRecentHref);
            content.appendChild(scSec);
          });

          // 서브카테고리 미배정 앱 (있으면 기타로 추가)
          if (unassigned.length > 0) {
            const extra = document.createElement('div');
            extra.innerHTML = `<div class="card-grid"></div>`;
            renderCardGrid(extra.querySelector('.card-grid'), unassigned, mostRecentHref);
            content.appendChild(extra);
          }
        } else {
          section.innerHTML = `
            <div class="category-header">
              <span class="category-label">${cat.label}</span>
              <span class="category-desc">${cat.desc}</span>
            </div>
            <div class="card-grid" id="grid-${cat.id}"></div>
          `;
          content.appendChild(section);
          renderCardGrid(section.querySelector(`#grid-${cat.id}`), allItems, mostRecentHref);
        }
      });

      // 스크롤 스파이 — 렌더 완료 후 설정
      requestAnimationFrame(() => setupScrollSpy(spyIds));
    }

    // 앱 데이터 로드 후 렌더링
    loadApps().then(() => render());

    function openModal(app) {
      document.getElementById('modalBadge').textContent = app.badge || '';
      document.getElementById('modalTitle').textContent = app.emoji + ' ' + app.title;
      document.getElementById('modalDesc').textContent = app.modalDesc || app.desc;
      const ul = document.getElementById('modalFeatures');
      ul.innerHTML = (app.features || []).map(f => `<li><span>${f}</span></li>`).join('');
      const link = document.getElementById('modalLink');
      link.href = app.href;
      link.textContent = app.linkLabel || '바로가기';
      if (app.external) { link.target = '_blank'; link.rel = 'noopener noreferrer'; }
      else { link.removeAttribute('target'); link.removeAttribute('rel'); }
      document.getElementById('appModal').classList.add('open');
    }

    function closeModal(e) {
      if (e.target === document.getElementById('appModal')) {
        document.getElementById('appModal').classList.remove('open');
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') document.getElementById('appModal').classList.remove('open');
    });
  </script>

</body>

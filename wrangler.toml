name = "byeduin-vives"
compatibility_date = "2024-11-21"
pages_build_output_dir = "public"

# byeduin 전용 D1 — Read Tree(및 향후 byeduin 앱) 공용 DB.
# database_id는 `npx wrangler d1 create byeduin` 후 출력값으로 교체하면 원격 배포 가능.
# (로컬 dev는 .wrangler 로컬 SQLite를 사용하므로 placeholder로도 동작)
[[d1_databases]]
binding = "BYEDUIN_DB"
database_name = "byeduin"
database_id = "00000000-0000-0000-0000-000000000000"

name = "byeduin-labs"
compatibility_date = "2024-11-21"
pages_build_output_dir = "dist"

# byeduin 전용 D1 — Read Tree(및 향후 byeduin 앱) 공용 DB.
[[d1_databases]]
binding = "BYEDUIN_DB"
database_name = "byeduin"
database_id = "ff743381-4df4-43a6-bfc3-2e93a417daed"

# byeduin 공용 R2 — 여러 앱이 키 프리픽스로 구분해 공유(마당은 madang/BOARD_ID/파일명).
[[r2_buckets]]
binding = "MEDIA_R2"
bucket_name = "byeduin-media"

name: CI (빌드 + 스모크 테스트)

# 배포는 Cloudflare Pages Git 연동 빌드가 한다. 여기서는 배포하지 않고
# 빌드가 되는지, 각 페이지에 잡히지 않은 스크립트 오류가 없는지만 확인한다.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build

      # 러너 이미지에 들어 있는 Chrome을 쓴다. 브라우저를 따로 설치하던 단계
      # (playwright-core install --with-deps)가 2026-11-11에 10분 멈췄다 실패해 없앴다.
      - name: 스모크 테스트
        run: npm run smoke
        env:
          SMOKE_CHANNEL: chrome
